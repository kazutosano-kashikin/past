<body class="text-slate-800 min-h-screen">
<header class="bg-indigo-900 text-white sticky top-0 z-10"><div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
<b>貸金業務取扱主任者 過去問 <span class="text-amber-300 text-xs">R5〜R7 全150問</span></b>
<nav class="text-sm space-x-3"><button onclick="show('quiz')">演習</button><button onclick="show('log')">実績</button><button onclick="show('ana')">分析</button></nav></div></header>
<main class="max-w-3xl mx-auto p-4">
<section id="quiz">
 <div id="setup" class="bg-white rounded-xl border p-5 space-y-4">
  <h2 class="font-bold">出題設定</h2>
  <div class="grid sm:grid-cols-3 gap-3 text-sm">
   <label>年度<select id="fy" class="w-full border rounded p-2"><option value="">全年度</option><option>令和7年度</option><option>令和6年度</option><option>令和5年度</option></select></label>
   <label>分野<select id="fc" class="w-full border rounded p-2"><option value="">全分野</option></select></label>
   <label>問題数<select id="fn" class="w-full border rounded p-2"><option>10</option><option>20</option><option>50</option><option value="0">全て</option></select></label>
  </div>
  <div class="text-sm space-x-4"><label><input type="checkbox" id="sh" checked> シャッフル</label><label><input type="checkbox" id="lc" checked> 解答回数が少ない問題を優先</label><label><input type="checkbox" id="wr"> 直近で間違えた問題のみ</label></div>
  <button onclick="start()" class="bg-indigo-600 text-white font-bold rounded-lg px-6 py-2">開始</button>
  <p class="text-xs text-slate-500">正答は日本貸金業協会公表の公式正答です。解説は含まれていません。</p>
 </div>
 <div id="qs" class="hidden space-y-4">
  <div class="flex justify-between text-sm"><span id="prog"></span><span id="tag" class="text-slate-500"></span></div>
  <div class="bg-white rounded-xl border p-4 space-y-3">
   <p id="stem" class="pre font-medium"></p><div id="items" class="space-y-2 text-sm"></div><div id="opts" class="space-y-2"></div>
   <div id="fb" class="hidden space-y-2"><p id="res" class="font-bold"></p><div id="ex" class="space-y-1 text-xs"></div><p id="note" class="pre text-xs text-slate-600"></p><button onclick="next()" class="bg-indigo-600 text-white rounded-lg px-5 py-2 text-sm">次へ →</button></div>
  </div>
 </div>
 <div id="done" class="hidden bg-indigo-900 text-white rounded-xl p-6 text-center space-y-3"><h2 class="text-xl font-bold">終了</h2><p id="score" class="text-3xl font-black"></p><button onclick="reset()" class="bg-amber-400 text-slate-900 font-bold rounded-lg px-5 py-2">設定に戻る</button></div>
</section>
<section id="log" class="hidden space-y-4">
 <div class="bg-white rounded-xl border p-4 space-y-2"><div class="flex justify-between"><b>学習実績</b><span class="text-xs space-x-2"><button onclick="exp()" class="text-indigo-700">JSON保存</button><button onclick="csv()" class="text-indigo-700">CSV保存</button><button onclick="clr()" class="text-rose-600">初期化</button></span></div><p id="sum" class="text-sm"></p><div class="text-xs space-y-1 border-t pt-2"><p id="syn"></p><input id="url" class="w-full border rounded p-2" placeholder="GASの /exec URL を貼る"><div class="space-x-2"><button onclick="setUrl()" class="text-indigo-700">URLを保存</button><button onclick="syncNow()" class="text-indigo-700">今すぐ送信</button></div></div><div id="cats" class="space-y-2 text-xs"></div></div>
</section><section id="ana" class="hidden space-y-4">
 <div class="bg-white rounded-xl border p-4 space-y-2"><b>論点別の分析・優先度</b><p class="text-xs text-slate-500">優先度＝誤答率×3年間の出題数。正答率は3回以上解いた論点のみ判定します。</p><div id="anaTbl" class="overflow-x-auto"></div></div>
 <div class="bg-white rounded-xl border p-4 space-y-2"><b>要復習(直近の解答が不正解)</b><div id="anaWrong" class="text-xs space-y-1"></div></div>
 <div class="bg-white rounded-xl border p-4 space-y-2"><b>日別の推移(直近14日)</b><div id="anaDay" class="text-xs space-y-1"></div></div>
 <div class="bg-white rounded-xl border p-4 text-xs space-y-1"><b>対策メモ</b><div id="anaTip"></div></div>
</section></main>
<script>
const DB=[{"id":"R5-01","year":"令和5年度","qNum":1,"category":"法及び関係法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者とは、貸金業法第3条第1項の登録を受けて貸金業を営む者をいい、これには貸付けに係る契約について業として保証を行う者も含まれる。"},{"label":"b","text":"資金需要者等とは、資金需要者である顧客、債務者又は債務者であった者をいう。"},{"label":"c","text":"住宅資金貸付契約とは、住宅の建設もしくは購入に必要な資金（住宅の用に供する土地又は借地権の取得に必要な資金を含む。）又は住宅の改良に必要な資金の貸付けに係る契約をいう。"},{"label":"d","text":"手続実施基本契約とは、紛争解決等業務の実施に関し指定紛争解決機関と貸金業者との間で締結される契約をいう。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":2,"explanation":"a不適切:貸付けに係る契約について業として保証を行う者は貸金業者に含まれない。b不適切:資金需要者等は債務者等(保証人等)も含む概念。c・dは適切。適切は2個。","topic":"登録・届出・監督処分","exps":["× 保証を業として行う者は貸金業者に含まれない","× 資金需要者等には債務者等(保証人等)も含まれる","○ 住宅資金貸付契約の定義(改良資金を含む)どおり","○ 手続実施基本契約の定義どおり"]},{"id":"R5-02","year":"令和5年度","qNum":2,"category":"法及び関係法令","stem":"次のａ～ｄの記述のうち、貸金業法第6条第1項各号のいずれかに該当する者として貸金業の登録を拒否されるものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"破産手続開始の決定を受けて復権を得た日から5年を経過しない者"},{"label":"b","text":"出資法(注)の規定に違反し、罰金の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者"},{"label":"c","text":"貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消された株式会社の取締役を当該取消しの日の30日前に退任した者であって、当該取消しの日から5年を経過しないもの"},{"label":"d","text":"株式会社であって、その常務に従事する取締役がすべて、貸金業者以外の金融機関での貸付けの業務に3年以上従事した経験を有するが、貸金業者での貸付けの業務に従事した経験を有しないもの(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":3,"explanation":"拒否されるのはb・c。b:出資法違反の罰金は執行終了から5年間拒否事由。c:取消し前30日以内に取締役だった者は5年間対象。a:復権を得れば拒否事由に当たらない。d:貸金業者以外の金融機関での貸付経験でも3年以上あれば足りる。","topic":"登録・届出・監督処分","exps":["× 復権を得た者は拒否事由に当たらない","○ 出資法違反の罰金は、執行終了から5年間拒否事由","○ 取消し前30日以内に取締役だった者は5年間拒否事由(要確認)","× 貸金業者以外の金融機関での貸付経験でも要件を満たす"]},{"id":"R5-03","year":"令和5年度","qNum":3,"category":"法及び関係法令","stem":"貸金業者向けの総合的な監督指針における反社会的勢力による被害の防止について、監督当局が貸金業者を監督するに当たって留意することとされている事項に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"反社会的勢力との関係を遮断するための対応を総括する部署（以下、本問において「反社会的勢力対応部署」という。）を整備し、反社会的勢力による被害を防止するための一元的な管理態勢が構築され、機能しているか。一元的な管理態勢の構築に当たっては、反社会的勢力対応部署において反社会的勢力に関する情報を積極的に収集・分析するとともに、当該情報を一元的に管理したデータベースを構築し、適切に更新（情報の追加、削除、変更等）する体制となっているか。"},{"label":"b","text":"反社会的勢力との取引を未然に防止するため、反社会的勢力に関する情報等を活用した適切な事前審査を実施するとともに、契約書や取引約款への暴力団排除条項の導入を徹底するなど、反社会的勢力が取引先となることを防止しているか。"},{"label":"c","text":"反社会的勢力との取引が判明した場合、直ちに取引を解消することは、貸金業者が回収不能による経済的損失を被り、当該回収不能の結果として反社会的勢力が利益を得ることとなるほか、役職員の安全が脅かされる等不測の事態が危惧されるため、弁済が滞る又は不当な要求行為等があるまで、契約解消は行わないこととしているか。"},{"label":"d","text":"反社会的勢力からの不当要求に対しては、あらゆる民事上の法的対抗手段を講ずるとともに、積極的に被害届を提出するなど、刑事事件化も躊躇しない対応を行うこととしているか。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":3,"explanation":"cが不適切:反社会的勢力との取引が判明した場合は、取引解消に向けた適切な対応が求められる(回収不能を理由に維持してよいとはしない)。a・b・dは指針の着眼点どおりで3個。","topic":"登録・届出・監督処分","exps":["○ 反社会的勢力対応部署による一元的な管理態勢","○ 事前審査と暴力団排除条項の導入","× 取引が判明した場合は、取引解消に向けた適切な対応が求められる","○ 法的対抗手段と刑事事件化も躊躇しない対応"]},{"id":"R5-04","year":"令和5年度","qNum":4,"category":"法及び関係法令","stem":"貸金業務取扱主任者（以下、本問において「主任者」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["主任者は、その職務に関し貸金業に関する法令の規定に違反したことによりその主任者登録(注1)の取消しの処分を受けたときは、その処分の日から5年間主任者登録を受けることができない。","主任者登録の更新は、登録講習機関(注2)が行う講習で主任者登録の有効期間満了日前6か月以内に行われるものを受けることによりなされ、更新の申請をする必要はない。","貸金業者向けの総合的な監督指針によれば、貸金業者が営業所又は事務所（以下、本問において「営業所等」という。）に設置する主任者は、勤務する営業所等が1つに決まっているだけでなく、営業時間内に、その営業所等に常時駐在していることが必要であるとされている。","貸金業者は、その営業所等における唯一の主任者が定年退職したことにより当該営業所等に主任者を欠くに至ったときは、その日から2週間以内に新たな主任者を設置するか、又は当該営業所等を廃止しなければならない。"],"note":"(注1) 主任者登録とは、貸金業法第24条の25（貸金業務取扱主任者の登録）第1項\nの登録をいう。\n(注2) 登録講習機関とは、貸金業法第24条の36（登録講習機関の登録）第1項に規\n定する内閣総理大臣の登録を受けた者をいう。","correct":1,"explanation":"①適切:職務に関する法令違反による主任者登録の取消しは、処分日から5年間再登録不可。②更新には申請が必要、③指針は営業時間内の常時駐在までは求めていない、④欠員時は営業所廃止に限らず必要な措置をとる。","topic":"主任者・社内体制","exps":["○ 登録取消しの処分日から5年間は再登録できない","× 主任者登録の更新には申請が必要","× 指針は営業時間内の常時駐在までは求めない(要確認)","× 欠員時の対応の記述が異なる(要確認)"]},{"id":"R5-05","year":"令和5年度","qNum":5,"category":"法及び関係法令","stem":"貸金業法第13条（返済能力の調査）第3項及び同法第13条の3（基準額超過極度方式基本契約に係る調査）第3項に規定する内閣府令で定めるもの（貸金業法施行規則第10条の17第1項に規定される源泉徴収票その他の当該個人顧客の収入又は収益その他の資力を明らかにする書面等。以下、本問において「年収証明書」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、これまで契約を一切締結していない個人顧客との間で、貸付けの金額が60万円の貸付けに係る契約を締結しようとする場合において、指定信用情報機関が保有する信用情報を使用して返済能力の調査を行った結果、当該顧客に対する他の貸金業者の貸付けの残高が30万円であり、自らの貸付けの金額と他の貸金業者の貸付けの残高の合計額が100万円未満であることが判明した。この場合、当該貸金業者は、当該顧客から年収証明書の提出又は提供を受ける必要はない。"},{"label":"b","text":"貸金業者は、これまで契約を一切締結していない個人顧客との間で貸付けに係る契約を締結するに際し、年収証明書の提出又は提供を受けなければならない場合において、年収証明書として給与の支払明細書の提出を受けるときは、当該給与の支払明細書は、直近1年以内の間に発行された任意の2か月分以上のものでなければならない。"},{"label":"c","text":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、年収証明書のうちの所得証明書について、例えば、行政サービスの一環として地方公共団体が交付する所得・課税証明書は、地方税法等に発行の根拠がなくても、所得証明書に含まれるとされている。"},{"label":"d","text":"監督指針によれば、個人顧客につき貸金業法第13条第3項本文各号のいずれか又は同法第13条の3第3項本文に該当することを確認した場合において、当該個人顧客から年収証明書の提出を受けられないなど当該個人顧客の年収を把握できないときは、当該個人顧客の返済能力を確認できないことから、貸金業法第13条の2（過剰貸付け等の禁止）第1項により貸付けの契約（極度方式貸付けに係る契約を含む。）を締結できないことに留意する必要があるとされている。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":4,"explanation":"c・dが適切:地方公共団体が行政サービスとして交付する所得・課税証明書も年収証明書に該当。年収を確認できない場合は貸付けを行えない。a・bは数値・期間の記述が基準と異なり不適切。","topic":"返済能力調査・過剰貸付け","exps":["× 年収証明書が必要となる要件の記述が異なる(要確認)","× 年収証明書の取得に関する記述が異なる(要確認)","○ 行政サービスとして交付される所得・課税証明書も年収証明書に該当","○ 指針に沿った内容"]},{"id":"R5-06","year":"令和5年度","qNum":6,"category":"法及び関係法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定する契約（以下、本問において「除外契約」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"住宅の改良に必要な資金の貸付けに係る契約であっても、当該住宅を担保としないものは、除外契約に該当しない。"},{"label":"b","text":"自動車の購入に必要な資金の貸付けに係る契約であっても、当該自動車の所有権を貸金業者が取得し、又は当該自動車が譲渡により担保の目的となっていないものは、除外契約に該当しない。"},{"label":"c","text":"個人顧客の親族の健康保険法第115条第1項及び第147条に規定する高額療養費を支払うために必要な資金の貸付けに係る契約であっても、当該親族が当該個人顧客と生計を一にしていないものは、除外契約に該当しない。"},{"label":"d","text":"個人顧客の不動産を担保とする貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるものであっても、当該不動産が当該個人顧客の居宅であるものは、除外契約に該当しない。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":3,"explanation":"b・c・dは除外契約に該当せず適切(自動車は所有権取得・譲渡担保が要件、親族は生計を一にすること、居宅担保は除外されない)。a不適切:住宅の改良資金の貸付けは担保の有無を問わず除外契約。適切は3個。","topic":"返済能力調査・過剰貸付け","exps":["× 住宅の改良資金の貸付けは、担保の有無を問わず除外契約に該当","○ 自動車購入資金は、所有権取得・譲渡担保が除外契約の要件","○ 生計を一にしない親族の高額療養費は除外されない","○ 居宅を担保とする貸付けは除外契約に含まれない"]},{"id":"R5-07","year":"令和5年度","qNum":7,"category":"法及び関係法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で極度方式基本契約（以下、本問において「本件基本契約」という。）を締結している場合において、貸金業法第13条の3第2項に基づく、3か月以内の期間（以下、本問において「所定の期間」という。）ごとに、指定信用情報機関が保有する当該個人顧客に係る信用情報を使用して、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）を行う場合等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","items":[],"choices":["Ａは、本件調査をしなければならない場合において、Ｂに係る極度方式個人顧客合算額が80万円であったときは、本件調査を行うに際し、Ｂから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。","Ａは、所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高が10万円であるときは、本件調査をする必要がない。","Ａは、Ｂに対し、利息の支払の遅延を理由に本件基本契約に基づく新たな極度方式貸付けを停止する措置を講じている。この場合、Ａは、所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高が20万円であるときは、本件調査をしなければならない。","Ａは、本件調査をしたところ、本件基本契約は、基準額超過極度方式基本契約に該当すると認められた。この場合、Ａは、本件基本契約に基づく新たな極度方式貸付けの停止又は本件基本契約の解除のいずれかの措置を講じなければならない。"],"note":"","correct":2,"explanation":"②適切:所定期間末日の残高が10万円以下なら調査不要。①極度方式個人顧客合算額が100万円超でなければ年収証明書は不要、④必要な措置は極度額の減額または新規貸付けの停止(解除ではない)。","topic":"返済能力調査・過剰貸付け","exps":["× 極度方式個人顧客合算額が80万円なら年収証明書は不要(100万円超等の要件)","○ 所定期間の末日の残高が10万円以下なら調査不要","× 新規貸付けの停止中の調査要否の記述が異なる(要確認)","× 措置は新たな貸付けの停止または極度額の減額(要確認)"]},{"id":"R5-08","year":"令和5年度","qNum":8,"category":"法及び関係法令","stem":"貸金業の業務に関する広告又は勧誘についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者の従業者が、当該貸金業者の貸金業の業務に関して顧客に対し勧誘をするに際し、貸付けの条件について著しく事実に相違する説明をした場合、当該貸金業者は、行政処分の対象となるが、刑事罰の対象とはならない。","日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則（以下、本問において「自主規制規則」という。）によれば、協会員は、個人向け貸付けの契約に係る広告をテレビCM、新聞広告、雑誌広告及び電話帳広告に出稿するに当たり、協会が設ける審査機関から承認を得なければならないとされている。","自主規制規則によれば、協会員は、貸金業の業務に関して勧誘をした場合において、当該勧誘を受けた資金需要者等が、勧誘を引き続き受けることを希望しない旨の明確な意思の表示を行ったときは、当該意思表示のあった日から最低3か月間は当該勧誘に係る取引及びこれと類似する取引の勧誘を見合わせることを目処として対応しなければならないとされている。","貸金業者が、その貸金業の業務に関して広告又は勧誘をする場合において、借入れが容易であることを過度に強調することにより、資金需要者等の借入意欲をそそるような表示又は説明をしたときは、当該貸金業者がその登録を受けた内閣総理大臣又は都道府県知事は、当該貸金業者に対して、その登録を取り消すことはできないが、その必要の限度において、業務の方法の変更その他業務の運営の改善に必要な措置を命ずることができる。"],"note":"","correct":2,"explanation":"②適切(自主規制規則の広告に関する定め)。①虚偽告知等は行政処分に加え刑事罰の対象、③勧誘を希望しない旨の意思表示後の勧誘禁止期間の記述が規則と異なる、④の処分の記述も異なる。","topic":"広告・勧誘・禁止行為","exps":["× 著しく事実に相違する説明は、行政処分に加え刑事罰の対象","○ 自主規制規則の広告に関する定め","× 勧誘を希望しない旨の意思表示後の扱いが規則と異なる(要確認)","× 借入意欲をそそる表示の禁止に関する記述が異なる(要確認)"]},{"id":"R5-09","year":"令和5年度","qNum":9,"category":"法及び関係法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、顧客との間で極度方式基本契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第2項に規定する書面（当該極度方式基本契約における契約締結前の書面）を当該顧客に交付しなければならないが、当該書面の記載事項には、契約年月日、契約の相手方の商号、名称又は氏名及び住所等が含まれる。","貸金業者は、顧客との間で極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する書面（当該極度方式貸付けに係る契約における契約締結前の書面）を当該顧客に交付しなければならない。","貸金業者向けの総合的な監督指針によれば、貸金業法第16条の2に規定する契約締結前の書面を交付後、契約締結前に法令で定められた記載事項の内容に変更が生じた場合、改めて、当該契約の相手方となろうとする者に対し、契約締結前の書面の再交付を要しないことに留意する必要があるとされている。","貸金業者は、貸付けに係る契約について、保証人となろうとする者との間で保証契約を締結しようとする場合には、当該保証契約を締結するまでに、貸金業法施行規則第12条の2第7項第1号に規定する書面（当該保証契約の概要を記載した書面）及び貸金業法施行規則第12条の2第7項第2号に規定する書面（当該保証契約の詳細を記載した書面）の両方を同時に当該保証人となろうとする者に交付しなければならない。"],"note":"","correct":4,"explanation":"④適切:保証契約の締結前にも、保証契約の概要を説明する書面の交付が必要。①②③は契約締結前書面の記載・交付の定めと異なり不適切(令和7年問12参照)。","topic":"書面交付・帳簿","exps":["× 極度方式基本契約の締結前書面の記述が異なる(要確認)","× 個別の極度方式貸付けごとの締結前書面は不要","× 記載事項に変更が生じた場合は再度交付が必要(指針)","○ 保証契約の締結前にも書面の交付が必要"]},{"id":"R5-10","year":"令和5年度","qNum":10,"category":"法及び関係法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で貸付けに係る契約（以下、本問において「本件貸付契約」という。）を締結した後、Ｃとの間で本件貸付契約についての保証契約を締結することとした。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本件貸付契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","items":[{"label":"a","text":"Ａは、Ｃとの間で保証契約を締結したときは、遅滞なく、貸金業法第17条第3項に掲げる事項について当該保証契約の内容を明らかにする書面を本件貸付契約の相手方であるＢに交付しなければならない。"},{"label":"b","text":"Ａは、Ｃとの間で保証契約を締結したときは、遅滞なく、貸金業法第17条第3項に規定する書面（以下、本問において「当該保証契約における契約締結時の書面」という。）をＣに交付しなければならないが、ＣがＢと連帯して債務を負担するときは、当該保証契約における契約締結時の書面に、民法第454条（連帯保証の場合の特則）の規定の趣旨を記載しなければならない。"},{"label":"c","text":"Ａは、Ｃとの間で保証契約を締結した後、当該保証契約に基づく債務の弁済の方式を変更した場合において、当該変更がＣの利益となる変更であるときは、変更後の当該保証契約における契約締結時の書面をＣに再交付する必要はない。"},{"label":"d","text":"Ａは、Ｃとの間で保証契約を締結した場合は、遅滞なく、貸金業法第17条第1項各号に掲げる事項について本件貸付契約の内容を明らかにする書面をＣに交付しなければならない。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":3,"explanation":"b・dが適切:保証契約を締結したら保証人に保証契約の書面を、また保証人に貸付契約の内容の書面を遅滞なく交付する。a:保証契約の書面の交付先は保証人。c:弁済方式の変更は利益変更でも再交付が必要。","topic":"民法","exps":["× 保証契約の書面の交付先は保証人","○ 保証人に保証契約の書面を交付する","× 弁済方式の変更は利益変更でも再交付が必要(要確認)","○ 保証人に貸付契約の書面を交付する"]},{"id":"R5-11","year":"令和5年度","qNum":11,"category":"法及び関係法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で極度額を30万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結し、貸金業法第17条第2項に規定する書面（以下、本問において「本件基本契約に係る書面」という。）をＢに交付した。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本件基本契約は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","items":[{"label":"a","text":"Ａは、Ｂと合意の上で、本件基本契約における極度額を15万円に引き下げた後に20万円に引き上げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。"},{"label":"b","text":"Ａは、Ｂと合意の上で、本件基本契約における各回の返済期日及び返済金額の設定の方式を変更し、各回の返済金額を15,000円から10,000円に引き下げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。"},{"label":"c","text":"Ａは、Ｂと合意の上で、本件基本契約における貸付けの利率を年1割2分（12％）から年9分（9％）に引き下げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付しなければならない。"},{"label":"d","text":"Ａは、貸金業の登録の更新を受け、その登録番号の括弧書（登録回数）に変更が生じた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":2,"explanation":"a・dが適切:a極度額を元の額以下に戻す場合、d登録番号の括弧書の変更は再交付不要。b返済金額の変更は再交付が必要、c利率の引下げは再交付不要(利益となる変更)。","topic":"書面交付・帳簿","exps":["○ 極度額を元の額以下に戻す場合は再交付不要","× 返済金額の変更は再交付が必要","× 利率の引下げは再交付不要(利益となる変更)","○ 登録番号の括弧書の変更は再交付不要"]},{"id":"R5-12","year":"令和5年度","qNum":12,"category":"法及び関係法令","stem":"貸金業者が貸金業法に基づき保存すべきものに関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、貸金業法第12条の4第2項に規定する従業者名簿を、最終の記載をした日から10年間保存しなければならない。","貸金業者は、顧客と貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）を締結した場合には、内閣府令で定めるところにより、貸金業法第13条（返済能力の調査）第1項に規定する調査に関する記録を作成し、当該記録をその作成の日から10年間保存しなければならない。","貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をした場合には、内閣府令で定めるところにより、当該調査に関する記録を作成し、当該記録をその作成の日から10年間保存しなければならない。","貸金業者は、貸金業法第19条の帳簿を、貸付けの契約ごとに、当該契約を締結した日から少なくとも10年間保存しなければならない。"],"note":"","correct":1,"explanation":"①適切:従業者名簿は最終記載日から10年間保存。②③の調査記録は3年間、④帳簿は最終返済期日(債権消滅)から10年間の保存で、肢の記述は異なる。","topic":"書面交付・帳簿","exps":["○ 従業者名簿は最終記載日から10年間保存","× 契約書面等の保存期間の記述が異なる(要確認)","× 基準額超過調査の記録の保存期間の記述が異なる(要確認)","× 帳簿は最終返済期日(債権消滅)から10年(契約日からではない)"]},{"id":"R5-13","year":"令和5年度","qNum":13,"category":"法及び関係法令","stem":"貸金業者が貸付けに係る契約に基づく債権を譲渡する場合に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における債権は、抵当証券法第1条第1項に規定する抵当証券に記載された債権ではないものとする。","items":[],"choices":["貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡するに当たっては、譲受人が貸金業者である場合を除き、譲受人に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項、及びその者が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条（債権譲渡等の規制）第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","貸金業者は、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）に基づく債権を他人に譲渡した。この場合、貸金業法に規定する当該債権の内容を明らかにする書面を当該債権の債務者に遅滞なく交付しなければならないのは、当該債権の譲渡人たる貸金業者である。","貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡した場合には、当該債権に係る貸金業法第19条に規定する帳簿で当該貸金業者が作成したものを当該債権の譲受人に引き渡さなければならず、当該貸金業者はこれにより当該帳簿の保存義務を免れる。","貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡した場合、法令の規定により貸金業法第24条の規定を適用しないこととされるときを除き、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事に届け出なければならない。"],"note":"","correct":4,"explanation":"④適切:債権譲渡をした場合は、原則として2週間以内に登録行政庁へ届出(譲受けは届出事項ではない)。①通知は譲受人が貸金業者の場合も必要。②③は法令の定めと異なる。","topic":"取立て・債権譲渡","exps":["× 譲受人が貸金業者の場合も通知が必要","× 債権譲渡後の書面に関する記述が異なる(要確認)","× 帳簿の引渡しに関する記述が異なる(要確認)","○ 債権譲渡後、2週間以内に届出"]},{"id":"R5-14","year":"令和5年度","qNum":14,"category":"法及び関係法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）に規定する不祥事件（貸金業法施行規則第26条の25第1項第4号に規定する「役員又は使用人に貸金業の業務に関し法令に違反する行為又は貸金業の業務の適正な運営に支障を来す行為」をいう。）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"監督指針によれば、貸金業の業務に関し法令に違反する行為のほか、貸金業の業務に関し、資金需要者等の利益を損なうおそれのある詐欺、横領、背任等や、貸金業の業務に関し、資金需要者等から告訴、告発され又は検挙された行為は、不祥事件に該当するとされている。"},{"label":"b","text":"監督指針によれば、監督当局は、貸金業者において不祥事件が発覚し、当該貸金業者から第一報があった場合は、社内規則等に則った内部管理部門への迅速な報告及び経営陣への報告、刑罰法令に抵触しているおそれのある事実については、警察等関係機関等への通報、独立した部署（内部監査部門等）での不祥事件の調査・解明の実施を確認するものとされている。"},{"label":"c","text":"監督指針によれば、不祥事件と貸金業者の業務の適切性については、「不祥事件の発覚後の対応は適切か」、「不祥事件への経営陣の関与はないか、組織的な関与はないか」、「不祥事件の内容が資金需要者等に与える影響はどうか」、「内部牽制機能が適切に発揮されているか」、「再発防止のための改善策の策定や自浄機能は十分か、関係者の責任の追及は明確に行われているか」、「資金需要者等に対する説明や問い合わせへの対応等は適切か」の着眼点に基づき検証を行うこととされている。"},{"label":"d","text":"監督指針によれば、監督当局は、不祥事件の届出があった場合には、事実関係（当該行為が発生した営業所等、当該行為者の氏名・職名・職歴（貸金業務取扱主任者である場合にはその旨）、当該行為の概要、発覚年月日、発生期間、発覚の端緒）、発生原因分析、改善・対応策等について深度あるヒアリングを実施し、必要に応じて貸金業法第24条の6の10（報告徴収及び立入検査）に基づき報告書を徴収することにより、貸金業者の自主的な業務改善状況を把握することとされている。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":4,"explanation":"a〜dはいずれも監督指針の不祥事件に関する記述に沿った適切な内容。4個。","topic":"登録・届出・監督処分","exps":["○ 不祥事件の範囲の記述どおり","○ 第一報後の対応の記述どおり","○ 発覚後の対応・経営陣の関与等を確認する","○ 届出時に事実関係を確認する"]},{"id":"R5-15","year":"令和5年度","qNum":15,"category":"法及び関係法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で、元本額100万円、利息を年1割8分（18％）、期間を1年とする営業的金銭消費貸借契約を締結して100万円をＢに貸し付け、当該契約について、業として保証を行うＣとの間で保証契約を締結した。Ｂは、Ｃとの間で、当該保証契約に基づきＣが負う保証債務について、Ｃに元本額の3分（3％）の保証料を支払う旨の保証料の契約を締結した。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"Ａは、Ｂとの間の営業的金銭消費貸借契約における利息の約定につき、出資法(注)上、刑事罰の対象とならない。"},{"label":"b","text":"Ｃは、Ｂとの間の保証料の契約につき、出資法上、刑事罰の対象とならない。"},{"label":"c","text":"ＡとＢとの間の営業的金銭消費貸借契約における利息の約定は、利息制限法上、その全部について有効である。"},{"label":"d","text":"ＢとＣとの間の保証料の契約は、利息制限法上、その全部について有効である。(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":1,"explanation":"aのみ適切。100万円・年18%は利息制限法の上限(15%)を超え一部無効(c不適切)、出資法上は年20%以下なので利息は刑事罰対象外(a適切)。保証料を含めると上限を超えるため、b・dは不適切。","topic":"利息制限法・出資法","exps":["○ 年18%は出資法の上限(20%)以下で刑事罰の対象外","× 保証料と利息の合計が上限を超えると刑事罰の対象","× 100万円の上限は年15%で、年18%の約定は超過部分が無効","× 保証料は法定上限額を超える部分が無効"]},{"id":"R5-16","year":"令和5年度","qNum":16,"category":"法及び関係法令","stem":"みなし利息に関する次のａ～ｄの記述のうち、利息制限法上、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、顧客が金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、20,000円の弁済を受領する際に220円（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。"},{"label":"b","text":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、契約の締結及び債務の弁済の費用として公租公課の支払に充てられるべきものを当該顧客から受領した。この場合、当該費用は、利息とみなされない。"},{"label":"c","text":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、当該顧客が弁済期に弁済できなかったため、当該顧客の要請を受けて行った再度の口座振替手続に要した費用（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。"},{"label":"d","text":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客にカードを交付し、当該カードの発行の手数料（消費税額等相当額を含む。）を受領した。この場合、当該手数料は、利息とみなされない。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":1,"explanation":"a・bが適切:ATM利用料(1万円超は220円まで)と公租公課は利息とみなされない。c・dは利息とみなされるべきもの(口座振替の再手続費用、カード発行手数料)として肢の記述が誤り(c・dは要確認)。","topic":"利息制限法・出資法","exps":["○ ATM利用料(1万円超は220円まで)は利息とみなされない","○ 公租公課の支払に充てる費用は利息とみなされない","× 口座振替の再手続費用の扱いが誤り(要確認)","× カード発行手数料の扱いが誤り(要確認)"]},{"id":"R5-17","year":"令和5年度","qNum":17,"category":"法及び関係法令","stem":"貸金業法第8条（変更の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、営業所又は事務所ごとに置かれる貸金業務取扱主任者の氏名及び登録番号に変更があったときは、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","株式会社である貸金業者は、その取締役に変更があったときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所のホームページアドレスを変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。","貸金業者は、その業務の種類及び方法を変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。"],"note":"","correct":4,"explanation":"④が不適切:業務の種類・方法の変更は変更後2週間以内の届出。③適切:広告用ホームページアドレスの変更は事前の届出。①②は変更後2週間以内の届出で適切。","topic":"登録・届出・監督処分","exps":["○ 主任者の氏名・登録番号の変更は変更後2週間以内","○ 取締役の変更は変更後2週間以内","○ ホームページアドレスの変更は事前の届出","× 業務の種類・方法の変更は変更後2週間以内(事前ではない)"]},{"id":"R5-18","year":"令和5年度","qNum":18,"category":"法及び関係法令","stem":"貸金業法第10条（廃業等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者であるＡ株式会社が破産手続開始の申立てを行った場合、Ａ社は、当該申立てを行った日から30日以内に、その旨を貸金業の登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","個人である貸金業者Ｂが死亡した場合、その相続人Ｃは、Ｂが死亡したことを知った日から30日以内に、その旨を登録行政庁に届け出なければならない。","貸金業者であるＤ株式会社がＥ株式会社との合併により消滅した場合、Ｄ社の代表取締役であったＦは、当該合併によりＤ社が消滅した日から30日以内に、その旨を登録行政庁に届け出なければならない。","貸金業者であるＧ株式会社が金融サービスの提供に関する法律第12条の登録（貸金業貸付媒介業務の種別に係るものに限る。）を受けた場合、Ｇ社は、当該登録を受けた日から30日以内に、その旨を登録行政庁に届け出なければならない。"],"note":"","correct":1,"explanation":"①が不適切:破産手続開始の『申立て』は届出事由ではない(開始決定等が廃業届の事由)。③合併消滅は消滅した法人の代表役員であった者が30日以内に届出。","topic":"登録・届出・監督処分","exps":["× 破産手続開始の申立ては廃業届の事由ではない","○ 個人の死亡は、相続人が知った日から30日以内に届出","○ 合併消滅は、消滅法人の代表役員であった者が30日以内に届出","○ 登録を受けた場合の届出に関する記述"]},{"id":"R5-19","year":"令和5年度","qNum":19,"category":"法及び関係法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）における経営管理等及び業務の適切性に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["監督指針では、社内規則等については、貸金業者のそれぞれの規模・特性に応じて、創意・工夫を生かし、法令及び法の趣旨を踏まえ自主的に策定する必要があるが、その内容については貸金業協会の策定する自主規制規則に則った内容が求められるとされている。","監督指針では、適切な内部監査態勢構築の観点から、他に貸金業の業務に従事する者がいない個人の貸金業者においては、当該個人が貸金業法に規定された貸金業務取扱主任者であることをかんがみ、内部監査に代わる措置として自己の行う貸金業に関する業務の検証を行う場合には、自己検証を実施する頻度が少なくとも年1回以上となっているか等を踏まえ、業務の適切性を確保するために十分な態勢を整備しているか、等が着眼点とされている。","監督指針では、貸金業者が貸金市場の担い手としての自らの役割を十分に認識して、法令及び社内規則等を厳格に遵守し、健全かつ適切な業務運営に努めることは、貸金業者に対する資金需要者等からの信頼を確立することとなり、ひいては貸金市場の健全性を確保する上で極めて重要であるとされている。","監督指針では、金融機関においては、経営者保証に関し、経営者保証に関するガイドライン（以下、本問において「ガイドライン」という。）の趣旨や内容を十分に踏まえた適切な対応を行うことにより、ガイドラインを融資慣行として浸透・定着させていくことが求められている。"],"note":"","correct":2,"explanation":"公式正答は②。監督指針の内部監査・自己検証に関する記述のうち、②の説明が指針と異なるとされる(要確認)。","topic":"登録・届出・監督処分","exps":["○ 社内規則は規模・特性に応じて自主的に策定する","× 個人の貸金業者の自己検証の記述が指針と異なる(要確認)","○ 法令・社内規則の遵守に関する記述","○ 経営者保証ガイドラインに関する記述"]},{"id":"R5-20","year":"令和5年度","qNum":20,"category":"法及び関係法令","stem":"貸金業者の禁止行為等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、その貸金業の業務に関し、保証人となろうとする者に対し、主たる債務者が弁済することが確実であると誤解させるおそれのあることを告げる行為をしてはならない。","貸金業者は、貸付けの契約（住宅資金貸付契約その他の内閣府令で定める契約を除く。）の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結してはならない。","貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、他の貸金業者の利用者又は返済能力がない者を対象として勧誘する旨の表示又は説明をしてはならない。","金銭の貸借の媒介を行った貸金業者は、当該媒介により締結された貸付けに係る契約の債務者から当該媒介の手数料を受領した場合において、当該契約につき更新（媒介のための新たな役務の提供を伴わないと認められる法律行為として内閣府令で定めるものを含む。）があったときは、これに対する新たな手数料を受領し、又はその支払を要求してはならない。"],"note":"","correct":2,"explanation":"②が不適切:禁止されるのは、自殺による死亡を保険事故とする保険契約の締結等であり、死亡保険契約が一律に禁止されるわけではない(令和7年問18③参照)。","topic":"広告・勧誘・禁止行為","exps":["○ 保証人への誤解告知は禁止","× 死亡保険契約が一律に禁止されるわけではない(自殺を保険事故とするものが禁止)","○ 他社利用者・返済能力のない者を対象とする勧誘表示は禁止","○ 更新手数料の受領は禁止"]},{"id":"R5-21","year":"令和5年度","qNum":21,"category":"法及び関係法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、法人である顧客Ｂとの間で、貸付けの契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。","Ａは、個人である顧客Ｂとの間で、極度額を30万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結した後、Ｂの返済能力は低下していないが、Ｂと連絡をとることができないことにより、本件基本契約における極度額を一時的に10万円に減額していた場合において、Ｂと連絡することができたことにより、極度額をその減額の前の30万円まで増額するときは、指定信用情報機関が保有する信用情報を使用したＢの返済能力の調査を行う必要はない。","Ａは、個人である顧客Ｂとの間で、本件基本契約に基づく極度方式貸付けに係る契約を締結しようとする場合、当該極度方式貸付けの金額が5万円を超え、かつ、当該極度方式貸付けの金額と本件基本契約に基づく極度方式貸付けの残高の合計額が10万円を超えるときを除き、指定信用情報機関が保有する信用情報を使用したＢの返済能力の調査を行う必要はない。","Ａは、個人である顧客Ｂとの間で、手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。"],"note":"","correct":3,"explanation":"公式正答は③。極度方式貸付けに係る個別の貸付けの調査要件(金額・残高の合計)の記述が規定と異なる(要確認)。","topic":"返済能力調査・過剰貸付け","exps":["○ 法人への貸付けは信用情報の使用が不要","○ 極度額の減額に関する記述","× 個別の極度方式貸付けで調査が必要となる要件の記述が異なる(要確認)","○ 融通手形以外の手形割引は信用情報の使用が不要"]},{"id":"R5-22","year":"令和5年度","qNum":22,"category":"法及び関係法令","stem":"過剰貸付け等の禁止に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。","items":[],"choices":["貸金業者Ａは、法人顧客Ｂとの間の貸付けに係る契約の締結に際し、当該契約がＢの返済能力を超える貸付けの契約と認められるときは、当該契約を締結してはならない。","貸金業者Ａと現に事業を営んでいない個人顧客Ｃとの間で、Ｃが新たな事業を行うために必要な資金の貸付けに係る契約であって、事業計画、収支計画及び資金計画の確認その他の方法により確実に当該事業の用に供するための資金の貸付けであると認められ、かつ、Ｃの事業計画、収支計画及び資金計画に照らし、Ｃの返済能力を超えない貸付けに係る契約であると認められるものは、貸金業法第13条の2第2項に規定する当該個人顧客の利益の保護に支障を生ずることがない契約として内閣府令で定めるものに該当する。","個人事業者Ｄが5年前から継続して行っている事業から得た所得税法上の総収入金額は、貸金業法施行規則第10条の22に規定する年間の給与に類する定期的な収入の金額等に該当する。","貸金業者Ａは、個人顧客Ｅとの間で、貸金業法施行規則第10条の21（個人過剰貸付契約から除かれる契約）第1項第1号に該当する不動産の建設に必要な資金の貸付けに係る契約を締結し、Ｅから当該契約に係る同条第2項第1号に該当する建設工事の請負契約書の写しの提出を受けた。この場合、Ａは、当該写し又はこれらに記載された情報の内容を記録した電磁的記録を当該契約に定められた最終の返済期日（当該契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）までの間保存しなければならない。"],"note":"","correct":3,"explanation":"公式正答は③。個人事業者の収入の扱いが規則と異なるとされる(要確認)。","topic":"返済能力調査・過剰貸付け","exps":["○ 法人にも返済能力を超える貸付けは禁止","○ 新規事業の資金貸付けは例外契約となりうる","× 個人事業者の事業所得は総収入金額ではなく所得金額で見る(要確認)","○ 不動産建設資金の貸付けは除外契約"]},{"id":"R5-23","year":"令和5年度","qNum":23,"category":"法及び関係法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるもの（以下、本問において「例外契約」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["事業を営む個人顧客に対する貸付けに係る契約であって、実地調査、当該個人顧客の直近の確定申告書の確認その他の方法により当該事業の実態が確認されていること、又は当該個人顧客の事業計画、収支計画及び資金計画に照らし、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められることのいずれかの要件を満たすものは、例外契約に該当する。","預金保険法第2条第1項に規定する金融機関からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約（極度方式基本契約を除く。）であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が1か月を超えないものは、例外契約に該当する。","個人顧客が特定費用(注)を支払うために必要な資金の貸付けに係る契約（極度方式基本契約ではないものとする。）として当該個人顧客と貸金業者との間に締結される契約であって、当該契約が当該個人顧客の返済能力を超えない貸付けに係る契約であると認められ、当該契約の貸付けの金額が10万円であり（当該個人顧客は、当該契約以外の貸付けに係る契約を一切締結していないものとする。）、返済期間が1年であるものは、例外契約に該当しない。","個人顧客が既に貸金業者以外の者と締結した契約に基づき負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約であって、当該個人顧客が当該契約に基づき将来支払うべき返済金額の合計額が既存債務について将来支払うべき返済金額の合計額を上回らないが、当該契約の1か月の負担が既存債務に係る1か月の負担を上回るものは、例外契約に該当しない。"],"note":"(注) 特定費用とは、外国において緊急に必要となった費用のほか、社会通念上緊急に\n必要と認められる費用をいう。","correct":1,"explanation":"①が不適切:事業者への例外契約は、事業の実態の確認『かつ』返済能力を超えないことの要件が必要で、『又は』ではない。","topic":"返済能力調査・過剰貸付け","exps":["× 例外契約の要件は事業の実態の確認『かつ』返済能力を超えないこと","○ 正規貸付けまでのつなぎ貸付け","○ 特定費用を支払うための貸付け","○ 既存債務の借換え"]},{"id":"R5-24","year":"令和5年度","qNum":24,"category":"法及び関係法令","stem":"貸金業法第15条（貸付条件の広告等）及び同法第16条（誇大広告の禁止等）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、貸付条件の広告等を行うに当たっては、貸付けに関し貸金業者が受け取る書面の内容を表示しなければならない。","貸金業者向けの総合的な監督指針によれば、貸金業法第15条第2項に規定する「広告」とは、ある事項を随時又は継続して広く宣伝するため、一般の人に知らせることをいい、例えば、テレビコマーシャル、新聞紙への掲載、広告塔又は立て看板への表示、チラシ又はリーフレットの配布、インターネット上の表示はすべて広告に当たるとされている。","貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、資金需要者等の返済能力を超える貸付けの防止に配慮するとともに、その広告又は勧誘が過度にわたることがないように努めなければならない。","貸金業者は、貸付けの条件について広告をするとき、又は書面もしくはこれに代わる電磁的記録を送付して勧誘（広告に準ずるものとして内閣府令で定めるものに限る。）をするときは、営業所又は事務所の電話番号については、これに貸金業者登録簿に登録されたもの以外のものを表示し、又は記録してはならない。"],"note":"","correct":1,"explanation":"①が不適切:貸付条件の広告の表示事項に、貸金業者が受け取る書面の内容は含まれない。","topic":"広告・勧誘・禁止行為","exps":["× 貸付条件の広告の表示事項に、貸金業者が受け取る書面の内容は含まれない","○ 指針の『広告』の定義どおり","○ 過剰貸付けの防止に配慮する","○ 広告・勧誘の表示事項の記述どおり"]},{"id":"R5-25","year":"令和5年度","qNum":25,"category":"法及び関係法令","stem":"特定公正証書に係る制限等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業を営む者は、貸付けの契約について、債務者等から、当該債務者等が特定公正証書（債務者等が貸付けの契約に基づく債務の不履行の場合に直ちに強制執行に服する旨の陳述が記載された公正証書をいう。以下、本問において同じ。）の作成を公証人に嘱託することを代理人に委任することを証する書面を取得してはならない。","貸金業を営む者は、貸付けの契約について、債務者等が特定公正証書の作成を公証人に嘱託することを代理人に委任する場合には、当該代理人の選任に関し推薦その他これに類する関与をしてはならない。","貸金業者は、貸付けの契約について、特定公正証書の作成を公証人に嘱託した場合には、遅滞なく、内閣府令で定めるところにより、債務者等となるべき資金需要者等に対し、当該貸付けの契約に基づく債務の不履行の場合には、特定公正証書により、債務者等が直ちに強制執行に服することとなる旨及び債務者等の法律上の利益に与える影響に関する事項として内閣府令で定めるものについて書面を交付し、説明しなければならない。","貸金業を営む者は、貸付けの契約について、公的給付(注1)がその受給権者である債務者等又は債務者等の親族その他の者（以下、本問において「特定受給権者」という。）の預金又は貯金の口座に払い込まれた場合に当該預金又は貯金の口座に係る資金から当該貸付けの契約に基づく債権の弁済を受けることを目的として、当該特定受給権者の預金通帳等(注2)の引渡しもしくは提供を求め、又はこれらを保管する行為をしてはならない。"],"note":"(注1) 公的給付とは、法令の規定に基づき国又は地方公共団体がその給付に要する費\n用又はその給付の事業に関する事務に要する費用の全部又は一部を負担し、又\nは補助することとされている給付（給与その他対価の性質を有するものを除\nく。）であって、法令の規定により譲り渡し、担保に供し、又は差し押さえる\nことができないこととされているものをいう。\n(注2) 預金通帳等とは、当該預金もしくは貯金の口座に係る通帳もしくは引出用の\nカードもしくは当該預金もしくは貯金の引出しもしくは払込みに必要な情報そ\nの他当該預金もしくは貯金の引出しもしくは払込みに必要なものとして政令で\n定めるもの又は年金証書その他特定受給権者が公的給付を受給することができ\nることを証する書面その他のものをいう。","correct":3,"explanation":"公式正答は③。特定公正証書に関する貸金業者の通知等の記述が法令と異なる(要確認)。","topic":"取立て・債権譲渡","exps":["○ 特定公正証書の作成嘱託の制限","○ 代理人の選任への関与禁止","× 嘱託した場合の通知等の記述が法令と異なる(要確認)","○ 公的給付の受給権に関する制限"]},{"id":"R5-26","year":"令和5年度","qNum":26,"category":"法及び関係法令","stem":"貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、事業年度ごとに、内閣府令で定めるところにより、貸金業に係る事業報告書を作成し、毎事業年度経過後3か月以内に、これをその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に提出しなければならない。","登録行政庁は、貸金業法を施行するため必要があると認めるときは、その登録を受けた貸金業者に対して、その業務に関し報告又は資料の提出を命ずることができる。","登録行政庁は、その登録を受けた貸金業者が貸金業法第12条の5（暴力団員等の使用の禁止）の規定に違反して、暴力団員等をその業務に従事させた場合、その登録を取り消し、又は当該貸金業者に対してその業務の停止を命ずることができる。","登録行政庁は、その登録を受けた貸金業者が正当な理由がないのに当該登録を受けた日から6か月以内に貸金業を開始しない場合には、その登録を取り消すことができる。"],"note":"","correct":3,"explanation":"③が不適切:暴力団員等の使用は必要的取消しの対象で、『取消しまたは業務停止』の選択ではない。","topic":"登録・届出・監督処分","exps":["○ 事業報告書は事業年度経過後3か月以内に提出","○ 登録行政庁は報告・資料の提出を命じられる","× 暴力団員等の使用は必要的取消し","○ 登録後6か月以内に貸金業を開始しなければ取消し可"]},{"id":"R5-27","year":"令和5年度","qNum":27,"category":"法及び関係法令","stem":"ＡとＢとの間の複数の営業的金銭消費貸借契約（以下、本問において、「第一契約」、「第二契約」又は「第三契約」という。）に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂとの間で、元本を10万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し10万円をＢに貸し付けた。Ａは、Ｂが第一契約に基づく債務を完済した後に、Ｂとの間で元本を5万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第二契約）を締結し5万円をＢに貸し付けた。この場合、第二契約における利息の約定は、有効である。","Ａは、Ｂとの間で、元本を20万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し20万円をＢに貸し付けると同時に、元本を80万円とし利息を年1割5分（15％）とする営業的金銭消費貸借契約（第二契約）を締結し80万円をＢに貸し付けた。この場合、第一契約における利息の約定は、年15％を超過する部分に限り無効となる。","Ａは、Ｂとの間で、元本を60万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し60万円をＢに貸し付けた。Ａは、第一契約に基づく債務の元本残高が30万円である時点において、Ｂとの間で元本を80万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第二契約）を締結し80万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","Ａは、Ｂとの間で、元本を50万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し50万円をＢに貸し付けた後、まだ、ＢがＡに対して第一契約に係る債務を一切弁済していない時点で、Ｂとの間で、元本を5万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第二契約）を締結しＢに5万円を貸し付けると同時に、元本を50万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第三契約）を締結しＢに50万円を貸し付けた。この場合、第二契約、第三契約における利息の約定のうち、第二契約における年1割8分（18％）を超過する部分の利息の約定に限り無効となる。"],"note":"","correct":4,"explanation":"公式正答は④。同一の貸主との複数の貸付けは、返済状況にかかわらず残存元本との合算で上限金利を判定する点が論点(要確認)。","topic":"利息制限法・出資法","exps":["○ 残存元本との合算で上限を判定する","○ 同時の複数契約は元本を合算して判定","○ 残存元本との合算で上限を判定する","× 合算の判定の記述が誤り(要確認)"]},{"id":"R5-28","year":"令和5年度","qNum":28,"category":"貸付け・付随取引の法令実務","stem":"意思能力及び行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、取り消すことができる。","未成年者は、権利を得る法律行為をする場合にはその法定代理人の同意を得なければならないが、義務を免れる法律行為をする場合にはその法定代理人の同意を得る必要はない。","成年被後見人の法律行為（日用品の購入その他日常生活に関する行為を除く。）は、あらかじめ成年後見人の同意を得ていた場合であっても、取り消すことができる。","被保佐人は、あらかじめ保佐人の同意を得なくても、金銭の借入れ及びその返済をすることができる。"],"note":"","correct":3,"explanation":"③適切:成年被後見人の行為は、成年後見人の同意があっても取り消せる。①意思能力を欠く行為は無効、②権利を得る行為は同意不要、④被保佐人の借入れは保佐人の同意が必要。","topic":"民法","exps":["× 意思能力のない法律行為は無効","× 権利を得る行為は同意が不要","○ 成年被後見人の行為は、同意があっても取り消せる","× 被保佐人の借入れは保佐人の同意が必要"]},{"id":"R5-29","year":"令和5年度","qNum":29,"category":"貸付け・付随取引の法令実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["無効な行為は、当事者がその行為の無効であることを知って追認をしたときは、初めから有効であったものとみなされる。","行為能力の制限によって取り消すことができる行為について、制限行為能力者は、その法定代理人、保佐人又は補助人の同意を得なければ、その行為を取り消すことができない。","取り消すことができる行為は、取り消されるまで有効であり、取り消されたときに、取り消された時から将来に向かって無効となる。","錯誤、詐欺又は強迫によって取り消すことができる行為の追認は、取消しの原因となっていた状況が消滅し、かつ、取消権を有することを知った後にしなければ、その効力を生じない。"],"note":"","correct":4,"explanation":"④適切:追認は取消しの原因となっていた状況が消滅し、取消権を知った後でなければ効力を生じない。①無効行為の追認は新たな行為、②制限行為能力者自身が取消し可、③取消しは初めから無効。","topic":"民法","exps":["× 無効行為の追認は初めにさかのぼって有効にならない","× 制限行為能力者は同意なしでも取り消せる","× 取消しは初めにさかのぼって無効","○ 追認は取消原因が消え、取消権を知った後でなければ効力がない"]},{"id":"R5-30","year":"令和5年度","qNum":30,"category":"貸付け・付随取引の法令実務","stem":"時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債権は、債権者が権利を行使することができることを知った時から10年間行使しないとき、又は権利を行使することができる時から20年間行使しないときは、時効によって消滅する。","当事者は、あらかじめ時効の利益を放棄したときは、時効を援用することができない。","時効の完成猶予又は更新は、完成猶予又は更新の事由が生じた当事者、その承継人及び当該時効の完成猶予又は更新により利害関係が生じるすべての者の間において、その効力を有する。","確定判決又は確定判決と同一の効力を有するものによって確定した権利については、確定の時に弁済期の到来していない債権を除き、10年より短い時効期間の定めがあるものであっても、その時効期間は、10年とされる。"],"note":"","correct":4,"explanation":"④適切:確定判決で確定した権利の時効期間は10年。①5年・10年、②事前の時効利益の放棄は不可、③完成猶予・更新は当事者間(承継人含む)で効力を生じる。","topic":"民法","exps":["× 5年(知った時)・10年(行使できる時)","× 時効の利益の事前放棄は無効","× 完成猶予・更新は当事者とその承継人の間で効力","○ 確定判決で確定した権利の時効期間は10年"]},{"id":"R5-31","year":"令和5年度","qNum":31,"category":"貸付け・付随取引の法令実務","stem":"債権の目的及び効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債権の目的が特定物の引渡しであるときは、債務者は、その引渡しをするまで、契約その他の債権の発生原因及び取引上の社会通念に照らして定まる善良な管理者の注意をもって、その物を保存しなければならない。","債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とし、特別の事情によって生じた損害については、損害賠償の対象とならない。","債権者は、債務者が金銭債務の履行をしない場合、その不履行が不可抗力によるものであるときを除き、これによって生じた損害の賠償を請求することができる。","債権者と債務者との間で金銭債務の不履行について賠償額の予定をしなかったときは、債権者は、その債務不履行による損害賠償については、その損害額を証明しなければならない。"],"note":"","correct":1,"explanation":"①適切:特定物の引渡債務者は善良な管理者の注意義務を負う。②特別事情による損害も予見可能性があれば賠償対象、③金銭債務は不可抗力でも免責されない、④金銭債務の損害賠償は損害証明不要。","topic":"民法","exps":["○ 特定物の引渡債務者は善管注意義務を負う","× 特別事情による損害も予見可能なら賠償対象","× 金銭債務は不可抗力でも免責されない","× 金銭債務の損害賠償は損害の証明が不要"]},{"id":"R5-32","year":"令和5年度","qNum":32,"category":"貸付け・付随取引の法令実務","stem":"ＡのＢに対する貸付金債権（以下、本問において「本件債権」という。）の譲渡に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["本件債権については、ＡとＢとの間で、第三者への譲渡を禁止する旨の特約がなされていたにもかかわらず、Ａは本件債権を第三者Ｃに譲渡した。この場合、本件債権の譲渡は無効であり、Ｃは、本件債権を取得することができない。","Ａは、本件債権をＣに譲渡し、Ｃへの本件債権の譲渡についてＢに対し確定日付のある証書によらない通知をした。この場合、Ｃは、本件債権の譲渡をＢに対抗することができず、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができる。","Ａは、本件債権をＣとＤに二重に譲渡した。Ｂが、Ｃへの本件債権の譲渡について確定日付のある証書によらない承諾をした後、ＢからＣに本件債権の弁済がなされる前に、Ｄへの本件債権の譲渡について、Ａが確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲渡をＤに対抗することができず、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができる。","Ａは、本件債権をＣとＤに二重に譲渡し、そのいずれについても確定日付のある証書によりＢに通知をした。Ｄへの本件債権の譲渡についての通知は、Ｃへの本件債権の譲渡についての通知がＢに到達するより早くＢに到達したが、確定日付のある証書に付された日付は、Ｄへの譲渡についての日付よりＣへの譲渡についての日付の方が早い日付であった。この場合、債権が二重に譲渡された場合の優劣は確定日付の先後で決せられるので、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができない。"],"note":"","correct":3,"explanation":"③適切:確定日付のない承諾は第三者への対抗要件にならず、確定日付ある通知を備えたDが優先(要確認)。①譲渡制限特約があっても譲渡は有効、②確定日付がなくても債務者には対抗可、④は通知の到達の先後で決まる。","topic":"民法","exps":["× 譲渡制限特約があっても債権譲渡は有効","× 通知は確定日付がなくても債務者に対抗できる","○ 確定日付のある通知を備えたDが優先(要確認)","× 確定日付のある通知同士は、到達の先後で決まる"]},{"id":"R5-33","year":"令和5年度","qNum":33,"category":"貸付け・付随取引の法令実務","stem":"ＡのＢに対する金銭債権を「甲債権」とし、ＢのＡに対する金銭債権を「乙債権」とする。甲債権と乙債権の相殺に関する次の①～④の記述のうち、民法及び民事執行法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａに対して金銭債権を有するＣの申立てにより甲債権が差押えを受けた。この場合、Ａは、甲債権と乙債権とを相殺することができる。","乙債権の弁済期は到来しているが、甲債権の弁済期は到来していない。この場合、Ａは、甲債権と乙債権とを相殺することができない。","Ａが甲債権を取得した後に、Ｂに対して金銭債権を有するＤの申立てにより乙債権が差押えを受けた。この場合、Ａは、甲債権と乙債権との相殺をもってＤに対抗することができない。","甲債権及び乙債権が相殺適状となった後、甲債権が時効により消滅した。この場合、Ａは、甲債権と乙債権とを相殺することができない。"],"note":"","correct":2,"explanation":"②適切:自働債権の弁済期が未到来なら相殺できない。③差押え前に取得した債権による相殺は対抗可、④時効消滅前に相殺適状なら相殺可。","topic":"民法","exps":["× 差押えを受けた債権に関する相殺の記述が誤り(要確認)","○ 自働債権の弁済期が未到来なら相殺できない","× 差押え前に取得した債権による相殺は対抗できる","× 時効消滅前に相殺適状なら相殺できる"]},{"id":"R5-34","year":"令和5年度","qNum":34,"category":"貸付け・付随取引の法令実務","stem":"貸主をＡとし借主をＢとする金銭消費貸借契約に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂとの間で、書面でする金銭消費貸借契約を締結した。この場合、Ｂは、当該契約に基づきＡから借入金を受け取る前であれば、当該契約を解除することができる。","Ａは、Ｂとの間の金銭消費貸借契約において、利息の約定をせずにＢに金銭を貸し付けた。この場合、Ａは、Ｂに対し法定利息を請求することができる。","Ａは、Ｂとの間の金銭消費貸借契約において、貸付金を10回の分割で返済する旨の約定をしてＢに金銭を貸し付けた。この場合において、Ｂが各回の借入金債務について、そのうちの1回でも債務の履行を遅滞したときは、Ａは、Ｂに対し、残債務全部の一括弁済を請求することができる。","Ａは、利息を定めてＢとの間で金銭消費貸借契約を締結したが、Ｂは利息の支払を1年以上延滞し、Ａが催告をしてもＢはその利息を支払わなかった。この場合であっても、Ａは、利息を元本に組み入れることはできない。"],"note":"","correct":1,"explanation":"①適切:書面による消費貸借は、借主が金銭を受け取る前なら解除できる。②利息の特約がなければ利息は請求不可、③期限の利益の喪失は特約等が必要、④催告しても支払わないなら利息の元本組入れが可能。","topic":"民法","exps":["○ 書面による消費貸借は、金銭を受け取る前なら借主が解除できる","× 利息の特約がなければ法定利息は請求できない","× 分割払いの期限の利益の喪失には特約が必要","× 催告しても払わないときは利息を元本に組み入れられる"]},{"id":"R5-35","year":"令和5年度","qNum":35,"category":"貸付け・付随取引の法令実務","stem":"犯罪による収益の移転防止に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者が、自然人である顧客の取引時確認として確認しなければならない事項は、氏名、住居、生年月日、職業及び収入である。","貸金業者が、自然人である顧客の取引時確認として本人特定事項の確認をするために、当該顧客の運転免許証の提示を受ける場合には貸金業者が当該運転免許証の提示を受ける日において有効なもの、また住民票の写しの提示を受ける場合には貸金業者が当該住民票の写しの提示を受ける日前6か月以内に作成されたものに限られる。","貸金業者が、自然人である顧客の取引時確認として本人特定事項の確認をするために運転免許証の提示を受ける場合、その原本ではなく写しの提示を受けることも認められている。","貸金業者が、既に取引をしたことのある顧客との間で金銭の貸付けを内容とする契約を締結する場合、過去の取引において取引時確認を行っているときであっても、契約を締結する都度、当該顧客の取引時確認をしなければならない。"],"note":"","correct":2,"explanation":"②適切(有効な本人確認書類であることが要件)。①確認事項は氏名・住居・生年月日・目的・職業で収入は含まない、③原本の提示が必要、④過去に確認済みなら再確認は不要。","topic":"犯収法(取引時確認)","exps":["× 確認事項は氏名・住居・生年月日・目的・職業で、収入は含まない","○ 有効な運転免許証の提示を受けて確認する","× 本人確認書類は原本の提示が必要","× 過去に確認済みなら再確認は不要"]},{"id":"R5-36","year":"令和5年度","qNum":36,"category":"貸付け・付随取引の法令実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂに甲建物を売却するつもりがないのに、Ｂと通謀して、甲建物をＢに売却する旨の虚偽の売買契約を締結し、ＡからＢへの甲建物の所有権移転登記を経た。この場合において、ＡとＢが通謀して虚偽の売買契約を締結した事情を知らない第三者ＣがＢから甲建物を買い受けたときは、Ａは、AB間の契約は虚偽表示により無効である旨をＣに対抗することができない。","Ａは、Ｂが所有する甲土地の近隣に鉄道の駅が新設される計画を知り、Ｂとの間で、甲土地を購入する旨の売買契約を締結した。しかし、当該駅新設の計画は、当該売買契約の締結前に既に中止となっていたが、Ａはそれを知らなかった。この場合において、Ａは、当該駅新設が甲土地を購入する動機である旨をＢに表示していなかったときは、Ｂに対し、当該売買契約を錯誤により取り消すことができない。","Ａは、Ｂの詐欺により、Ｂとの間でＢに甲絵画を売却する旨の売買契約を締結し、Ｂに甲絵画を引き渡した後、Ｂは、詐欺の事情を知らず、知らないことに過失のない第三者Ｃに甲絵画を売却した。その後、Ａは、詐欺による意思表示を理由としてAB間の売買契約を取り消した場合、その取消しをＣに対抗することができない。","Ａは、Ｂの強迫により、Ｂとの間でＢに甲土地を売却する旨の売買契約を締結し、ＡからＢへの甲土地の所有権移転登記を経た後、Ｂは、強迫の事情を知らず、知らないことに過失のない第三者Ｃに甲土地を売却した。その後、Ａは、強迫による意思表示を理由としてAB間の売買契約を取り消した場合、その取消しをＣに対抗することができない。"],"note":"","correct":4,"explanation":"④が不適切:強迫による取消しは、善意無過失の第三者にも対抗できる(詐欺の場合と異なる)。","topic":"民法","exps":["○ 通謀虚偽表示は、善意の第三者に対抗できない","○ 動機の錯誤は、動機が表示されなければ取り消せない","○ 詐欺による取消しは、善意無過失の第三者に対抗できない","× 強迫による取消しは、善意無過失の第三者にも対抗できる"]},{"id":"R5-37","year":"令和5年度","qNum":37,"category":"貸付け・付随取引の法令実務","stem":"期間の計算に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["10月1日午前10時30分から6時間という期間を定めた場合、その期間は、即時から起算されるので、午後4時30分をもって満了する。","ある事実を知った日から2週間以内に届け出ることが法令により義務付けられている場合において、当該事実を10月1日午前10時に知ったときは、当該事実の届出の期限は10月15日となる。","期間の末日が日曜日、国民の祝日に関する法律に規定する休日その他の休日に当たるときは、期間は、その前日に満了する。","10月31日午前0時から1か月という期間を定めた場合、その期間は、11月においてその起算日に応当する31日はないので、11月30日をもって満了する。"],"note":"","correct":3,"explanation":"③が不適切:期間の末日が休日のときは、前日ではなく翌日(休日でない日)に満了する。","topic":"民法","exps":["○ 即時から起算し、6時間後に満了","○ 初日不算入で2週間後に満了","× 末日が休日のときは、前日ではなく翌日に満了","○ 応当日がない月は月末に満了"]},{"id":"R5-38","year":"令和5年度","qNum":38,"category":"貸付け・付随取引の法令実務","stem":"質権及び抵当権に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債権を目的とする質権の設定は、第三債務者への質権の設定の通知又は第三債務者の承諾がなければ、第三債務者に対抗することができない。","貸金債権を被担保債権として売買代金債権に質権を設定した場合、質権者は、売買代金債権の額が貸金債権の額を超えていても、売買代金債権の全部を直接に取り立てることができる。","根抵当権者は、確定した元本並びに利息その他の定期金及び債務の不履行によって生じた損害の賠償の全部について、極度額を限度として、その根抵当権を行使することができる。","根抵当権の被担保債権の元本の確定前においては、後順位の抵当権者その他の第三者の承諾を得ることなく、根抵当権の担保すべき債権の範囲の変更をすることができる。"],"note":"","correct":2,"explanation":"②が不適切:債権質の質権者が取り立てられるのは、被担保債権の額の範囲に限られる。","topic":"民法","exps":["○ 債権質は第三債務者への通知・承諾が対抗要件","× 債権質の取立ては、被担保債権の額の範囲に限られる","○ 根抵当権は極度額を限度に全部を行使できる","○ 元本確定前は第三者の承諾なく担保範囲を変更できる"]},{"id":"R5-39","year":"令和5年度","qNum":39,"category":"貸付け・付随取引の法令実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["保証人の負担が債務の目的又は態様において主たる債務より重いときは、主たる債務の限度に減縮されるため、保証人は、その保証債務についてのみ、違約金又は損害賠償の額を約定することはできない。","保証人は、主たる債務者と連帯して債務を負担したときは、民法第452条（催告の抗弁）及び同第453条（検索の抗弁）のいずれの権利も有しない。","行為能力の制限によって取り消すことができる債務を保証した者は、保証契約の時にその取消しの原因を知っていた場合において、主たる債務が不履行となり又はその債務が取り消されたときは、これと同一の目的を有する独立の債務を負担したものと推定される。","債務者が保証人を立てる義務を負う場合には、債権者が保証人を指名したときを除き、その保証人は、行為能力者であること及び弁済する資力を有することのいずれの要件も具備する者でなければならない。"],"note":"","correct":1,"explanation":"①が不適切:保証人は、保証債務についてのみ違約金・損害賠償の額を約定できる。","topic":"民法","exps":["× 保証人は、保証債務についてのみ違約金等を約定できる","○ 連帯保証人には催告・検索の抗弁がない","○ 取消原因を知って保証した場合の特則","○ 保証人の要件(債権者が指名した場合を除く)"]},{"id":"R5-40","year":"令和5年度","qNum":40,"category":"貸付け・付随取引の法令実務","stem":"Ａは、配偶者Ｂ、子Ｃ及びＤ、並びにＤの子でありＡの孫であるＥを遺して死亡した。この場合の相続に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ｂ、Ｃ及びＤが単純承認した場合は、Ｃ及びＤの法定相続分はそれぞれ4分の1である。","Ａは、遺言で、共同相続人Ｂ、Ｃ及びＤの相続分について法定相続分と異なる相続分を指定していた場合であっても、Ａの債権者は、Ｂ、Ｃ及びＤに対し、その法定相続分に応じてその権利を行使することができる。","Ｂは、相続財産の一部を費消したときは、単純承認をしたものとみなされる。","Ｄが相続放棄をしたときは、Ｂ、Ｃ及びＥが共同相続人となる。"],"note":"","correct":4,"explanation":"④が不適切:Dが相続放棄すると、Eは代襲相続せず、B・Cが相続人となる。①配偶者2分の1、子2人は各4分の1、③相続財産の一部費消は単純承認とみなされる。","topic":"民法","exps":["○ 配偶者2分の1、子C・Dは各4分の1","○ 指定相続分があっても、債権者は法定相続分で請求できる","○ 相続財産の一部の費消は単純承認とみなされる","× Dが放棄してもEは代襲相続せず、相続人はB・C"]},{"id":"R5-41","year":"令和5年度","qNum":41,"category":"貸付け・付随取引の法令実務","stem":"手形法及び電子記録債権法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["詐欺によって振り出された約束手形を裏書により譲り受けた所持人は、当該事情を知らず、かつ知らないことにつき過失がなかった。この場合、当該約束手形の振出人は、当該所持人から手形金の支払を請求されたときは、詐欺を理由とする手形行為取消しの抗弁をもって、当該所持人に対抗することができる。","裏書が連続している約束手形の所持人は、正当な権利者と推定されるため、正当な権利者であることを証明しなくても手形上の債務者に対し手形金の支払を求めることができる。","電子記録債権は、保証記録に係るもの及び電子記録保証をした者が電子記録債権法第35条第1項の規定により取得する特別求償権を除き、発生記録をすることによって生ずる。","電子記録名義人に対してした電子記録債権についての支払は、その支払をした者に悪意又は重大な過失がない限り、当該電子記録名義人がその支払を受ける権利を有しない場合であっても、その効力を有する。"],"note":"","correct":1,"explanation":"①が不適切:手形では、善意の所持人に対し人的抗弁(詐欺による取消し等)を対抗できない(要確認)。","topic":"手形・電子記録債権","exps":["× 善意無過失の所持人に対し、振出人は詐欺を理由に支払を拒めない","○ 裏書の連続により権利者と推定される","○ 電子記録債権は発生記録によって生ずる","○ 電子記録名義人への支払は、善意無重過失なら有効"]},{"id":"R5-42","year":"令和5年度","qNum":42,"category":"貸付け・付随取引の法令実務","stem":"民事訴訟法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["当事者は、訴えについて法令に専属管轄の定めがある場合を除き、第一審に限り、合意により管轄裁判所を定めることができる。","地方裁判所における訴えの提起は、訴状を裁判所に提出してしなければならないが、簡易裁判所においては、訴えは口頭で提起することができる。","商業登記簿に支配人として登記された支配人は、民事訴訟における訴訟代理人となることができる。","地方裁判所に提起された民事訴訟において、当事者は、口頭弁論の続行の期日に裁判所に出頭しなかったとしても、準備書面を裁判所に提出している場合には、口頭弁論において当該準備書面に記載した事項を陳述したものとみなされる。"],"note":"","correct":4,"explanation":"④が不適切:準備書面の陳述擬制は最初にすべき口頭弁論期日に限られ、続行期日では認められない。","topic":"民事訴訟・執行","exps":["○ 第一審に限り合意管轄を定められる","○ 簡易裁判所では口頭で訴えを提起できる","○ 支配人は訴訟代理人となれる","× 準備書面の陳述擬制は、最初にすべき口頭弁論期日に限られる"]},{"id":"R5-43","year":"令和5年度","qNum":43,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["取得時に生存する特定の個人を識別することができなかった情報は、取得後に新たな情報が付加され、又は照合された結果、生存する特定の個人を識別できるに至っても、個人情報に該当しない。","個人データとは、氏名、生年月日など複数の情報を含む個人情報の集合体をいい、個人情報データベース等を構成するものに限られない。","特定の個人の身体の一部の特徴を電子計算機の用に供するために変換した文字、番号、記号その他の符号であって、当該特定の個人を識別することができるもののうち、政令で定めるものは、個人識別符号に該当し、生存する個人に関する情報であって、個人識別符号が含まれるものは個人情報となる。","個人関連情報とは、生存する個人に関する情報であって、個人情報、仮名加工情報及び匿名加工情報のいずれかに該当するものをいう。"],"note":"","correct":3,"explanation":"③適切:身体の一部の特徴を変換した符号で政令で定めるものは個人識別符号。①取得後に識別可能になれば個人情報、②個人データはデータベース構成のもの、④個人関連情報は個人情報等に該当しないもの。","topic":"個人情報保護","exps":["× 取得後に識別可能になれば個人情報に当たる","× 個人データは個人情報データベース等を構成するもの","○ 個人識別符号の定義どおり","× 個人関連情報は個人情報等のいずれにも当たらないもの"]},{"id":"R5-44","year":"令和5年度","qNum":44,"category":"資金需要者等の保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["適格消費者団体は、事業者が、消費者契約の締結について勧誘をするに際し、不特定かつ多数の消費者に対して重要事項について事実と異なることを告げる行為を現に行い又は行うおそれがあるときは、その事業者に対し、当該行為の停止もしくは予防又は当該行為に供した物の廃棄もしくは除去その他の当該行為の停止もしくは予防に必要な措置をとることを請求することができる。","事業者が消費者契約の締結について勧誘をするに際し、当該事業者に対し、消費者が、その住居又はその業務を行っている場所から退去すべき旨の意思を示したにもかかわらず、当該事業者がそれらの場所から退去しないことにより困惑し、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、当該消費者契約は、無効となる。","消費者契約において、消費者の不作為をもって当該消費者が新たな消費者契約の申込み又はその承諾の意思表示をしたものとみなす条項その他の法令中の公の秩序に関しない規定の適用による場合に比して消費者の権利を制限し又は消費者の義務を加重する消費者契約の条項であって、民法第1条第2項に規定する基本原則に反して消費者の利益を一方的に害するものが含まれている場合、当該消費者は、当該消費者契約を取り消すことができる。","消費者契約法に基づき消費者に認められる取消権は、追認をすることができる時から6か月間行わないときは、時効によって消滅する。当該消費者契約の締結の時から5年を経過したときも、同様とする。"],"note":"","correct":1,"explanation":"①適切:適格消費者団体は事業者に差止請求ができる。②退去妨害は取消事由(③不作為みなし条項は無効)、④取消権は追認可能時から1年、契約から5年で時効消滅。","topic":"消費者契約法","exps":["○ 適格消費者団体は事業者に差止請求ができる","× 退去妨害に関する記述が異なる(要確認)","× 不作為みなし条項に関する記述が異なる(要確認)","× 取消権は追認可能時から1年、契約から5年で消滅"]},{"id":"R5-45","year":"令和5年度","qNum":45,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律（以下、本問において「法」という。）についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["本人(注)は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの電磁的記録の提供による方法その他の個人情報保護委員会規則で定める方法による開示を請求することができる。","本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの内容が事実でないときは、当該保有個人データの内容の訂正、追加又は削除を請求することができる。","本人が、個人情報取扱事業者に対し、当該本人が識別される保有個人データについて利用の停止又は消去（以下、本問において「利用停止等」という。）を請求することができるのは、当該保有個人データが法第18条（利用目的による制限）もしくは法第19条（不適正な利用の禁止）の規定に違反して取り扱われているとき、又は法第20条（適正な取得）の規定に違反して取得されたものであるときに限られる。","個人情報取扱事業者は、法第35条（利用停止等）第1項又は第5項の規定による請求に係る保有個人データの全部又は一部について利用停止等を行ったとき又は利用停止等を行わない旨の決定をしたときは、本人に対し、遅滞なく、その旨を通知しなければならない。"],"note":"(注) 本人とは、個人情報によって識別される特定の個人をいう。","correct":3,"explanation":"③が不適切:利用停止等の請求は、目的外利用・不正取得に限らず、利用の必要がなくなった場合や漏えい等の場合などにもできる。","topic":"個人情報保護","exps":["○ 電磁的記録による開示を請求できる","○ 内容が事実でないときは訂正等を請求できる","× 利用停止等の請求は、目的外利用等に限られない(要確認)","○ 利用停止等の措置の通知に関する記述"]},{"id":"R5-46","year":"令和5年度","qNum":46,"category":"資金需要者等の保護","stem":"次の①～④の記述のうち、不当景品類及び不当表示防止法（以下、本問において「景品表示法」という。）上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["事業者が、商品の価格その他の取引条件について、実際のものよりも取引の相手方に著しく有利であると一般消費者に誤認される表示（有利誤認表示）をしたおそれがある場合、内閣総理大臣は、当該事業者に対して、期間を定めて、当該表示の裏付けとなる合理的な根拠を示す資料の提出を求めることができ、当該資料の提出を求めたにもかかわらず、当該事業者がその期間内に当該資料を提出しないときは、当該表示は、景品表示法第5条（不当な表示の禁止）第2号に規定する、不当な表示とみなされる。","内閣総理大臣は、景品表示法第4条（景品類の制限及び禁止）の規定による制限もしくは禁止もしくは第5条第3号の規定による指定をし、又はこれらの変更もしくは廃止をしようとするときは、内閣府令で定めるところにより、公聴会を開き、関係事業者及び一般の意見を求めるとともに、消費者委員会の意見を聴かなければならない。","表示とは、顧客を誘引するための手段として、事業者が自己の供給する商品又は役務の内容又は取引条件その他これらの取引に関する事項について行う広告その他の表示であって、内閣総理大臣が指定するものをいう。","景品類とは、顧客を誘引するための手段として、その方法が直接的であるか間接的であるかを問わず、くじの方法によるかどうかを問わず、事業者が自己の供給する商品又は役務の取引（不動産に関する取引を含む。）に付随して相手方に提供する物品、金銭その他の経済上の利益であって、内閣総理大臣が指定するものをいう。"],"note":"","correct":1,"explanation":"公式正答は①。措置命令・有利誤認表示に関する記述が景品表示法と異なる(要確認)。","topic":"景品表示法","exps":["× 有利誤認表示のおそれの段階の措置の記述が異なる(要確認)","○ 景品類の制限等の手続に関する記述","○ 表示の定義どおり","○ 景品類の定義どおり"]},{"id":"R5-47","year":"令和5年度","qNum":47,"category":"資金需要者等の保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業務関連紛争とは、貸金業務等関連苦情のうち、当該苦情の相手方である貸金業者と当該苦情に係る契約者等の自主的な交渉では解決ができないものであって、当事者が和解をすることができるものをいう。","紛争解決手続開始の申立ては、加入貸金業者との間で貸金業務関連紛争のある契約者等のみが行うことができ、加入貸金業者から行うことはできない。","紛争解決手続において、当事者双方が紛争解決委員の和解案を受諾したときには、その時点で当該和解案の内容で和解が成立したものとされる。","当事者である協会員等は、紛争解決委員から特別調停案の提示を受けた場合において、当該特別調停案の受諾を拒むときには、拒否の事由を明らかにして書面により行わなければならない。"],"note":"","correct":2,"explanation":"②が不適切:紛争解決手続は契約者等だけでなく、加入貸金業者からも申し立てることができる。","topic":"協会自主規制・紛争解決","exps":["○ 貸金業務関連紛争の定義どおり","× 紛争解決手続は加入貸金業者からも申し立てられる","○ 双方が和解案を受諾すれば和解が成立する","○ 特別調停案を拒むときは、事由を明らかにして書面で行う"]},{"id":"R5-48","year":"令和5年度","qNum":48,"category":"財務及び会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["株主総会提出のため、信用目的のため、租税目的のため等、種々の目的のために異なる形式の財務諸表を作成してはならない。これを一般に単一性の原則という。","自己資本と他人資本とを明確に区別し、純資産と負債とを混同してはならない。これを一般に総資本区分の原則という。","企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。","企業の財政状態に影響を及ぼす多額の取引については、その取引の内容をできる限り詳細かつ正確に注記しなければならない。これを一般に正確性の原則という。"],"note":"","correct":3,"explanation":"③適切:継続性の原則。①単一性の原則は実質同一で形式が異なる財務諸表を認める、②は資本取引・損益取引区分の原則、④は重要性・明瞭性の原則の趣旨。","topic":"財務・会計","exps":["× 単一性の原則は、実質が同一で形式のみ異なる財務諸表を認める","× 純資産と負債の区分は総資本区分の原則ではない","○ 継続性の原則","× 重要な事項の注記は明瞭性の原則"]},{"id":"R5-49","year":"令和5年度","qNum":49,"category":"財務及び会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定する損益計算書に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["売上高から売上原価を控除した額（売上原価が売上高をこえる場合は、売上原価から売上高を控除した額）は、営業利益金額又は営業損失金額として表示しなければならない。","売上総利益金額から販売費及び一般管理費の合計額を控除した額（販売費及び一般管理費の合計額が売上総利益金額をこえる場合は、販売費及び一般管理費の合計額から売上総利益金額を控除した額）を経常利益金額もしくは経常損失金額として表示し、又は売上総損失金額に販売費及び一般管理費の合計額を加えた額を経常損失金額として表示しなければならない。","営業利益金額又は営業損失金額に、営業外収益の金額を加減し、次に営業外費用の金額を加減した額を、営業外利益金額又は営業外損失金額として表示しなければならない。","経常利益金額又は経常損失金額に特別利益の金額を加減し、次に特別損失の金額を加減した額を、税引前当期純利益金額又は税引前当期純損失金額として表示しなければならない。"],"note":"","correct":4,"explanation":"④適切:経常利益に特別利益・特別損失を加減して税引前当期純利益を表示する。①は売上総利益、②は営業利益、③は経常利益の計算。","topic":"財務・会計","exps":["× 売上高−売上原価は売上総利益","× 営業利益等の記述が異なる(要確認)","× 営業外損益を加減した額は経常利益","○ 経常利益に特別損益を加減して税引前当期純利益を表示する"]},{"id":"R5-50","year":"令和5年度","qNum":50,"category":"財務及び会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定するキャッシュ・フロー計算書に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["売上債権、棚卸資産、仕入債務により生じた資産及び負債の増加額又は減少額は、営業活動によるキャッシュ・フローの区分に掲記される。","社債の発行による収入、社債の償還による支出、株式の発行による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","有形固定資産の取得による支出、有形固定資産の売却による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","長期借入れによる収入、長期借入金の返済による支出は、財務活動によるキャッシュ・フローの区分に掲記される。"],"note":"","correct":2,"explanation":"②が不適切:社債の発行・償還、株式の発行による収入は財務活動によるCFの区分。","topic":"財務・会計","exps":["○ 営業活動によるCFの区分","× 社債の発行・償還、株式の発行は財務活動によるCF","○ 有形固定資産の取得・売却は投資活動によるCF","○ 長期借入れ・返済は財務活動によるCF"]},{"id":"R6-01","year":"令和6年度","qNum":1,"category":"法及び関係法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）で業として行うものをいい、これには事業者がその従業者に対して行うものも含まれる。"},{"label":"b","text":"貸付けの契約とは、貸付けに係る契約又は当該契約に係る保証契約をいう。"},{"label":"c","text":"債務者等とは、資金需要者である顧客、債務者又は債務者であった者をいう。"},{"label":"d","text":"個人信用情報とは、資金需要者である顧客又は債務者の借入金の返済能力に関する情報をいう。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":1,"explanation":"公式正答は①(適切なのは1個)。c:債務者等には保証人・代位弁済者も含まれる。d:個人信用情報は『個人である』顧客・債務者に関する情報。a・bのどちらが適切かの判別は要確認。","topic":"返済能力調査・過剰貸付け","exps":["要確認:貸金業の定義の記述(a)は条文どおりに見える","要確認:貸付けの契約の定義(b)の適否","× 債務者等には保証人・代位弁済者も含まれる","× 個人信用情報は『個人である』顧客・債務者に関する情報"]},{"id":"R6-02","year":"令和6年度","qNum":2,"category":"法及び関係法令","stem":"次のａ～ｄの記述のうち、貸金業法第6条第1項各号のいずれかに該当する場合として貸金業の登録を拒否されるものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における法人は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","items":[{"label":"a","text":"個人である申請者が貸付けの業務に3年以上従事した経験を有しない者である場合"},{"label":"b","text":"営業所又は事務所ごとに貸付けの業務に1年以上従事した者が常勤の役員又は使用人として1人しか在籍していない場合"},{"label":"c","text":"資金需要者等の利益の保護を図り、貸金業の適正な運営に資するため十分な社内規則を定めていない場合"},{"label":"d","text":"法人である申請者で、最終事業年度に係る貸借対照表又はこれに代わる書面（最終事業年度がない場合にあっては、当該法人の成立の時に作成する貸借対照表又はこれに代わる書面）において、純資産の部の合計額として表示された金額が1億円である場合"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":2,"explanation":"拒否されるのはa・c。a:個人で貸付業務に3年以上の経験がない者は拒否事由。c:社内規則が不十分な場合も拒否事由。b:営業所ごとに1年以上の経験者が常勤で1人以上いれば足りる。d:純資産5000万円以上が要件なので1億円は問題なし。","topic":"登録・届出・監督処分","exps":["○ 該当する:個人で貸付業務の経験が3年未満の者は拒否事由","× 該当しない:常勤で経験1年以上の者が1人以上いれば足りる","○ 該当する:社内規則が不十分なら拒否事由","× 該当しない:純資産額が基準額(5000万円)以上なら拒否事由に当たらない"]},{"id":"R6-03","year":"令和6年度","qNum":3,"category":"法及び関係法令","stem":"貸金業法第8条（変更の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、その貸金業を営む営業所又は事務所（以下、本問において「営業所等」という。）の所在地を変更しようとする場合、あらかじめ、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。"},{"label":"b","text":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所等のホームページアドレスを変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},{"label":"c","text":"貸金業者は、その業務の種類及び方法を変更しようとする場合、あらかじめ、その旨を登録行政庁に届け出なければならない。"},{"label":"d","text":"貸金業者は、貸金業の他に事業を行っている場合において、その事業の種類を変更したときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":2,"explanation":"a適切:営業所の名称・所在地の変更は『あらかじめ』届出。d適切:他の事業の種類の変更は変更後2週間以内。b不適切:広告用ホームページアドレスの変更は事前の届出(2週間以内の事後届出ではない)。c不適切:業務の種類・方法の変更は変更後2週間以内の届出で、事前届出ではない。","topic":"登録・届出・監督処分","exps":["○ 営業所の所在地の変更は事前の届出","× ホームページアドレスの変更は事前の届出(事後2週間以内ではない)","× 業務の種類・方法の変更は変更後2週間以内(事前ではない)","○ 他の事業の種類の変更は変更後2週間以内"]},{"id":"R6-04","year":"令和6年度","qNum":4,"category":"法及び関係法令","stem":"貸金業の業務の適切な運営の確保に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、信用情報に関する機関（資金需要者等の借入金返済能力に関する情報の収集及び貸金業者に対する当該情報の提供を行うものをいう。）から提供を受けた情報であって個人である資金需要者等の借入金返済能力に関するものを、資金需要者等の返済能力の調査以外の目的のために利用しないことを確保するための措置を講じなければならない。"},{"label":"b","text":"貸金業者は、貸金業の業務を第三者に委託する場合には、当該業務の内容に応じ、当該業務の委託を受けた者（以下、本問において「受託者」という。）における当該業務の実施状況を、定期的に又は必要に応じて確認すること等により、受託者が当該業務を的確に遂行しているかを検証し、必要に応じ改善させる等、受託者に対する必要かつ適切な監督等を行うための措置を講じなければならない。"},{"label":"c","text":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、監督当局は、貸金業者の監督に当たっては、コンプライアンスに係る基本的な方針、具体的な実践計画（コンプライアンス・プログラム）や行動規範（倫理規程、コンプライアンス・マニュアル）等が策定され、定期的又は必要に応じ、見直しが行われているか、特に、業績評価や人事考課等において収益目標（ノルマ）に偏重することなく、コンプライアンスを重視しているかに留意するものとされている。"},{"label":"d","text":"監督指針によれば、監督当局は、貸金業者の監督に当たっては、顧客等に関する情報管理について、内部管理部門における定期的な点検や内部監査部門による内部監査を通じ、その実施状況を把握・検証しているか、また、当該検証等の結果に基づき、態勢の見直しを行うなど、顧客等に関する情報管理の実効性が確保されているかに留意するものとされている。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":4,"explanation":"a〜dはいずれも貸金業法・監督指針に沿った適切な記述(情報の目的外利用防止措置、委託先の監督、コンプライアンス体制、顧客情報管理)。4個。","topic":"返済能力調査・過剰貸付け","exps":["○ 信用情報の取扱いに関する適切な措置を求める内容","○ 業務委託先の実施状況を定期的・随時に確認する","○ コンプライアンスの方針・実践計画の策定等を確認する","○ 顧客情報の管理を内部管理・内部監査で点検する"]},{"id":"R6-05","year":"令和6年度","qNum":5,"category":"法及び関係法令","stem":"貸金業者の苦情等対処に関する内部管理態勢の確立に関するａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）では、苦情等の発生状況に応じ、受付窓口における対応の充実を図るとともに、資金需要者等の利便に配慮したアクセス時間・アクセス手段（例えば、電話、手紙、FAX、ｅメール等）を設定する等、広く苦情等を受け付ける態勢を整備しているかに留意するものとされている。"},{"label":"b","text":"監督指針では、苦情等への対処について、単に処理の手続の問題と捉えるにとどまらず事後的な説明態勢の問題として位置付け、苦情等の内容に応じ資金需要者等から事情を十分にヒアリングしつつ、可能な限り資金需要者等の理解と納得を得て解決することを目指しているかに留意するものとされている。"},{"label":"c","text":"監督指針では、類型化した苦情等及びその対処結果等が内部管理部門や営業所等に報告されると共に、重要案件と認められない軽微な案件であっても、すべて、直ちに内部監査部門や経営陣に報告されるなど、情報共有が図られる態勢を整備しているかに留意するものとされている。"},{"label":"d","text":"監督指針では、苦情等の内容及び対処結果について、自ら対処したものに加え、外部機関が介在して対処したものを含め、適切かつ正確に記録・保存しているか、また、これらの苦情等の内容及び対処結果について、指定ADR機関より提供された情報等も活用しつつ、分析し、その分析結果を継続的に資金需要者等対応・事務処理についての態勢の改善や苦情等の再発防止策・未然防止策に活用する態勢を整備しているかに留意するものとされている。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":3,"explanation":"cが不適切:苦情等はすべて直ちに内部監査部門・経営陣へ報告するのではなく、重要案件を報告する形が求められる。a・b・dは指針の着眼点どおりで3個。","topic":"書面交付・帳簿","exps":["○ 受付窓口の充実とアクセス手段への配慮を求める","○ 苦情対処を事後的な説明態勢の問題として位置付ける","× 重要案件のみ報告すれば足り、軽微な案件まで直ちに全て報告する必要はない","○ 苦情の内容・対処結果を記録・保存する"]},{"id":"R6-06","year":"令和6年度","qNum":6,"category":"法及び関係法令","stem":"貸金業務取扱主任者及び貸金業法第12条の4（証明書の携帯等）第2項に規定する従業者名簿（以下、本問において「従業者名簿」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業務取扱主任者が営業所又は事務所（以下、本問において「営業所等」という。）に常時勤務する者と認められるには、社会通念に照らし、常時勤務していると認められるだけの実態が必要であり、当該営業所等の営業時間内に当該営業所等に常時駐在している必要があるとされている。","貸金業者は、その営業所等のうち従業者の数が80人である営業所等において、貸金業の業務に従事している従業者の数が50人である場合、当該営業所等に常時勤務する貸金業務取扱主任者を少なくとも2人以上置かなければならない。","監督指針によれば、従業者が従業者名簿の記載対象となるか否かについて、勧誘を伴わない広告のみを行う業務及び営業所等において資金需要者等と対面することなく行う業務に従事する者は、該当しないとされている。","貸金業者は、内閣府令で定めるところにより、営業所等ごとに、従業者名簿を備え、従業者の氏名、住所、貸金業法第12条の4第1項の証明書の番号その他内閣府令で定める事項を記載し、これを最終の記載をした日から10年間保存しなければならない。"],"note":"","correct":4,"explanation":"④適切:従業者名簿は営業所等ごとに備え、最終記載日から10年保存。②従業者50人なら50分の1で1人以上で足りる。①③は監督指針の記載と異なる。","topic":"主任者・社内体制","exps":["× 常時勤務の認定要件の記述が指針と異なる(要確認)","× 必要な主任者数の算定が誤り(業務従事者50人なら1人)","× 対面しない業務の従事者も従業者名簿の対象","○ 従業者名簿は営業所等ごとに備え、最終記載日から10年保存"]},{"id":"R6-07","year":"令和6年度","qNum":7,"category":"法及び関係法令","stem":"貸金業法上の禁止行為等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、その貸金業の業務に関し、保証人となろうとする者に対し、主たる債務者が弁済することが確実であると誤解させるおそれのあることを告げる行為をした場合、刑事罰の対象とはならないが、行政処分の対象となる。"},{"label":"b","text":"貸金業者は、暴力団員による不当な行為の防止等に関する法律第2条第6号に規定する暴力団員でなくなった日から5年を経過しない者を貸金業の業務に従事させ、又はその業務の補助者として使用した場合、行政処分の対象となるだけでなく、刑事罰の対象となる。"},{"label":"c","text":"貸金業者は、その貸金業の業務に関し、資金需要者等に対し、不確実な事項について断定的判断を提供し、又は確実であると誤認させるおそれのあることを告げる行為をした場合、行政処分の対象となるだけでなく、刑事罰の対象となる。"},{"label":"d","text":"貸金業者は、その従業者であることを証する証明書を携帯させることなく、その者を当該貸金業者の貸金業の業務に従事させた場合、刑事罰の対象とはならないが、行政処分の対象となる。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":1,"explanation":"公式正答は①(a・b)。bは暴力団員等の使用で、行政処分・刑事罰の両方の対象。c・dは処分の種類の説明が誤りとされる(正確な区分は貸金業法第12条の6・罰則規定で要確認)。","topic":"広告・勧誘・禁止行為","exps":["○ 保証人への誤解告知は刑事罰の対象とならない(行政処分の対象)","○ 暴力団員でなくなって5年を経過しない者の使用は禁止","× 断定的判断の提供の処分の種類の記述が異なる(要確認)","× 証明書不携帯は刑事罰の対象にもなる(要確認)"]},{"id":"R6-08","year":"令和6年度","qNum":8,"category":"法及び関係法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、個人事業者である顧客Ｂとの間で、貸付けに係る契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。","Ａは、法人である顧客Ｂとの間で貸付けに係る契約を締結するにあたり、Ｂの代表者であるＣとの間で保証契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＣの返済能力の調査を行う必要はない。","Ａは、個人である顧客Ｂとの間で、極度額を50万円とする極度方式基本契約を締結した後、Ｂに返済能力の低下が認められたことを理由に極度額を20万円に減額した。この場合において、極度額をその減額の前の50万円まで増額しようとするときには、Ａは、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。","Ａは、個人である顧客Ｂとの間で、極度方式貸付けに係る契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。"],"note":"","correct":4,"explanation":"④適切:個別の極度方式貸付けは基本契約の際に調査済みのため、信用情報の使用は不要。①個人事業者は個人なので使用が必要、②保証人となる個人も調査が必要、③増額時は調査が必要。","topic":"返済能力調査・過剰貸付け","exps":["× 個人事業者は個人なので信用情報の使用が必要","× 保証人となる代表者(個人)についても信用情報の使用が必要","× 極度額減額後の再増額時の調査の要否の記述が異なる(要確認)","○ 個別の極度方式貸付けは基本契約で調査済みのため不要"]},{"id":"R6-09","year":"令和6年度","qNum":9,"category":"法及び関係法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に定める契約（以下、本問において「除外契約」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"他の貸金業者からの住宅の改良に必要な資金の貸付けが行われるまでのつなぎとして行う貸付けに係る契約は、除外契約に該当しない。"},{"label":"b","text":"国債証券、地方債証券、株券で金融商品取引所に上場されているもの（以下、本問において「本件有価証券」という。）を担保とする貸付けに係る契約であって、貸付けの金額が当該貸付けに係る契約の締結時における本件有価証券の時価の範囲内であるものは、除外契約に該当する。"},{"label":"c","text":"個人顧客との間で締結する不動産を担保とする貸付けに係る契約であって、当該不動産を担保として提供する者が当該個人顧客でないものは、当該個人顧客の返済能力を超えないと認められるものであっても、除外契約に該当しない。"},{"label":"d","text":"売却を予定している個人顧客の不動産の売却代金により弁済される貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該不動産の価格の範囲内であるものに限り、当該不動産を売却することにより当該個人顧客の生活に支障を来すと認められる場合を除く。）は、除外契約に該当する。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":3,"explanation":"b・dが適切。b:上場有価証券等の担保貸付けは除外契約。d:不動産売却代金で弁済される貸付けは除外契約。a:住宅改良資金のつなぎ貸付けも除外契約に該当。c:担保提供者が顧客本人でなくても該当しうる。","topic":"返済能力調査・過剰貸付け","exps":["× 住宅改良資金のつなぎ貸付けも除外契約に該当する","○ 上場国債・株券を担保とする貸付けは要件を満たせば除外契約","× 担保提供者が顧客本人でない貸付けは要件を満たさない(要確認)","○ 不動産の売却代金で弁済される貸付けは除外契約"]},{"id":"R6-10","year":"令和6年度","qNum":10,"category":"法及び関係法令","stem":"株式会社である貸金業者Ａが、貸金業法第13条の3に基づき、個人顧客Ｂとの間で締結している極度方式基本契約（以下、本問において「本件基本契約」という。）について行う、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","items":[],"choices":["Ａは、本件基本契約の契約期間を本件基本契約の締結日から同日以後1か月以内の一定の期日までの期間及び当該一定の期日の翌日以後1か月ごとの期間に区分したそれぞれの期間（以下、本問において「所定の期間」という。）において、直近の所定の期間内にＡが行った本件基本契約に基づく極度方式貸付けの金額の合計額が5万円を超えるときは、当該所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高の合計額の多寡にかかわらず、本件調査を行わなければならない。","Ａは、貸金業法施行規則第10条の24（基準額超過極度方式基本契約に係る調査の要件等）第1項第1号に規定する要件に該当し、本件調査を行う必要がある場合には、所定の期間の末日から3週間を経過する日までに、指定信用情報機関にＢの個人信用情報の提供の依頼をしなければならない。","Ａは、本件基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な本件基本契約の極度額の減額に係る措置を講じた場合、それ以降、3か月以内の一定の期間ごとに、本件調査を行う必要はない。","Ａは、本件調査により、本件基本契約が基準額超過極度方式基本契約に該当すると認められたことから、本件基本契約に基づく新たな極度方式貸付けの停止に係る措置を講じていた場合において、当該措置を解除したときは、その日から1か月以内に本件調査を行わなければならない。"],"note":"","correct":2,"explanation":"②適切:調査が必要な場合は、所定期間の末日から3週間を経過する日までに信用情報の提供を依頼する。③極度額を減額した後も、所定の期間ごとの調査は継続する(令和7年問9d参照)。","topic":"返済能力調査・過剰貸付け","exps":["× 期間区分の記述が規則と異なる(要確認)","○ 所定期間の末日から3週間を経過する日までに信用情報の提供を依頼","× 減額後も所定の期間ごとの調査は続ける","× 措置の解除に関する記述が規則と異なる(要確認)"]},{"id":"R6-11","year":"令和6年度","qNum":11,"category":"法及び関係法令","stem":"貸金業法第17条に規定する書面（以下、本問において「契約締結時の書面」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における極度方式基本契約（以下、本問において「基本契約」という。）及び基本契約に基づく極度方式貸付けに係る契約（以下、本問において「個別契約」という。）は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","items":[],"choices":["貸金業者は、基本契約を締結した場合にその相手方に交付する契約締結時の書面に、当該貸金業者が基本契約に定める極度額（当該貸金業者が当該相手方に対し貸付けの元本の残高の上限として極度額を下回る額を提示する場合にあっては、当該下回る額）を1回貸し付けることその他の必要な仮定を置き、当該仮定に基づいた将来支払う返済金額の合計額、返済期間及び返済回数並びに当該仮定を記載しなければならない。","貸金業者が個別契約を締結した場合にその相手方に交付する契約締結時の書面の記載事項のうち、貸付けの利率等基本契約締結時に交付した契約締結時の書面に記載された事項については、基本契約の契約番号の記載をもって代えることができる。","貸金業者は、個別契約を締結した場合において、その相手方に対し、当該相手方の承諾を得て、内閣府令で定めるところにより、一定期間における貸付け及び弁済その他の取引の状況を記載した書面として内閣府令で定めるものを交付するときは、個別契約を締結するごとに、遅滞なく、契約年月日及び貸付けの金額等を記載した書面を当該相手方に交付する必要はない。","貸金業者は、基本契約を締結した後、その相手方との合意に基づき、当該基本契約の極度額を引き下げた場合、変更後の内容を記載した契約締結時の書面を当該相手方に交付する必要はないが、その後当該基本契約の極度額を引き下げる前の元の額まで引き上げる場合は、変更後の内容を記載した契約締結時の書面を当該相手方に交付しなければならない。"],"note":"","correct":1,"explanation":"①適切:基本契約の書面には、極度額を1回貸し付ける等の仮定に基づく返済金額の合計額・返済期間・回数を記載する。②③④は府令の定めと異なる記述で不適切。","topic":"書面交付・帳簿","exps":["○ 基本契約書面には極度額などを記載する","× 個別契約書面では基本契約書面の引用で省略できない(要確認)","× 取引状況の書面による代替の要件が異なる(要確認)","× 極度額を引き下げた後の再引上げ時の交付要否の記述が異なる(要確認)"]},{"id":"R6-12","year":"令和6年度","qNum":12,"category":"法及び関係法令","stem":"貸金業法第17条第1項各号に掲げる事項を記載した書面（以下、本問において「契約締結時の書面」という。）の交付に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","items":[],"choices":["契約締結時の書面に記載された事項のうち、貸金業者の商号、名称又は氏名及び住所に変更が生じた場合、当該貸金業者は、変更後の内容を記載した契約締結時の書面を貸付けに係る契約の相手方に交付しなければならない。","契約締結時の書面に記載された事項のうち、貸付けの利率が引き下げられた場合、貸金業者は、変更後の内容を記載した契約締結時の書面を貸付けに係る契約の相手方に交付しなければならない。","貸金業者が貸付けに係る契約について保証契約を締結している場合において、契約締結時の書面に記載された事項のうち、貸付けに係る契約の各回の返済期日及び返済金額に変更が生じた場合、当該貸金業者は、変更後の内容を記載した契約締結時の書面を、当該貸付けに係る契約の相手方だけでなく、当該保証契約の保証人にも交付しなければならない。","契約締結時の書面に記載された事項のうち、重要なものとして内閣府令で定めるものに変更が生じた場合において、貸金業者が貸付けに係る契約の相手方に交付する変更後の内容を記載した契約締結時の書面には、当該変更が生じた事項のみを記載すれば足りる。"],"note":"","correct":3,"explanation":"③適切:保証契約がある場合、返済期日・返済金額の変更後の書面は、貸付けの相手方だけでなく保証人にも交付が必要。①商号等の変更は対象外、②利率の引下げは不要、④変更書面には全事項を記載する。","topic":"書面交付・帳簿","exps":["× 商号・住所の変更は再交付の対象外(要確認)","× 利率の引下げは再交付不要","○ 保証契約がある場合、返済期日・返済金額の変更は変更後の書面を交付","× 変更書面の記載事項の記述が異なる(要確認)"]},{"id":"R6-13","year":"令和6年度","qNum":13,"category":"法及び関係法令","stem":"貸金業法第19条に規定する帳簿（以下、本問において「帳簿」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、内閣府令で定めるところにより、その営業所又は事務所（以下、本問において「営業所等」という。）ごとに、帳簿を備え、債務者ごとに貸付けの契約について契約年月日、貸付けの金額、受領金額その他内閣府令で定める事項を記載し、これを保存しなければならないが、その営業所等が代理店であるときは、帳簿の備付けを行うことを要しない。"},{"label":"b","text":"貸金業者は、帳簿を作成するときは、当該帳簿を保存すべき営業所等において貸金業法第17条第1項に規定する書面（契約締結時の書面）の写しを保存することをもって、貸金業法施行規則第16条（帳簿の備付け）第1項第1号に定める事項の記載に代えることができる。"},{"label":"c","text":"債務者は、貸金業者に対し、帳簿（利害関係がある部分に限る。）の閲覧又は謄写を請求することができるが、債務者以外の保証人及び弁済者は、債務者の承諾を得たときに限り、帳簿の閲覧又は謄写を請求することができる。"},{"label":"d","text":"貸金業者は、帳簿の閲覧又は謄写の請求がなされた場合において、当該請求が当該請求を行った者の権利の行使に関する調査を目的とするものでないことが明らかであるときを除き、当該請求を拒むことができない。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":3,"explanation":"b・dが適切。b:契約締結時書面の写しの保存で記載に代えられる。d:閲覧・謄写の請求は、権利行使の調査目的でないことが明らかな場合を除き拒めない。a:代理店でも帳簿の備付けが必要。c:保証人・弁済者も債務者の承諾なしに請求できる。","topic":"書面交付・帳簿","exps":["× 帳簿の備付け・記載事項の記述が規定と異なる(要確認)","○ 契約締結時書面の写しの保存で帳簿の記載に代えられる","× 保証人・弁済者も債務者の承諾なく閲覧・謄写を請求できる","○ 権利行使の調査目的でないことが明らかなときを除き、請求を拒めない"]},{"id":"R6-14","year":"令和6年度","qNum":14,"category":"法及び関係法令","stem":"貸金業法第21条（取立て行為の規制）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、午後8時から午前9時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならない。","貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者は、貸付けの契約に基づく債権の取立てをするに当たって、債務者等以外の者から債権の弁済を受けてはならない。","貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、債務者等から家族に知られないように要請を受けているか否かにかかわらず、債務者等の自宅に電話をかけ家族がこれを受けた場合に貸金業者であることを名乗り、郵送物の送付に当たり差出人として貸金業者であることを示すことは、貸金業法第21条第1項第5号の「貼り紙、立看板その他何らの方法をもってするを問わず、債務者の借入れに関する事実その他債務者等の私生活に関する事実を債務者等以外の者に明らかにすること」に該当するおそれが大きいとされている。","監督指針によれば、反復継続して、電話をかけ、電報を送達し、電子メールもしくはファクシミリ装置等を用いて送信し又は債務者、保証人等の居宅を訪問することは、貸金業法第21条第1項の「人の私生活若しくは業務の平穏を害するような言動」に該当するおそれが大きいとされている。"],"note":"","correct":4,"explanation":"④適切:反復継続した電話・訪問等は、私生活・業務の平穏を害する言動に該当するおそれが大きい。①禁止時間帯は午後9時〜午前8時、②『弁済を要求する』行為が禁止、③は家族に知られないよう要請を受けている場合に限り違反。","topic":"取立て・債権譲渡","exps":["× 取立ての禁止時間帯の記述が異なる(要確認)","× 債務者等以外への弁済要求に関する記述が異なる(要確認)","× 家族に知られないよう要請がある場合に限り違反となりうる","○ 反復継続した電話・訪問等は平穏を害する言動に該当"]},{"id":"R6-15","year":"令和6年度","qNum":15,"category":"法及び関係法令","stem":"貸金業法第24条の6の2（開始等の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、第三者に貸付けに係る契約に基づく債権を譲渡した場合又は第三者から貸付けに係る契約に基づく債権を譲り受けた場合は、内閣府令で定めるところにより、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。"},{"label":"b","text":"貸金業者は、第三者に貸金業の業務の委託を行った場合又は当該業務の委託を行わなくなった場合は、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。"},{"label":"c","text":"貸金業者は、貸金業協会に加入又は脱退した場合は、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。"},{"label":"d","text":"貸金業者は、貸金業法第24条の6の2各号のいずれかに該当することとなったときは、その日から30日以内に、その旨を登録行政庁に届け出なければならない。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":3,"explanation":"b・cが適切:業務委託の開始・終了と協会への加入・脱退は届出事項。d:届出期限は30日ではなく2週間以内。a:債権の譲渡は届出事項だが、譲受けは届出事項ではない(令和5年問13④参照)。","topic":"登録・届出・監督処分","exps":["× 債権の譲渡は届出事項だが、譲受けは届出事項ではない","○ 業務委託の開始・終了は届出事項","○ 協会への加入・脱退は届出事項","× 届出期限は30日ではなく2週間以内"]},{"id":"R6-16","year":"令和6年度","qNum":16,"category":"法及び関係法令","stem":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）による、その登録を受けた貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["登録行政庁は、その登録を受けた貸金業者に法令に違反する行為が認められなければ、当該登録行政庁の職員に、当該貸金業者の営業所もしくは事務所に立ち入らせ、その業務に関して質問させ、又は帳簿書類その他の物件を検査させることができない。","登録行政庁は、その登録を受けた貸金業者（株式会社であるものとする。）が、貸金業法第24条（債権譲渡等の規制）第3項に規定する取立て制限者（以下、本問において「取立て制限者」という。）を相手方として、貸付けの契約に基づく債権の譲渡を行った場合において、当該債権譲渡の業務を執行した取締役が、当該債権譲渡を行うに際し、当該相手方が取立て制限者であることを知っていたときは、当該貸金業者に対し当該取締役の解任を命ずることができる。","登録行政庁は、その登録を受けた貸金業者が、保証業者と貸付けに係る契約について保証契約を締結しようとする場合において、その保証業者が貸金業法第6条（登録の拒否）第1項第6号に規定する暴力団員等であることを知りながら、これを相手方として、貸付けに係る契約について保証契約を締結したときは、その登録を取り消すことはできないが、その業務の全部又は一部の停止を命ずることができる。","貸金業者向けの総合的な監督指針によれば、登録行政庁は、貸金業法第24条の6の3に基づく業務改善命令に関し、その登録を受けた貸金業者の検査結果やオフサイト・モニタリング等への対応として、報告内容を検証した結果、資金需要者等の利益の保護に関し問題が認められる場合においては、当該貸金業者が自主的に資金需要者等の利益の保護に取り組んでいる事情は考慮することなく、当該行為の重大性・悪質性のみに着眼して、最終的な行政処分の内容を決定することとされている。"],"note":"","correct":2,"explanation":"②適切:取立て制限者への債権譲渡を知り又は知り得て行った場合、業務を執行した取締役に関し登録取消し等の対象となる。①立入検査は法令違反がなくても可、③暴力団員等との保証契約は登録取消しの対象、④自主的な取組みの事情は考慮される。","topic":"登録・届出・監督処分","exps":["× 立入検査は法令違反が認められなくても可能","○ 取立て制限者への譲渡を知り又は知り得て行った場合は処分の対象","× 保証業者との保証契約に関する記述が異なる(要確認)","× 業務改善命令に関する指針の記述が異なる(要確認)"]},{"id":"R6-17","year":"令和6年度","qNum":17,"category":"法及び関係法令","stem":"指定信用情報機関への個人信用情報の提供等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","items":[{"label":"a","text":"加入貸金業者(注1)は、資金需要者である個人の顧客を相手方とする極度方式基本契約を締結したときは、遅滞なく、当該極度方式基本契約に係る個人信用情報を加入指定信用情報機関(注2)に提供しなければならない。"},{"label":"b","text":"加入貸金業者は、貸金業法第41条の36（指定信用情報機関への信用情報の提供等に係る同意の取得等）第1項及び第2項に規定する同意を得た場合には、当該同意に関する記録を作成し、個人信用情報を加入指定信用情報機関に提供した日から10年間保存しなければならない。"},{"label":"c","text":"加入貸金業者又はその役員もしくは職員は、加入指定信用情報機関から提供を受けた信用情報を返済能力等調査以外の目的に使用してはならないが、貸金業者向けの総合的な監督指針によれば、例えば、途上与信(注3)を行うために取得した信用情報を勧誘に二次利用した場合や信用情報を内部データベースに取り込み当該内部データベースを勧誘に利用した場合等（債権の保全を目的とした利用を含む。）であっても、返済能力の調査以外の目的による使用に該当することに留意する必要があるとされている。"},{"label":"d","text":"加入貸金業者は、加入指定信用情報機関に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合には、内閣府令で定める場合を除き、あらかじめ、当該資金需要者等から同意を得なければならないが、当該同意は書面又は電磁的方法による方法で取得しなければならず、口頭での同意の取得は認められない。(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。(注3) 途上与信とは、貸金業法第13条の3（基準額超過極度方式基本契約に係る調査）第1項及び第2項の規定に基づく調査をいう。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":4,"explanation":"c・dが適切:信用情報の目的外使用(二次利用)は不可、同意は書面または電磁的方法で取得する。a・bは提供のタイミングや保存期間の記述が条文と異なり不適切。","topic":"指定信用情報機関","exps":["× 提供のタイミングの記述が異なる(要確認)","× 同意の記録の保存等の記述が異なる(要確認)","○ 返済能力調査以外の目的に信用情報を使用してはならない","○ 信用情報の提供依頼には同意が必要"]},{"id":"R6-18","year":"令和6年度","qNum":18,"category":"法及び関係法令","stem":"金利等の規制に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["金銭の貸付けを行う者が業として金銭の貸付けを行う場合において、元本50万円に対し年2割（20％）の利息の契約をしたときは、当該金銭の貸付けを行う者は、出資法(注)上、刑事罰の対象となる。","金銭の貸付けを行う者が業として行う金銭の貸付けにつき、業として保証を行う場合において、当該保証に係る貸付けの利息が利息の契約時以後変動し得る利率をもって定められ、かつ、当該保証に際し、当該貸付けの債権者と保証人の合意により利息制限法第8条第2項第1号に規定する特約上限利率が定められなかった。この場合、当該保証人が年1割（10％）の保証料の契約をしたときは、当該保証人は、出資法上、刑事罰の対象となる。","金銭の貸借の媒介に係る手数料の契約は、その手数料がその媒介に係る貸借の金額を元本として利息制限法第1条（利息の制限）に規定する利率により計算した金額を超えるときは、利息制限法上、その超過部分について、無効となる。","営業的金銭消費貸借における債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が年2割（20％）を超えるときは、利息制限法上、その超過部分について、無効となる。"],"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","correct":4,"explanation":"④適切:賠償額の予定は年20%超の部分が無効(令和7年問25②も同旨)。①年20%ちょうどは出資法の刑事罰の対象外、③媒介手数料は利息制限法でなく出資法の規制。","topic":"利息制限法・出資法","exps":["× 年20%ちょうどは出資法の刑事罰の対象外(超えると対象)","× 変動利率の保証に関する記述が異なる(要確認)","× 媒介手数料は出資法の規制で、利息制限法の利率では判定しない","○ 賠償額予定は年20%超の部分が無効"]},{"id":"R6-19","year":"令和6年度","qNum":19,"category":"法及び関係法令","stem":"貸金業における金融ADR制度に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、指定紛争解決機関である日本貸金業協会に加入していない場合であっても、指定紛争解決機関との間で手続実施基本契約を締結する措置を講じなければならず、手続実施基本契約を締結する措置を講じたときは、当該手続実施基本契約の相手方である指定紛争解決機関の商号又は名称を公表しなければならない。","貸金業者は、貸金業法第16条の2第1項に定める書面（契約締結前の書面）に、手続実施基本契約を締結した指定紛争解決機関の商号又は名称を表示する必要はないが、貸金業法第17条第1項に規定する書面（契約締結時の書面）に、当該指定紛争解決機関の商号又は名称を表示しなければならない。","加入貸金業者(注)は、訴訟が係属している請求を目的とする紛争解決手続が開始された場合には、当該訴訟が係属している旨、当該訴訟における請求の理由及び当該訴訟の程度を指定紛争解決機関に報告しなければならない。","指定紛争解決機関又は紛争解決委員は、苦情処理手続を開始し、又は加入貸金業者に係る資金需要者等からの申立てに基づき紛争解決手続を開始した場合において、加入貸金業者にこれらの手続に応じるよう求めることができ、当該加入貸金業者は、その求めがあったときは、正当な理由なくこれを拒んではならない。"],"note":"(注) 加入貸金業者とは、指定紛争解決機関と手続実施基本契約を締結した貸金業者を\nいう。","correct":2,"explanation":"②が不適切:指定紛争解決機関の商号・名称は、契約締結前の書面への表示が必要で、契約締結時の書面への表示は不要。","topic":"協会自主規制・紛争解決","exps":["○ 協会非加入でも手続実施基本契約の締結措置が必要","× 契約締結前書面への紛争解決機関の名称表示に関する記述が誤り(要確認)","○ 訴訟が係属している場合は指定紛争解決機関に通知","○ 手続に応じることを求められた加入貸金業者は正当な理由なく拒めない"]},{"id":"R6-20","year":"令和6年度","qNum":20,"category":"法及び関係法令","stem":"Ａは株式会社である貸金業者であり、Ｂは個人である顧客である。貸金業法第13条（返済能力の調査）第3項及び同法第13条の3（基準額超過極度方式基本契約に係る調査）第3項に規定する源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるもの（以下、本問において「年収証明書」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、貸金業法施行規則第10条の16（指定信用情報機関が保有する信用情報の使用義務の例外）に規定する貸付けの契約ではないものとする。","items":[],"choices":["Ａは、Ｂとの間で、初めて貸付けに係る契約を締結しようとする場合において、当該契約の貸付けの金額が40万円であり、指定信用情報機関から提供を受けた信用情報により判明したＢに対するＡ以外の貸金業者の貸付けの残高の合計額（以下、本問において「他社残高」という。）が70万円であるときは、返済能力の調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約を締結しようとする場合において、既にＢから2年前に発行された源泉徴収票の提出を受けていたとしても、返済能力の調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","Ａは、基準額超過極度方式基本契約に係る調査をしなければならない場合において、Ｂとの間の貸付けに係る契約が極度額を30万円とする極度方式基本契約のみであり、他社残高が80万円でかつその全てが除外契約(注)に係るものであるときは、当該調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","Ａは、基準額超過極度方式基本契約に係る調査において、Ｂに係る極度方式個人顧客合算額が100万円を超え、Ｂから年収証明書の提出又は提供を受けなければならない場合において、年収証明書の提出又は提供を受けるときには、Ｂに係る極度方式個人顧客合算額が100万円を超えると知った日から2か月以内に年収証明書の提出又は提供を受けなければならない。"],"note":"(注) 除外契約とは、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する\n個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定\nするものをいう。","correct":3,"explanation":"③適切:極度方式の個人顧客合算額は自社の極度額30万円+他社残高80万円(除外契約分も算入)で110万円となり、100万円を超えるため年収証明書が必要。","topic":"返済能力調査・過剰貸付け","exps":["× 他社残高との合算に関する記述が異なる(要確認)","× 年収証明書の要否の記述が異なる(要確認)","○ 自社の極度額30万円+他社残高80万円=110万円で100万円超","× 年収証明書の取得に関する記述が異なる(要確認)"]},{"id":"R6-21","year":"令和6年度","qNum":21,"category":"法及び関係法令","stem":"次の①～④の記述のうち、個人顧客が既に負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約（以下、本問において「当該貸付契約」という。）が、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23第1項第1号の2で定めるもの（借入残高を段階的に減少させるための借換え）に該当するための要件として適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、当該貸付契約は、極度方式基本契約ではないものとする。","items":[],"choices":["当該貸付契約に基づき将来支払う返済金額の合計額が既存債務に係る将来支払う返済金額の合計額を上回らないこと。","当該貸付契約の1か月の負担が既存債務に係る1か月の負担を上回らないこと。","当該貸付契約の貸付けの利率が、既存債務に係る貸付けに係る契約（既存債務に係る貸付けに係る契約が2以上ある場合は、弁済時における貸付けの残高により加重平均した貸付けの利率）の貸付けの利率を上回らないこと。","既存債務につき供されている物的担保以外の物的担保を供させず、かつ、既存債務に係る保証契約の保証人以外の者を当該貸付契約の保証契約の保証人としないこと。"],"note":"","correct":1,"explanation":"公式正答は①。借換えが顧客に有利となる要件は、将来支払う返済金額の合計額が既存債務の合計額を『下回る』こと。『上回らない』では足りない(要確認)。","topic":"返済能力調査・過剰貸付け","exps":["× 将来の返済総額が既存債務の合計額を『下回る』ことが必要(要確認)","○ 1か月の負担が既存債務の負担を上回らない","○ 利率が既存債務の加重平均利率を上回らない","○ 既存債務にない担保・保証人を追加しない"]},{"id":"R6-22","year":"令和6年度","qNum":22,"category":"法及び関係法令","stem":"貸金業法第15条（貸付条件の広告等）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における金銭の貸付けには、手形の割引及び売渡担保は含まれないものとする。","items":[],"choices":["貸金業者が金銭の貸付けの条件について広告をする場合において、営業所又は事務所の電話番号を表示するときは、当該営業所又は事務所で使用する携帯電話の番号を表示することはできない。","貸金業者が金銭の貸付けの条件について広告をするときは、貸金業者の登録番号を表示しなければならないが、その登録番号の括弧書については、記載を省略することができる。","貸金業者が金銭の貸付けの条件について広告をするときは、担保を供することが必要な場合における当該担保に関する事項について表示しなければならない。","貸金業者が金銭の貸付けの条件について広告をするときは、不当景品類及び不当表示防止法、屋外広告物法第3条（広告物の表示等の禁止）第1項の規定に基づく都道府県の条例その他の法令に違反する広告をしてはならない。"],"note":"","correct":2,"explanation":"②が不適切:広告では登録番号の括弧書きの省略はできない(契約締結時書面では省略可)。","topic":"広告・勧誘・禁止行為","exps":["○ 広告に携帯電話の番号は表示できない","× 登録番号の括弧書は省略できない","○ 担保に関する事項を表示する","○ 他の法令に違反しない表示とする"]},{"id":"R6-23","year":"令和6年度","qNum":23,"category":"法及び関係法令","stem":"貸金業法第16条の2に規定する書面（以下、本問において「契約締結前の書面」という。）の交付に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","items":[],"choices":["貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業者は、貸付けに係る契約を締結しようとする場合において、当該契約の相手方となろうとする者に契約締結前の書面を交付するときは、当該書面は、少なくとも、契約締結の前日までに交付が必要であることに留意する必要があるとされている。","貸金業者が、貸付けに係る契約を締結しようとする場合に、当該契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項には、契約年月日、契約の相手方の氏名及び住所は含まれていない。","貸金業者が、貸付けに係る契約を締結しようとする場合に、当該契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項については、当該書面により明らかにすべきものとされる事項を日本産業規格Z8305に規定する8ポイント以上の大きさの文字及び数字を用いて明瞭かつ正確に記載しなければならない。","監督指針によれば、貸金業者が、貸付けに係る契約の相手方となろうとする者に契約締結前の書面を交付した後、契約締結前に、法令で定められた記載事項の内容に変更が生じた場合には、再度、当該契約の相手方となろうとする者に対し契約締結前の書面を交付する必要があるとされている。"],"note":"","correct":1,"explanation":"①が不適切:契約締結前の書面は『契約締結の前日まで』ではなく『契約締結までに』交付すればよい。","topic":"書面交付・帳簿","exps":["× 契約締結前書面の交付時期等の記述が指針と異なる(要確認)","○ 契約年月日・相手方の氏名住所は記載事項に含まれない","○ 記載事項は書面により明らかにすべきものとされる","○ 記載事項に変更が生じた場合は再交付が必要"]},{"id":"R6-24","year":"令和6年度","qNum":24,"category":"法及び関係法令","stem":"貸金業者Ａが個人顧客Ｂとの間で締結した貸付けに係る契約（以下、本問において「本件貸付契約」という。）に基づく債権について弁済を受けた場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂから、Ａの営業所窓口で本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、直ちに、貸金業法第18条第1項に規定する書面（以下、本問において「受取証書」という。）をＢに交付しなければならない。","Ａは、Ｂから、Ａの預金口座に対する払込みにより本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、Ｂから請求を受けたときに限り、受取証書をＢに交付しなければならない。","Ａは、第三者Ｃから、Ａの営業所窓口で本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、Ｃに交付する受取証書に、Ｂの氏名及びＣの氏名を記載しなければならない。","Ａは、Ｂから、Ａの営業所窓口で本件貸付契約に基づく債権の全部について弁済を受けた。この場合、Ａは、Ｂから請求を受けたときは、遅滞なく、受取証書の交付とは別に、債権の全部について弁済を受けたことを証する書面（完済証明書）をＢに交付しなければならない。"],"note":"","correct":4,"explanation":"④が不適切:全部弁済時は受取証書の交付で足り、受取証書とは別に完済証明書の交付を義務づける定めはない(要確認)。","topic":"貸金業法その他","exps":["○ 営業所窓口での弁済は直ちに受取証書を交付","○ 口座への払込みは請求を受けたときに限り交付","○ 第三者からの弁済の受取証書には債務者・弁済者の氏名を記載","× 完済証明書に関する記述が規定と異なる(要確認)"]},{"id":"R6-25","year":"令和6年度","qNum":25,"category":"法及び関係法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡するに当たっては、譲受人が貸金業者である場合を除き、譲受人に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項及び譲受人が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","貸金業者の貸付けに係る契約に基づく債権を譲り受けた者は、内閣府令で定めるところにより、その営業所又は事務所ごと（営業所又は事務所を有しない者にあっては、住所地又は居所地）に、その業務に関する帳簿を備え、当該債権の債務者ごとに当該債権に係る貸付けの契約について当該債権の譲受年月日及び当該貸付けの契約の契約年月日、当該債権の額及び貸付けの金額、受領金額その他内閣府令で定める事項を記載し、これを保存しなければならない。","貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、監督当局は、貸金業者の監督に当たっては、貸金業者の貸付債権の譲渡については、債権譲受人との債権譲渡契約において、債務者等からの問い合わせや取引履歴の開示請求などがある場合を想定し、債権譲受人との明確な責任分担のもとに債務者等に適切に対応するための規定が置かれているか、また、債権譲受人が債務者等に対し貸金業法第24条第2項に基づく債権譲渡通知を遅滞なく送付することや法令を遵守した債権管理及び回収を行うこと等、債務者等の保護の確保に努めるための規定が置かれているかに留意するものとされている。","監督指針によれば、監督当局は、貸金業者の監督に当たっては、貸金業者が、貸付債権について委託又は譲渡を受けて、管理又は回収を業として行う場合には、弁護士法等の規定に抵触しないか確認を行っているかに留意するものとされている。"],"note":"","correct":1,"explanation":"①が不適切:債権を譲渡するときの通知は、譲受人が貸金業者である場合も必要(『貸金業者を除く』ではない)。令和7年問13①も同旨。","topic":"民法","exps":["× 債権譲渡の通知は、譲受人が貸金業者の場合も必要","○ 譲受人も営業所等ごとに帳簿を備える","○ 指針は貸付債権の譲渡の適切性の確認を求める","○ 指針は弁護士法等への抵触の確認を求める"]},{"id":"R6-26","year":"令和6年度","qNum":26,"category":"法及び関係法令","stem":"Ａは、Ｂとの間で元本を30万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（以下、本問において「第一契約」という。）を初めて締結し金銭を貸し付けた。その後、Ａは、Ｂとの間で新たに営業的金銭消費貸借契約（以下、本問においてそれぞれ「第二契約」、「第三契約」という。）を締結しようとしている。この場合に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["第一契約に基づく債務の残存元本額が15万円である時点において、ＡとＢとの間で元本を90万円とし利息を年1割8分（18％）として第二契約を締結した場合、第一契約及び第二契約における利息の約定のうち年1割5分（15％）を超過する部分に限り無効となる。","第一契約に基づく債務の残存元本額が20万円である時点において、ＡとＢとの間で元本を8万円とし利息を年2割（20％）として第二契約を締結した場合、第二契約における利息の約定のうち年1割8分（18％）を超過する部分に限り無効となる。","第一契約に基づく債務の残存元本額が5万円である時点において、ＡとＢとの間で元本を60万円とし利息を年1割8分（18％）として第二契約を締結すると同時に、元本を40万円とし利息を年1割8分（18％）として第三契約を締結した場合、第二契約及び第三契約における利息の約定のうち年1割5分（15％）を超過する部分に限り無効となる。","第一契約に基づく債務の残存元本額が10万円である時点において、ＡとＢとの間で元本を80万円とし利息を年1割8分（18％）として第二契約を締結すると同時に、元本を9万円とし利息を年2割（20％）として第三契約を締結した場合、第三契約における利息の約定のうち年1割8分（18％）を超過する部分に限り無効となる。"],"note":"","correct":1,"explanation":"①が不適切:新たな契約の上限は『新契約の元本+既存の残存元本』の合計額で判定され、影響を受けるのは新しい契約(第二契約)のみ。第一契約の約定は15%に引き下げられない(15万+90万=105万で第二契約は15%上限)。","topic":"利息制限法・出資法","exps":["× 影響を受けるのは新しい契約(第二契約)だけで、第一契約の約定は引き下げられない","○ 残存元本20万+8万=28万円で上限18%","○ 残存元本との合算で上限を判定する","○ 残存元本との合算で上限を判定する"]},{"id":"R6-27","year":"令和6年度","qNum":27,"category":"法及び関係法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、現金自動支払機を利用して当該顧客から5,000円の弁済を受ける際に、その利用料として、110円（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約締結時の書面を交付した後、当該顧客から紛失による再発行の要請を受けたことに基づき、当該書面を再発行し、その手数料（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該手数料は、利息とみなされる。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、当該契約の契約書に貼付する当該顧客が負担すべき収入印紙の費用を当該顧客から受領した。この場合、当該費用は、利息とみなされない。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため、当該契約締結時に当該顧客にカードを交付し、その発行手数料（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該発行手数料は、利息とみなされる。"],"note":"","correct":2,"explanation":"公式正答は②(不適切)。①ATM利用料(1万円以下は110円まで)と③収入印紙代は除外項目でみなし利息ではなく、④カード発行手数料は利息とみなされる。②の再発行手数料の扱いが誤りとされる(要確認)。","topic":"利息制限法・出資法","exps":["○ ATM利用料(1万円以下は110円まで)は利息とみなされない","× 契約書面の再発行手数料の扱いが誤り(要確認)","○ 収入印紙の費用は利息とみなされない","○ カードの発行手数料は利息とみなされる"]},{"id":"R6-28","year":"令和6年度","qNum":28,"category":"貸付け・付随取引の法令実務","stem":"行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["成年被後見人の法律行為は、その成年後見人の同意を得て行われたときは、取り消すことができない。","被保佐人は、相続の承認又は放棄をするには、その保佐人の同意を得る必要はない。","被補助人は、家庭裁判所の審判により補助人の同意を得なければならないとされた行為以外の法律行為は、単独で有効に行うことができる。","一種又は数種の営業を許された未成年者は、これにより成年に達したものとみなされ、すべての法律行為について、成年者と同一の行為能力を有する。"],"note":"","correct":3,"explanation":"③適切:補助人の同意が必要とされた行為以外は単独で有効。①成年被後見人は同意があっても取消可、②相続の承認・放棄は保佐人の同意が必要、④営業の許可は、その営業に関する行為に限られる。","topic":"民法","exps":["× 成年被後見人の行為は、同意があっても取り消せる","× 被保佐人が相続の承認・放棄をするには保佐人の同意が必要","○ 同意を要する行為以外は、被補助人が単独で有効にできる","× 営業の許可はその営業に関する行為に限られる"]},{"id":"R6-29","year":"令和6年度","qNum":29,"category":"貸付け・付随取引の法令実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["無効な行為について当事者が無効であることを知って追認をしたときは、行為の時にさかのぼって有効であったものとみなされる。","成年被後見人は、法定代理人の同意を得て、取り消すことができる行為を追認することができる。","詐欺又は強迫によって取り消すことができる行為の取消しは、その取消しの意思表示をした時から将来に向かってその効力を生ずる。","取消権者により未成年者の法律行為が取り消された場合、その法律行為に基づく債務の履行として給付を受けた未成年者は、その法律行為によって現に利益を受けている限度において、給付を受けたものの返還義務を負う。"],"note":"","correct":4,"explanation":"④適切:未成年者の返還義務は現存利益の限度。①無効行為の追認は追認時から新たな行為、②成年被後見人は能力回復後に追認、③取消しは初めにさかのぼって無効。","topic":"民法","exps":["× 無効行為の追認は行為の時にさかのぼって有効にならない","× 成年被後見人本人の追認は、行為能力の回復後に限る(要確認)","× 取消しは初めにさかのぼって無効となる","○ 未成年者の返還義務は現存利益の限度"]},{"id":"R6-30","year":"令和6年度","qNum":30,"category":"貸付け・
