付随取引の法令実務","stem":"消滅時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債権は、債権者が権利を行使できることを知っているか否かにかかわらず、5年間行使しないときは、時効によって消滅する。","消滅時効は、当事者が主張しなくても、裁判所が職権でその成否を認定し裁判することができる。","強制執行がその申立ての取下げにより終了した場合は、進行中の消滅時効について、時効の完成猶予の効力を生じない。","債務者が、消滅時効が完成したことを知らずに債務の存在を承認した場合、時効は、その時から新たに進行を始める。"],"note":"","correct":4,"explanation":"④適切:債務の承認により時効は更新され、新たに進行する。①主観的起算点(知った時から5年)も要件、②時効は当事者の援用が必要、③取下げで終了した場合も終了時から6か月間は完成猶予される。","topic":"民法","exps":["× 5年は『知った時から』で、行使できる時から10年の要件もある","× 時効は当事者の援用が必要で、職権では認定できない","× 取下げで終了しても、終了時から6か月間は完成猶予される","○ 時効完成を知らない承認でも、時効は更新され新たに進行する"]},{"id":"R6-31","year":"令和6年度","qNum":31,"category":"貸付け・付随取引の法令実務","stem":"Ａは、Ｂとの間で金銭消費貸借契約（以下、本問において「本件契約」という。）を締結しＢに金銭を貸し付けた。本件契約では、元本10万円、利息年1割5分（15％）、元利一括返済方式とする旨の約定がなされており、遅延損害金に関する定めは存在しない。Ｂは、本件契約で定める返済期限が経過したにもかかわらず、借入金をＡに返済していない。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に約定利率年1割5分（15％）の割合を乗じた額の遅延損害金を請求することができる。","Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に約定利率年1割5分（15％）と法定利率年3分（3％）を合計した年1割8分（18％）の割合を乗じた額の遅延損害金を請求することができる。","Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に法定利率年3分（3％）の割合を乗じた額の遅延損害金しか請求することができない。","Ａは、Ｂが借入金の返済を遅延したことにより被った損害を証明しなければ、Ｂに対し、当該証明した額の遅延損害金を請求することができない。"],"note":"","correct":1,"explanation":"①適切:約定利率が法定利率を上回るときは、遅延損害金も約定利率による。","topic":"民法","exps":["○ 約定利率が法定利率を上回るときは約定利率による","× 約定利率と法定利率の合算ではない","× 法定利率のみとは限らず、約定利率が優先する","× 金銭債務の遅延損害金は損害の証明が不要"]},{"id":"R6-32","year":"令和6年度","qNum":32,"category":"貸付け・付随取引の法令実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["保証契約は、債権者と保証人となろうとする者との間において、保証契約を締結する旨の口頭の合意がなされることによって成立するが、連帯保証契約については、債権者と連帯保証人となろうとする者の間で、書面又は電磁的記録によって締結されなければ、その効力を生じない。","連帯保証において、主たる債務の目的又は態様が連帯保証契約の締結後に加重されたときは、連帯保証人の負担も加重される。","数人の保証人がある場合、各保証人は、別段の意思表示がある場合を除き、それぞれ平等の割合をもって分割された額についてのみ保証債務を負担するが、連帯保証人には、この分別の利益が認められず、各連帯保証人は、それぞれ全額について保証債務を負担する。","連帯保証において、債権者が、主たる債務者に債務の履行を請求することなく、連帯保証人に保証債務の履行を請求した場合、連帯保証人は、主たる債務者が破産手続開始の決定を受けたとき、又はその行方が知れないときを除いて、債権者に対し、まず主たる債務者に催告すべき旨を請求することができる。"],"note":"","correct":3,"explanation":"③適切:連帯保証人には分別の利益がなく全額を負担する。①保証契約は書面等が要件、②加重された負担は及ばない、④連帯保証人に催告の抗弁はない。","topic":"民法","exps":["× 保証契約は書面等によらなければ効力を生じない","× 主たる債務が加重されても保証人の負担は加重されない","○ 保証人には分別の利益があるが、連帯保証人にはない","× 連帯保証人には催告・検索の抗弁がない(要確認)"]},{"id":"R6-33","year":"令和6年度","qNum":33,"category":"貸付け・付随取引の法令実務","stem":"定型約款に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["定型取引とは、ある特定の者が不特定多数の者を相手方として行う取引であって、その内容の全部又は一部が画一的であることがその双方にとって合理的なものをいう。","定型取引を行い、又は行おうとする定型約款を準備した者（以下、本問において「定型約款準備者」という。）は、定型取引を行うことの合意（以下、本問において「定型取引合意」という。）をするまでに、相当な方法で相手方にその定型約款の内容を示さなければならない。","定型取引合意及び定型約款を契約の内容とする旨の合意をし、かつ、定型約款準備者があらかじめその定型約款を契約の内容とする旨を相手方に表示していた場合であっても、相手方が当該定型約款の個別の条項の一部について認識していなかったときは、当該条項については合意をしたものとはみなされない。","定型約款準備者は、定型約款を変更するには、その変更が相手方の一般の利益に適合するときを除き、変更内容について相手方と個別に合意しなければならない。"],"note":"","correct":1,"explanation":"①適切:定型取引の定義どおり。②合意前に示す義務ではなく、相手方の請求があれば示す形、④定型約款の変更は一般の利益に適合する等の要件で個別合意なしに可能。③は不適切(要確認)。","topic":"民法","exps":["○ 定型取引の定義どおり","× 定型約款の表示・提示に関する記述が異なる(要確認)","× 合意とみなされない場合の要件の記述が異なる(要確認)","× 相手方の一般の利益に適合する場合等は個別の合意なしに変更できる"]},{"id":"R6-34","year":"令和6年度","qNum":34,"category":"貸付け・付随取引の法令実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["被相続人の子が、相続の開始以前に死亡したとき、相続人の欠格事由に該当しもしくは廃除によって相続権を失ったとき、又は相続の放棄をしたときは、その者の子がこれを代襲して相続人となる。","被相続人の配偶者と被相続人の直系尊属が相続人となるときは、当該配偶者の法定相続分は、4分の3である。","相続人が数人あるときは、限定承認は、各共同相続人がその相続分に応じて個別にすることができる。","相続人のあることが明らかでないときは、相続財産は、法人とされる。"],"note":"","correct":4,"explanation":"④適切:相続人不明の相続財産は法人となる。①相続放棄者の子は代襲しない、②配偶者と直系尊属では配偶者は3分の2、③限定承認は共同相続人全員で行う。","topic":"民法","exps":["× 相続放棄をした者の子は代襲相続しない","× 配偶者と直系尊属では配偶者の法定相続分は3分の2","× 限定承認は共同相続人全員でしなければならない","○ 相続人不明のときは相続財産が法人となる"]},{"id":"R6-35","year":"令和6年度","qNum":35,"category":"貸付け・付随取引の法令実務","stem":"株式会社の取締役及び取締役会に関する次の①～④の記述のうち、会社法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における株式会社は、監査等委員会設置会社及び指名委員会等設置会社ではないものとする。","items":[],"choices":["取締役の任期は、選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり、定款又は株主総会の決議によって、その任期を短縮又は伸長することはできない。","代表取締役及び代表取締役以外の取締役であって取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定されたものは、3か月に1回以上、自己の職務の執行の状況を取締役会に報告しなければならない。","取締役会は、取締役会の決議により、多額の借財の決定を取締役に委任することができる。","株式会社の取締役がその職務を行うについて悪意又は重大な過失があり、これによって第三者に損害が生じた場合、当該株式会社が第三者に対して損害賠償責任を負い、当該取締役が第三者に対して損害賠償責任を負うことはない。"],"note":"","correct":2,"explanation":"②適切:業務執行取締役は3か月に1回以上、職務執行状況を報告する。①任期は定款で短縮・(非公開会社は)伸長可、③多額の借財は取締役会決議事項で委任不可、④取締役は429条で第三者に責任を負う。","topic":"会社法等その他","exps":["× 任期の短縮・伸長の方法の記述が異なる(要確認)","○ 業務執行取締役は3か月に1回以上、職務の執行状況を報告する","× 多額の借財の決定は取締役会の決議事項で、委任できない","× 悪意・重過失の取締役は、第三者に対し自ら賠償責任を負う"]},{"id":"R6-36","year":"令和6年度","qNum":36,"category":"貸付け・付随取引の法令実務","stem":"犯罪による収益の移転防止に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者が取引時確認をすることが求められる特定取引には、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）を内容とする契約の締結のほか、金銭の貸付けを内容とする契約に係る保証契約が含まれる。","貸金業者が、顧客等について取引時確認を行う場合において、会社の代表者が当該会社のために当該貸金業者との間で特定取引等を行うときは、当該貸金業者は、当該会社の当該取引時確認を行えば足り、当該代表者の本人特定事項の確認を行う必要はない。","貸金業者は、取引時確認を行った場合には、直ちに、主務省令で定める方法により、当該取引時確認に係る事項、当該取引時確認のためにとった措置その他の主務省令で定める事項に関する記録を作成し、当該記録を作成した日から7年間保存しなければならない。","貸金業者は、取引時確認、取引記録等の保存、疑わしい取引の届出等の措置を的確に行うため、特定事業者作成書面等(注)を作成し、必要に応じて、見直しを行い、必要な変更を加えるように努めなければならない。"],"note":"(注) 特定事業者作成書面等とは、特定事業者自らが行う取引について調査し、及び分\n析し、並びに当該取引による犯罪による収益の移転の危険性の程度その他の当該\n調査及び分析の結果を記載し、又は記録した書面又は電磁的記録をいう。","correct":4,"explanation":"④適切:特定事業者作成書面等の作成・見直しは努力義務。②代表者個人の本人特定事項の確認も必要。①③は条文と異なる記述で不適切(③の『直ちに』などは要確認)。","topic":"犯収法(取引時確認)","exps":["× 特定取引の範囲の記述が異なる(要確認)","× 会社のための取引時の確認事項の記述が異なる(要確認)","× 確認記録の作成時期の記述が異なる(要確認)","○ 特定事業者作成書面等を作成し、必要に応じて見直す"]},{"id":"R6-37","year":"令和6年度","qNum":37,"category":"貸付け・付随取引の法令実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["意思表示は、表意者がその真意でないことを知ってしたときは無効であるが、相手方がその意思表示が表意者の真意ではないことを知り又は知ることができたときは、表意者は、その無効を主張することができない。","相手方と通じてした虚偽の意思表示は無効であるが、この意思表示の無効は、善意の第三者に対抗することができない。","契約の解除の意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けたときであっても、そのためにその効力を妨げられない。","意思表示は、表意者が相手方を知ることができず、又はその所在を知ることができないときは、公示の方法によってすることができる。"],"note":"","correct":1,"explanation":"①が不適切:心裡留保は原則有効で、相手方が悪意または有過失のときに無効となる(本肢は原則と例外が逆)。","topic":"民法","exps":["× 心裡留保は原則有効で、相手方が悪意・有過失のときに無効(本肢は逆)","○ 通謀虚偽表示は無効だが、善意の第三者に対抗できない","○ 発信後に死亡等があっても効力は妨げられない","○ 相手方が不明・所在不明のときは公示の方法でできる"]},{"id":"R6-38","year":"令和6年度","qNum":38,"category":"貸付け・付随取引の法令実務","stem":"代理に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["代理人が本人のためにすることを示さないでした意思表示は、相手方が、代理人が本人のためにすることを知り、又は知ることができたとしても、本人が追認をしなければ、本人に対してその効力を生じない。","委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。","法定代理人は、自己の責任で復代理人を選任することができる。この場合において、やむを得ない事由があるときは、本人に対してその選任及び監督についての責任のみを負う。","第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。ただし、第三者が、その他人が代理権を与えられていないことを知り、又は過失によって知らなかったときは、この限りでない。"],"note":"","correct":1,"explanation":"①が不適切:顕名がなくても、相手方が代理人であることを知り又は知り得たときは本人に効力が生じる。","topic":"民法","exps":["× 顕名がなくても、相手方が知り又は知り得たときは本人に効力が生じる","○ 委任による代理人は、許諾ややむを得ない事由があれば復代理人を選任できる","○ 法定代理人は自己の責任で復代理人を選任できる","○ 代理権授与の表示による表見代理(善意無過失の第三者に対し責任)"]},{"id":"R6-39","year":"令和6年度","qNum":39,"category":"貸付け・付随取引の法令実務","stem":"Ａは、Ｂとの間で、11月1日に、借入金の返済期限を翌年11月1日と定めて金銭消費貸借契約（以下、本問において「本件契約」という。）を締結しＢに金銭を貸し付けた。本件契約では、契約締結日の翌月以降毎月1日に発生済みの利息を支払う約定がなされている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、本件契約に基づきＢがＡに対して負担する一切の債務を被担保債権として、Ｂとの間で、Ｂが所有する甲建物に抵当権の設定を受けた。この場合において、Ｂが甲建物を滅失させたときは、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","Ｂは、返済期限が到来する前に、破産手続開始の決定を受けた。この場合、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","Ｂは、毎月の利息の支払を1回遅滞した。この場合、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","Ｂは、返済期限到来前であっても、期限の利益を放棄し、借入金及び利息をＡに弁済することができる。"],"note":"","correct":3,"explanation":"③が不適切:利息の1回の遅滞だけでは当然に期限の利益を失わない(特約があれば別)。①担保の滅失、②破産手続開始は期限の利益喪失事由。","topic":"民法","exps":["○ 担保を滅失・損傷・減少させたときは期限の利益を失う","○ 破産手続開始の決定を受けると期限の利益を失う","× 利息の1回の遅滞だけでは当然には期限の利益を失わない(特約が必要)","○ 債務者は期限の利益を放棄できる"]},{"id":"R6-40","year":"令和6年度","qNum":40,"category":"貸付け・付随取引の法令実務","stem":"Ａは、Ｂに対して有する貸金返還請求権を被担保債権として、Ｂが所有する甲建物に抵当権の設定を受けその登記を経た。この場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ｂが、月額賃料を10万円として甲建物を第三者Ｃに賃貸している場合において、返済期限を過ぎても借入金をＡに返済しないときは、Ａは、物上代位に基づいて、ＣがＢに対して賃料を払い渡す前にＢがＣに対して有する賃料請求権を差し押さえ、当該賃料から貸金を回収することができる。","Ａが貸金返還請求権を第三者Ｄに譲渡した場合であっても、ＡとＢとの間の抵当権設定契約において、被担保債権の移転に伴い抵当権も移転する旨の特約がない限り、Ｄに抵当権は移転しない。","貸金返還請求権についての保証人であるＥは、Ｂとの間で締結した売買契約に基づき甲建物を譲り受けた。この場合、Ｅは、Ａに対して、民法第383条（抵当権消滅請求の手続）に基づき抵当権消滅請求をすることはできない。","抵当権が実行された場合において、Ａは、満期の到来した3年分の利息及び1年分の遅延損害金を請求する権利を有していた。Ａのほかに後順位抵当権者がいる場合、Ａは、元本のほか、利息及び遅延損害金を通算して2年分についてのみその抵当権を行使することができる。"],"note":"","correct":2,"explanation":"②が不適切:抵当権は被担保債権に随伴して移転する(特約は不要)。","topic":"民法","exps":["○ 賃料債権への物上代位が可能","× 抵当権は被担保債権に随伴して移転する(特約は不要)","○ 保証人は抵当権消滅請求ができない","○ 後順位抵当権者がいる場合、利息・遅延損害金は最後の2年分に限る"]},{"id":"R6-41","year":"令和6年度","qNum":41,"category":"貸付け・付随取引の法令実務","stem":"金銭消費貸借契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["金銭消費貸借契約は、借主が借り受けた金銭と同額の金銭を返還することを約し、貸主から金銭を受け取ることによって成立するが、書面による金銭消費貸借契約は、貸主が金銭を引き渡すことを約し、借主がその受け取った金銭と同額の金銭をもって返還をすることを約することにより成立する。","金銭消費貸借契約において当事者が利息に関する特約を定めなかった場合であっても、貸主は、借主に対して法定利息を請求することができる。","金銭消費貸借契約において当事者が借入金の返還の時期を定めなかったときは、貸主は、相当の期間を定めてその返還の催告をすることができる。","借主は、弁済期までに借入金を返還しなかった場合、履行遅滞が不可抗力によるものであったとしても、弁済期が到来した時から遅滞の責任を負う。"],"note":"","correct":2,"explanation":"②が不適切:利息の特約がなければ、貸主は利息を請求できない(無利息)。","topic":"民法","exps":["○ 書面による消費貸借は金銭の交付前でも成立する","× 利息の特約がなければ、法定利息は請求できない(無利息)","○ 返還時期の定めがなければ、相当の期間を定めて催告できる","○ 金銭債務は不可抗力でも遅滞の責任を負う"]},{"id":"R6-42","year":"令和6年度","qNum":42,"category":"貸付け・付随取引の法令実務","stem":"民事執行法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["強制執行は、原則として、執行文の付された債務名義の正本に基づいて実施される。ただし、少額訴訟における確定判決又は仮執行の宣言を付した少額訴訟の判決もしくは支払督促により、これに表示された当事者に対し、又はその者のためにする強制執行は、その正本に基づいて実施される。","金銭の支払又は船舶もしくは動産の引渡しを目的とする債権（動産執行の目的となる有価証券が発行されている債権を除く。以下、本問において「債権」という。）に対する強制執行（民事執行法第167条の2第2項に規定する少額訴訟債権執行を除く。以下、本問において「債権執行」という。）は、執行裁判所の差押命令により開始される。","債権執行における差押命令は、債務者及び第三債務者に送達され、その効力は、差押命令が債務者に送達された時に生じる。","給与に係る債権については、その支払期に受けるべき給付の4分の3に相当する部分（その額が標準的な世帯の必要生計費を勘案して政令で定める額を超えるときは、政令で定める額に相当する部分）は、差し押さえてはならない。"],"note":"","correct":3,"explanation":"③が不適切:債権差押命令の効力は、第三債務者に送達された時に生じる。","topic":"民事訴訟・執行","exps":["○ 執行文付きの債務名義の正本が原則(少額訴訟等は不要)","○ 債権執行の記述として適切","× 差押命令の効力は、第三債務者に送達された時に生じる","○ 給与は支払期に受けるべき給付の4分の3が差押禁止"]},{"id":"R6-43","year":"令和6年度","qNum":43,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["個人情報取扱事業者は、個人情報を取得した場合は、取得の状況からみて利用目的が明らかであると認められる場合であっても、速やかに、その利用目的を、本人に通知し、又は公表しなければならない。","個人情報取扱事業者は、合併その他の事由により他の個人情報取扱事業者から事業を承継することに伴って個人情報を取得した場合は、その事業を承継した個人情報取扱事業者が公表している個人情報の利用目的の達成に必要な範囲内であれば、承継前における当該個人情報の利用目的の達成に必要な範囲を超えて、当該個人情報を取り扱うことができる。","個人情報取扱事業者は、利用目的を変更する場合において、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて利用目的の変更を行うときは、あらかじめその利用目的を、本人に通知し、又は公表しなければならない。","個人情報取扱事業者（その者が法人（法人でない団体で代表者又は管理人の定めのあるものを含む。）である場合にあっては、その役員、代表者又は管理人）もしくはその従業者又はこれらであった者が、その業務に関して取り扱った個人情報データベース等を自己もしくは第三者の不正な利益を図る目的で提供し、又は盗用する行為は、刑事罰の対象となる。"],"note":"","correct":4,"explanation":"④適切:個人情報データベース等の不正提供・盗用は処罰対象。①取得状況から利用目的が明らかな場合は通知・公表不要、②承継前の利用目的の範囲内、③関連性の範囲を超える変更は本人の同意が必要。","topic":"個人情報保護","exps":["× 利用目的が明らかな場合は通知・公表が不要","× 事業承継時の利用目的の取扱いに関する記述が異なる(要確認)","× 利用目的の変更に関する記述が異なる(要確認)","○ 個人情報データベース等の不正提供・盗用は処罰対象"]},{"id":"R6-44","year":"令和6年度","qNum":44,"category":"資金需要者等の保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["消費者契約法の適用がある取引については、消費者には、契約の申込み又は契約の締結後一定の期間内であれば、無条件に当該契約の申込みを撤回し又は当該契約を解除することができる権利（クーリング・オフを行使する権利）が認められている。","事業者に対し、消費者が後見開始、保佐開始又は補助開始の審判を受けたことのみを理由とする解除権を付与する消費者契約（消費者が事業者に対し物品、権利、役務その他の消費者契約の目的となるものを提供することとされているものを除く。）の条項は、無効である。","事業者が消費者契約の締結について勧誘をするに際し、当該消費者に対して重要事項について事実と異なることを告げる行為をしたことにより、当該消費者が当該告げられた内容が事実であるとの誤認をし、それによって消費者契約が締結された場合、当該消費者契約は無効である。","消費者契約の条項のうち、当該消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超える条項は、無効である。"],"note":"","correct":2,"explanation":"②適切:成年後見等の審判のみを理由とする解除権の条項は無効。①クーリング・オフはない、③誤認による申込みは取り消せる(無効ではない)、④平均的な損害を超える部分が無効。","topic":"消費者契約法","exps":["× 無条件の撤回・解除(クーリング・オフ)の定めはない","○ 後見等の審判のみを理由とする解除権の条項は無効","× 誤認による取消しの記述が異なる(要確認)","× 平均的な損害を超える部分が無効"]},{"id":"R6-45","year":"令和6年度","qNum":45,"category":"資金需要者等の保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業相談・紛争解決センターに対して苦情処理手続開始の申立てをすることができるのは、協会員等との間で貸金業務等関連苦情を有する契約者等である個人に限られている。","当事者である協会員等は、苦情処理手続が開始された事案について当事者間で直接交渉を行った場合には、苦情受付課に対して、交渉の日時、場所及び手法、交渉の内容等を報告しなければならない。","紛争解決手続は公開とする。ただし、紛争解決委員は、非公開とすべき相当な理由があるときは、傍聴を禁止することができる。","当事者である協会員等は、紛争解決委員から、特別調停案の提示を受けたときには、当事者である契約者等が当該特別調停案を受諾しないときを除き、これを必ず受諾しなければならない。"],"note":"","correct":2,"explanation":"②適切:直接交渉を行った場合は、日時・内容等を報告する。①申立人は個人に限られない(法人等も可)、③紛争解決手続は非公開、④特別調停案の受諾義務は無条件ではない(④は要確認)。","topic":"協会自主規制・紛争解決","exps":["× 申立てができるのは個人に限らず、法人等も含まれる","○ 直接交渉を行った場合は、日時・内容等を報告する","× 紛争解決手続は非公開","× 特別調停案の受諾義務の記述が異なる(要確認)"]},{"id":"R6-46","year":"令和6年度","qNum":46,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律第26条（漏えい等の報告等）についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["個人情報取扱事業者は、不正に利用されることにより財産的被害が生じるおそれがある個人データの漏えい等が発生し、又は発生したおそれがある事態が生じた場合であっても、当該事態が生じた個人データに係る本人の数が1,000人を超えないときは、当該事態が生じた旨を個人情報保護委員会に報告する必要はない。","個人情報取扱事業者は、個人データに係る本人の数が1,000人を超える漏えい等が発生し、又は発生したおそれがある事態が生じた場合であっても、高度な暗号化その他の個人の権利利益を保護するために必要な措置がなされていれば、当該事態が生じた旨を個人情報保護委員会に報告する必要はない。","個人情報取扱事業者（他の個人情報取扱事業者又は行政機関等から個人データの取扱いの全部又は一部の委託を受けた者ではないものとする。）は、報告対象事態(注)が生じた場合、本人に対し、当該事態が生じた旨を通知しなければならない。ただし、本人への通知が困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。","個人情報取扱事業者は、報告対象事態が生じた旨を個人情報保護委員会に報告する場合には、概要、原因、二次被害又はそのおそれの有無及びその内容、本人への対応の実施状況、再発防止のための措置等について報告をしようとする時点において把握しているものを、当該事態を知った後、速やかに、報告しなければならない。"],"note":"(注) 報告対象事態とは、個人情報取扱事業者の取り扱う個人データの漏えい、滅失、\n毀損その他の個人データの安全の確保に係る事態であって個人の権利利益を害す\nるおそれが大きいものとして個人情報保護委員会規則で定めるものをいう。","correct":1,"explanation":"①が不適切:財産的被害が生じるおそれのある漏えい等は、人数に関わらず個人情報保護委員会への報告対象(1,000人超は別類型)。","topic":"個人情報保護","exps":["× 財産的被害が生じるおそれのある漏えい等は、人数にかかわらず報告対象","○ 高度な暗号化等の措置が講じられていれば報告対象外","○ 報告対象事態には速報と確報が必要","○ 報告事項の記述どおり"]},{"id":"R6-47","year":"令和6年度","qNum":47,"category":"資金需要者等の保護","stem":"日本貸金業協会（以下、本問において「協会」という。）が定める貸付自粛対応に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["自粛対象者の配偶者又は二親等内の親族は、自粛対象者が所在不明者であり、その原因が金銭の貸付けによる金銭債務の負担を原因としている可能性があること、貸付自粛の対応をとることが自粛対象者の生命、身体又は財産の保護のために必要であること、及び申告を行うことにつき自粛対象者の同意を得ることが困難と認められることのすべてに該当する場合には、自粛対象者の意思に反することが明らかなときを除き、貸付自粛の申告をすることができる。","自粛対象者の配偶者又は二親等内の親族が貸付自粛の申告をした場合には、自粛対象者は、いつでも当該申告を取り消すことができる。","貸付自粛情報が登録された場合、当該貸付自粛の申告をした者又は自粛対象者が、協会に対し、当該貸付自粛の申告の撤回又は取消しをしない限り、当該情報は抹消されない。","協会員（個人信用情報機関と個人信用情報の提供を受けることに関し契約を締結している者に限る。）は、個人信用情報の提供を受けることにつき契約を締結している個人信用情報機関から貸付自粛情報の提供を受けたときには、当該貸付自粛情報に係る自粛対象者との間で新たな貸付けに係る契約の締結をせず又は当該自粛対象者との間で締結済みの極度方式基本契約の極度額を零円としもしくは極度方式基本契約に基づく新たな貸付けを停止する措置をとるなど、以後、新規に金銭の貸付けがなされないこととなるために必要な措置をとるよう努めなければならない。"],"note":"","correct":3,"explanation":"③が不適切:貸付自粛情報は、取消し・撤回がなくても一定期間経過で抹消される。","topic":"協会自主規制・紛争解決","exps":["○ 親族による貸付自粛の申告に関する記述","○ 自粛対象者はいつでも申告を取り消せる","× 撤回・取消しがなくても、一定期間の経過で抹消される","○ 協会員の個人信用情報の提供に関する記述"]},{"id":"R6-48","year":"令和6年度","qNum":48,"category":"財務及び会計","stem":"次の表は、Ａ株式会社の令和5年度の損益計算書の一部を抜粋したものである。次の①～④の記述のうち、この表に基づき計算したＡ株式会社の経常利益金額として適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、計算するにあたって、この表に記載されていない損益計算書上の費目については、考慮しないものとする。損益計算書\n売上高2,000百万円\n売上原価1,000百万円\n販売費及び一般管理費400百万円\n営業外収益80百万円\n営業外費用100百万円\n特別利益40百万円\n特別損失60百万円","items":[],"choices":["1,000百万円","600百万円","580百万円","500百万円"],"note":"","correct":3,"explanation":"経常利益=売上総利益−販売費及び一般管理費+営業外収益−営業外費用(特別損益は含まない)。表の数値から計算して580百万円。","topic":"財務・会計","exps":["× 計算結果と一致しない","× 計算結果と一致しない","○ 表の数値から計算した経常利益は580百万円","× 計算結果と一致しない"]},{"id":"R6-49","year":"令和6年度","qNum":49,"category":"財務及び会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定するキャッシュ・フロー計算書に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["長期借入れによる収入、長期借入金の返済による支出は、営業活動によるキャッシュ・フローの区分に掲記される。","損益計算書に収益又は費用として計上されている項目のうち資金の増加又は減少を伴わない項目は、営業活動によるキャッシュ・フローの区分に掲記される。","社債の償還による支出、株式の発行による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","貸付けによる支出、貸付金の回収による収入は、財務活動によるキャッシュ・フローの区分に掲記される。"],"note":"","correct":2,"explanation":"②適切:資金の増減を伴わない損益項目は、営業活動によるCFの調整項目に掲記される。①長期借入・返済、③社債・株式の発行/償還は財務CF、④貸付け・回収は投資CF。","topic":"財務・会計","exps":["× 長期借入れ・返済は財務活動によるCF","○ 資金の増減を伴わない損益項目は営業活動によるCFの調整項目","× 社債の償還・株式の発行は財務活動によるCF","× 貸付け・回収は投資活動によるCF"]},{"id":"R6-50","year":"令和6年度","qNum":50,"category":"財務及び会計","stem":"会社計算規則に規定する貸借対照表等(注)に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["資産の部は、流動資産、固定資産及び投資その他の資産の項目に区分しなければならない。","現金及び預金（1年以内に期限の到来しない預金を除く。）は、流動資産に属するものとする。","社債は、固定負債に属するものとする。","純資産の部は、株式会社の貸借対照表にあっては、株主資本、評価・換算差額等、株式引受権及び新株予約権の項目に区分しなければならない。"],"note":"(注) 貸借対照表等とは、貸借対照表及び連結貸借対照表をいう。","correct":1,"explanation":"①が不適切:資産の部は流動資産・固定資産・繰延資産に区分する(固定資産の内訳に投資その他の資産)。","topic":"財務・会計","exps":["× 資産の部は流動資産・固定資産・繰延資産に区分(投資その他の資産は固定資産の内訳)","○ 現金及び預金(1年以内に期限が来ないものを除く)は流動資産","○ 社債は固定負債","○ 純資産の部の区分の記述どおり"]},{"id":"R7-01","year":"令和7年度","qNum":1,"category":"法及び関係法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業には、物品の運送を業とする者がその取引に付随して行う金銭の貸付けは含まれない。"},{"label":"b","text":"債務者等には、債務者又は債務者であった者は含まれるが、保証人及び代位弁済者は含まれない。"},{"label":"c","text":"貸付けの契約には、金銭の貸付けに係る契約又は金銭の貸借の媒介の契約は含まれるが、これらの契約に係る保証契約は含まれない。"},{"label":"d","text":"住宅資金貸付契約には、住宅の建設又は購入に必要な資金の貸付けに係る契約は含まれるが、住宅の改良に必要な資金の貸付けに係る契約は含まれない。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":1,"explanation":"a適切(運送業者の取引付随の貸付けは貸金業に含まれない)。b不適切:債務者等には保証人・代位弁済者も含む。c不適切:貸付けの契約は保証契約も含む。d不適切:住宅資金貸付契約は住宅の改良資金も含む。適切はaのみで1個。","topic":"貸金業法その他","exps":["○ 運送業者などが取引に付随して行う貸付けは貸金業に含まれない","× 債務者等には保証人・代位弁済者も含まれる","× 貸付けの契約には保証契約も含まれる","× 住宅資金貸付契約には住宅の改良資金も含まれる"]},{"id":"R7-02","year":"令和7年度","qNum":2,"category":"法及び関係法令","stem":"貸金業の登録に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業の登録は、2年ごとにその更新を受けなければ、その期間の経過によって、その効力を失う。"},{"label":"b","text":"貸金業者は、貸金業の登録の更新を受けようとするときは、その者が現に受けている登録の有効期間満了の日の2か月前までに当該登録の更新を申請しなければならない。"},{"label":"c","text":"都道府県知事の登録を受けている者が、他の都道府県に営業所を設置する場合は、その登録換えの申請をした時から、当該営業所で貸金業を営むことができる。"},{"label":"d","text":"登録換えの申請をしようとする貸金業者は、その者が現に受けている登録をした財務局長もしくは福岡財務支局長又は都道府県知事を経由して登録の申請をしなければならない。"}],"choices":["a ・ c","a ・ d","b ・ c","b ・ d"],"note":"","correct":4,"explanation":"a不適切:更新は3年ごと。b適切:満了の2か月前までに申請。c不適切:登録換えは申請時でなく登録を受けた時から営業可。d適切:現登録行政庁を経由して申請。","topic":"登録・届出・監督処分","exps":["× 更新は3年ごと","○ 満了日の2か月前までに更新を申請する","× 登録換えは申請時ではなく、登録を受けた時から営業できる","○ 現在の登録行政庁を経由して申請する"]},{"id":"R7-03","year":"令和7年度","qNum":3,"category":"法及び関係法令","stem":"株式会社であるＡが貸金業の登録の申請をした。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"Ａの取締役の中に、精神の機能の障害のため貸金業に係る職務を適正に執行するに当たって必要な認知、判断及び意思疎通を適切に行うことができない者がいる場合、貸金業法第6条（登録の拒否）第1項に規定する登録の拒否事由（以下、本問において「登録拒否事由」という。）に該当する。"},{"label":"b","text":"Ａの取締役の中に、道路交通法の規定に違反し、罰金の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者がいる場合、登録拒否事由に該当する。"},{"label":"c","text":"Ａの政令で定める使用人の中に、破産手続開始の決定を受けて復権をした日から5年を経過しない者がいる場合、登録拒否事由に該当する。"},{"label":"d","text":"Ａの政令で定める使用人の中に、貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消された株式会社であるＢにおいて、当該取消しの日にＢの取締役であった者で、当該取消しの日から5年を経過しないものがいる場合、登録拒否事由に該当する。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":2,"explanation":"a適切(認知・判断・意思疎通が適切にできない者は拒否事由)。b不適切:道路交通法違反の罰金は対象外。c不適切:復権を得た者は拒否事由に当たらない。d適切:取消し日に取締役だった者は5年間対象で、使用人も含まれる。","topic":"登録・届出・監督処分","exps":["○ 認知・判断・意思疎通を適切にできない者は拒否事由","× 道路交通法違反の罰金は対象外","× 復権を得た者は拒否事由に当たらない","○ 取消し日に取締役だった者は5年間拒否事由(使用人でも同様)"]},{"id":"R7-04","year":"令和7年度","qNum":4,"category":"法及び関係法令","stem":"貸金業法第8条（変更の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、他に行っている事業の種類を変更した場合、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。"},{"label":"b","text":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所の電子メールアドレスを変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},{"label":"c","text":"貸金業者は、その業務の種類及び方法を変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},{"label":"d","text":"貸金業者は、その営業所又は事務所の名称及び所在地を変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":2,"explanation":"a・cが適切:他の事業の種類の変更と業務の種類・方法の変更は変更後2週間以内の届出。d不適切:営業所の名称・所在地の変更は『あらかじめ』の届出。b不適切:広告用の電子メールアドレスの変更は事前の届出(2週間以内の事後届出ではない)。","topic":"登録・届出・監督処分","exps":["○ 他の事業の種類の変更は変更後2週間以内に届出","× 広告用メールアドレスの変更は事前の届出(要確認)","○ 業務の種類・方法の変更は変更後2週間以内に届出","× 営業所の名称・所在地の変更は事前の届出(要確認)"]},{"id":"R7-05","year":"令和7年度","qNum":5,"category":"法及び関係法令","stem":"貸金業者向けの総合的な監督指針において、経営管理等に関し、監督当局による貸金業者の監督に当たっての主な着眼点とされている事項等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"経営陣は、貸金業務に関する内部監査部門による内部監査（以下、本問において「内部監査」という。）の重要性を認識し、内部監査部門の機能が十分に発揮できる態勢を構築するために、営業部門の指揮命令系統の下に内部監査部門を設置し、その業務を監視するなど実効性のある内部監査が実施できる態勢となっているか。"},{"label":"b","text":"内部監査部門において、業務運営全般に関し、法令及び社内規則等に則った適正な業務を遂行するための適切なモニタリング・検証が行われ、その結果に基づき内部監査部門の主導により事業計画を作成する態勢を構築しているか。"},{"label":"c","text":"貸金業者の規模等を踏まえ、内部監査に代えて外部監査を利用する場合においては、外部監査人に対して、監査目的を明確に指示し、監査結果を業務改善に活用するための態勢を整備しているか。"},{"label":"d","text":"他に貸金業の業務に従事する者がいない個人の貸金業者が内部監査に代わる措置として自己の行う貸金業に関する業務の検証を行う場合には、自己検証を実施するに際し、別添自己検証リストに基づき自社の社内規則等を参考に自己検証項目を設定しているか等の点を踏まえ、業務の適切性を確保するために十分な態勢を整備しているか。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":4,"explanation":"a不適切:内部監査部門は営業部門から独立させる必要がある。b不適切:事業計画は内部監査部門の主導で作るものではない。c・dは監督指針に沿った適切な内容。","topic":"登録・届出・監督処分","exps":["× 内部監査部門は営業部門から独立させる","× 事業計画を内部監査部門の主導で作るものではない","○ 外部監査を使う場合も目的を明確に指示し、結果を活用する","○ 個人事業者は自己検証で足りる"]},{"id":"R7-06","year":"令和7年度","qNum":6,"category":"法及び関係法令","stem":"貸金業務取扱主任者制度に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における営業所等は、自動契約受付機もしくは現金自動設備のみにより貸付けに関する業務を行う営業所等又は代理店（当該代理店が貸金業者である場合に限る。）ではないものとする。","items":[{"label":"a","text":"貸金業者は、営業所等ごとに、営業所等において貸金業の業務に従事する者の数に対する貸金業務取扱主任者の数の割合が50分の1以上となる数の貸金業務取扱主任者を置かなければならない。"},{"label":"b","text":"貸金業者が営業所等に貸金業務取扱主任者を置くときは、当該貸金業務取扱主任者は、当該営業所等において常時勤務する者でなければならず、かつ、他の営業所等の貸金業務取扱主任者として貸金業者登録簿に登録されている者であって貸金業法第8条（変更の届出）第1項の規定による届出がないものであってはならない。"},{"label":"c","text":"貸金業者が貸付けに係る契約（極度方式基本契約を除く。）を締結した場合にその相手方に交付すべき貸金業法第17条第1項に規定する契約締結時の書面には、その営業所等に置かれる貸金業務取扱主任者の氏名及び登録番号を記載しなければならない。"},{"label":"d","text":"貸金業者は、予見し難い事由により、営業所等における貸金業務取扱主任者の数が貸金業法第12条の3（貸金業務取扱主任者の設置）第1項の内閣府令で定める数を下回るに至ったときは、30日以内に、同項の規定に適合させるために必要な措置をとらなければならない。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":1,"explanation":"a適切:50分の1以上。b適切:常勤かつ他の営業所との重複登録不可。c不適切:契約締結時書面に主任者の氏名・登録番号の記載は不要。d不適切:欠員の補充は2週間以内。","topic":"主任者・社内体制","exps":["○ 従業者50人につき主任者1人以上","○ 常勤で、他の営業所と重複登録できない","× 契約締結時書面に主任者の氏名・登録番号の記載は不要","× 欠員の補充は2週間以内"]},{"id":"R7-07","year":"令和7年度","qNum":7,"category":"法及び関係法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、個人である顧客Ｂとの間で金銭の貸借の媒介の契約を締結しようとする場合には、Ｂの収入又は収益その他の資力、信用、借入れの状況、返済計画その他の返済能力に関する事項の調査（以下、本問において、「返済能力の調査」という。）を行うことを要しない。","Ａは、法人である顧客Ｂとの間で極度方式貸付けに係る契約を締結しようとする場合には、Ｂの返済能力の調査を行うことを要しない。","Ａは、個人事業者である顧客Ｂとの間で、貸付けの契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用することを要しない。","Ａは、個人である顧客Ｂと手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用することを要しない。"],"note":"","correct":4,"explanation":"公式正答は④。この問の詳細な解説は未作成です。","topic":"返済能力調査・過剰貸付け","exps":["× 媒介の契約でも返済能力の調査は必要(要確認)","× 法人への極度方式貸付けも調査が必要(要確認)","× 個人事業者は個人なので信用情報の使用が必要","○ 融通手形以外の手形割引は信用情報の使用義務の例外"]},{"id":"R7-08","year":"令和7年度","qNum":8,"category":"法及び関係法令","stem":"Ａは株式会社である貸金業者であり、Ｂは個人である顧客等である。貸金業法施行規則第10条の17（資力を明らかにする事項を記載した書面等）第1項に規定する書面等（以下、本問において「年収証明書」という。）の提出又は提供等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、貸金業法施行規則第10条の16（指定信用情報機関が保有する信用情報の使用義務の例外）に規定する貸付けの契約ではないものとする。","items":[],"choices":["Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約について保証契約を締結しようとする場合、Ｂから年収証明書の提出又は提供を受けなければならない。","Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約を締結しようとする場合において、その1年前にＢとの間で貸付けの金額が80万円の貸付けに係る契約を締結するに当たりＢから年収証明書として源泉徴収票の提出を受けていたときには、改めて、Ｂから年収証明書の提出又は提供を受ける必要はない。","Ａは、Ｂとの間で、貸付けに係る契約を締結するにあたり、Ｂから年収証明書として給与の支払明細書の提出又は提供を受ける場合には、当該給与の支払明細書に記載されている地方税額を基に合理的に算出する方法により直近の年間の給与の金額を算出するときを除き、直近2か月分以上のものの提出又は提供を受けなければならない。","Ｂから提出又は提供を受ける年収証明書は、所得税法、地方税法等の法令を根拠として交付されたものに限られ、根拠法令なく、行政サービスの一環として、地方公共団体が交付する所得・課税証明書は年収証明書に該当しない。"],"note":"","correct":3,"explanation":"公式正答は③。この問の詳細な解説は未作成です。","topic":"返済能力調査・過剰貸付け","exps":["× 保証契約でも年収証明書が必要となる場合の要件が異なる(要確認)","× 前回の年収証明書を使える条件を満たさない(要確認)","○ 給与明細は直近2か月分以上(地方税額から算出する場合を除く)","× 行政サービスとして交付される所得・課税証明書も年収証明書に該当"]},{"id":"R7-09","year":"令和7年度","qNum":9,"category":"法及び関係法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で極度方式基本契約を締結している場合において、貸金業法第13条の3（基準額超過極度方式基本契約に係る調査）第2項に基づく、3か月以内の期間（以下、本問において「所定の期間」という。）ごとに、指定信用情報機関が保有するＢに係る信用情報を使用して、当該極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）を行う場合等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で、当該極度方式基本契約及び当該契約に基づく極度方式貸付けに係る契約のほかに、貸付けに係る契約を締結していないものとする。","items":[{"label":"a","text":"Ａは、所定の期間の末日におけるＢの当該極度方式基本契約に基づく極度方式貸付けの残高の合計額が10万円以下である場合、本件調査をする必要がない。"},{"label":"b","text":"Ａは、本件調査をしなければならない場合において、当該極度方式基本契約の極度額が50万円を超えるときは、Ｂから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。"},{"label":"c","text":"Ａは、本件調査により、当該極度方式基本契約が基準額超過極度方式基本契約に該当すると認められるときは、当該極度方式基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な当該極度方式基本契約の極度額の減額の措置又は当該極度方式基本契約に基づく新たな極度方式貸付けの停止の措置を講じなければならない。"},{"label":"d","text":"Ａは、当該極度方式基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な当該極度方式基本契約の極度額の減額の措置を講じた場合には、それ以後は所定の期間ごとに本件調査を行う必要はない。"}],"choices":["a ・ b","a ・ c","b ・ d","c ・ d"],"note":"","correct":2,"explanation":"a適切:所定期間末日の残高が10万円以下なら調査不要。c適切:減額または新規貸付け停止の措置が必要。b・dは不適切(減額後も所定の期間ごとの調査は継続)。","topic":"返済能力調査・過剰貸付け","exps":["○ 残高が10万円以下なら調査不要","× 年収証明書が必要となる要件の記述が異なる(要確認)","○ 該当すれば減額または新規貸付け停止の措置を講じる","× 減額後も所定の期間ごとの調査は続ける"]},{"id":"R7-10","year":"令和7年度","qNum":10,"category":"法及び関係法令","stem":"貸金業法第14条（貸付条件等の掲示等）及び同法第23条（標識の掲示等）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、営業所又は事務所（以下、本問において「営業所等」という。）ごとに、公衆の見やすい場所に、貸金業法第14条第1項各号に掲げる事項（以下、本問において「貸付条件等」という。）を掲示しなければならない。","貸金業者が内閣府令で定めるところにより、営業所等ごとに掲示しなければならない貸付条件等には、金銭の貸付けにあっては、主な返済の例が含まれる。","貸金業者は、その事業の規模にかかわらず、商号もしくは名称又は氏名、登録番号、登録有効期間等を当該貸金業者のウェブサイトに掲載する方法により公衆の閲覧に供しなければならない。","貸金業者は、営業所等ごとに、公衆の見やすい場所に、内閣府令で定める様式の標識を掲示しなければならないが、当該営業所等が、現金自動設備であるときは、掲示することを要しない。"],"note":"","correct":2,"explanation":"公式正答は②。この問の詳細な解説は未作成です。","topic":"広告・勧誘・禁止行為","exps":["× 14条の掲示事項・方法の記述が異なる(要確認)","○ 貸付条件等に主な返済の例が含まれる","× ウェブサイト掲載の義務の範囲は事業規模等で異なる(要確認)","× 現金自動設備に関する標識掲示の記述が異なる(要確認)"]},{"id":"R7-11","year":"令和7年度","qNum":11,"category":"法及び関係法令","stem":"次のａ～ｄの記述のうち、貸金業者が金銭の貸付けの条件について広告をするとき、又は金銭の貸付けの契約の締結について勧誘をする場合において貸付けの条件を表示し、もしくは説明するときに、貸金業法第15条（貸付条件の広告等）の定めにより、表示し、又は説明しなければならない事項に該当するものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における金銭の貸付けには、手形の割引及び売渡担保は含まれないものとする。","items":[{"label":"a","text":"返済の方式並びに返済期間及び返済回数"},{"label":"b","text":"貸付けの利率"},{"label":"c","text":"賠償額の予定（違約金を含む。）に関する定めをする場合における当該賠償額の元本に対する割合"},{"label":"d","text":"担保を供することが必要な場合における当該担保に関する事項"}],"choices":["1個","2個","3個","4個"],"note":"","correct":4,"explanation":"貸付条件の広告・勧誘時の表示事項は、a返済方式・返済期間・回数、b利率、c賠償額予定、d担保事項のすべてが該当。4個。","topic":"広告・勧誘・禁止行為","exps":["○ 返済方式・返済期間・回数は表示事項","○ 貸付けの利率は表示事項","○ 賠償額予定の割合は表示事項","○ 担保に関する事項は表示事項"]},{"id":"R7-12","year":"令和7年度","qNum":12,"category":"法及び関係法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"貸金業者は、極度方式基本契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第2項に規定する当該契約の内容を説明する書面を当該契約の相手方となろうとする者に交付しなければならない。"},{"label":"b","text":"貸金業者は、極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する当該契約の内容を説明する書面を当該契約の相手方となろうとする者に交付しなければならない。"},{"label":"c","text":"貸金業者は、貸付けに係る契約について保証契約を締結しようとする場合には、当該保証契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第3項に規定する当該保証契約の内容を説明する書面を当該貸付けに係る契約の相手方及び当該保証契約の保証人となろうとする者に交付しなければならない。"},{"label":"d","text":"貸金業者向けの総合的な監督指針によれば、貸金業法第16条の2の契約締結前の書面交付後、契約締結前に法令で定められた記載事項の内容に変更が生じた場合については、法令上、再度、当該契約の相手方となろうとする者に対し契約締結前の書面を交付する義務がないことに留意する必要があるとされている。"}],"choices":["1個","2個","3個","4個"],"note":"","correct":1,"explanation":"a適切。b不適切:極度方式貸付けは基本契約の書面が前提で、個別の貸付けでの交付は不要。c不適切:保証契約の書面の相手方は保証人となろうとする者。d不適切:変更時は再交付が必要とされる。適切はaのみで1個。","topic":"書面交付・帳簿","exps":["○ 極度方式基本契約は契約締結前書面が必要","× 個別の極度方式貸付けごとの交付は不要","× 保証契約の書面は保証人となろうとする者に交付","× 指針は変更時の再交付を求める(要確認)"]},{"id":"R7-13","year":"令和7年度","qNum":13,"category":"法及び関係法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者Ａは、貸付けに係る契約に基づく債権を貸金業者であるＢに譲渡する場合には、Ｂに対し、当該債権が貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項及び譲受人が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項所定の規定の適用がある旨を通知する必要はない。","貸金業者Ａは、貸付けに係る契約に基づく債権をＢに譲渡した場合には、債務者Ｃに対し、当該債権について貸金業法第17条（契約締結時の書面の交付）第1項に規定する書面を交付しなければならない。","貸金業者Ａは、貸付けに係る契約に基づく債権をＢに譲渡した後にＢが当該債権をさらに暴力団員Ｃに譲渡した場合において、Ｂへの当該債権の譲渡に当たり、Ｃが当該債権を譲り受けることを知っていたときのみならず、知り得たときも、貸金業法に基づく行政処分の対象となる。","個人である貸金業者Ａは、貸付けに係る契約に基づく債権をＡの親族であるＢに譲渡した場合において、Ｂが当該債権の取立てをするに当たり、貸金業法第21条（取立て行為の規制）第1項に違反したときは、Ｂが当該違反行為を行わないようにＡが相当の注意を払っていたか否かにかかわらず、貸金業法に基づく行政処分の対象となる。"],"note":"","correct":3,"explanation":"公式正答は③。この問の詳細な解説は未作成です。","topic":"民法","exps":["× 貸金業者へ譲渡する場合も通知が必要","× 交付義務の定めと異なる(要確認)","○ 暴力団員へ譲渡する場合、知り得たときも処分の対象","× 相当の注意を払っていた場合は処分の対象とならない"]},{"id":"R7-14","year":"令和7年度","qNum":14,"category":"法及び関係法令","stem":"貸金業者に対する監督等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","items":[{"label":"a","text":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）が、その登録を受けた貸金業者の業務の運営に関し、当該貸金業者に対して、業務の方法の変更その他業務の運営の改善に必要な措置を命ずることができるのは、当該貸金業者の業務の運営が法令に違反するものであると認められる場合に限られる。"},{"label":"b","text":"登録行政庁は、その登録を受けた貸金業者が暴力団員等をその業務に従事させ、又はその業務の補助者として使用した場合においては、その登録を取り消さなければならない。"},{"label":"c","text":"貸金業者は、事業年度ごとに、内閣府令で定めるところにより、貸金業に係る事業報告書を作成し、毎事業年度経過後3か月以内に、これを登録行政庁に提出しなければならない。"},{"label":"d","text":"日本貸金業協会に加入していない貸金業者は、当該貸金業者又はその役員もしくは使用人が遵守すべき社内規則の作成、変更又は廃止を行う場合においては、その都度、登録行政庁の承認を受けなければならない。"}],"choices":["a ・ b","a ・ d","b ・ c","c ・ d"],"note":"","correct":3,"explanation":"a不適切:運営改善命令は法令違反の場合に限られない。b適切:暴力団員等の使用は必要的取消し。c適切:3か月以内に事業報告書を提出。d不適切:承認制ではない。","topic":"登録・届出・監督処分","exps":["× 運営改善命令は法令違反の場合に限られない","○ 暴力団員等の使用は必要的取消し","○ 事業報告書は事業年度経過後3か月以内に提出","× 協会非加入者の社内規則は承認制ではない(要確認)"]},{"id":"R7-15","year":"令和7年度","qNum":15,"category":"法及び関係法令","stem":"指定信用情報機関への個人信用情報の提供等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","items":[],"choices":["指定信用情報機関とは、貸金業法第41条の13（信用情報提供等業務を行う者の指定）第1項の規定による指定を受けた者をいい、現在、株式会社日本信用情報機構、株式会社シー・アイ・シー及び全国銀行個人信用情報センターがその指定を受けている。","指定信用情報機関は、他の指定信用情報機関の加入貸金業者(注1)の依頼に基づき当該他の指定信用情報機関から個人信用情報の提供の依頼を受けたときは、正当な理由がある場合を除き、当該依頼に応じ、個人信用情報を提供しなければならない。","個人信用情報とは、個人を相手方とする貸付けに係る契約に係る貸金業法第41条の35（個人信用情報の提供）第1項各号に掲げる事項をいい、極度方式基本契約にあっては、極度額が含まれる。","加入貸金業者は、加入指定信用情報機関(注2)に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合において、当該信用情報の提供が貸金業法第13条に定める返済能力の調査を目的とするときは、あらかじめ、当該資金需要者等から同意を得る必要はない。"],"note":"(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方で\nある貸金業者をいう。\n(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定\n信用情報機関をいう。","correct":2,"explanation":"公式正答は②。この問の詳細な解説は未作成です。","topic":"指定信用情報機関","exps":["× 現在の指定信用情報機関はJICCとCICの2社(要確認)","○ 他の指定信用情報機関からの依頼にも正当な理由がなければ応じる","× 個人信用情報の項目の記述が異なる(要確認)","× 返済能力調査が目的でも本人の同意が必要"]},{"id":"R7-16","year":"令和7年度","qNum":16,"category":"法及び関係法令","stem":"貸金業者であるＡの廃業等の届出等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["個人であるＡが死亡した場合、Ａの相続人は、その事実を知った日から30日以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","株式会社であるＡが株式会社であるＢとの合併により消滅した場合、Ｂの代表取締役は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","Ａについて破産手続開始の決定があったときは、貸金業の登録は、その効力を失う。","Ａは、貸金業を廃止した場合であっても、Ａが締結した貸付けの契約に基づく取引を結了する目的の範囲内においては、なお貸金業者とみなされる。"],"note":"","correct":2,"explanation":"②が不適切:合併消滅の届出は、存続会社(B)ではなく、消滅した法人Aの代表役員であった者が届出義務者。","topic":"登録・届出・監督処分","exps":["○ 個人の死亡は相続人が知った日から30日以内に届出","× 合併消滅の届出は、消滅した法人の代表役員であった者","○ 破産手続開始の決定があれば登録は効力を失う","○ 廃止後も取引結了の範囲では貸金業者とみなされる"]},{"id":"R7-17","year":"令和7年度","qNum":17,"category":"法及び関係法令","stem":"貸金業者向けの総合的な監督指針における取引時確認、疑わしい取引の届出について、監督当局が貸金業者を監督するに当たって留意することとされている事項に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["犯罪による収益の移転防止に関する法律第3条第3項に基づき国家公安委員会が作成・公表する犯罪収益移転危険度調査書の内容を勘案し、取引・商品特性や取引形態、取引に関係する国・地域、顧客属性等の観点から、自らが行う取引がテロ資金供与やマネー・ローンダリング等に利用されるリスクについて適切に調査・分析した上で、その結果を記載した書面等（特定事業者作成書面等）を作成し、定期的に見直しを行っているか。","法人顧客との取引における実質的支配者の確認や、外国PEPs(注)該当性の確認、個人番号や基礎年金番号の取扱いを含む本人確認書類の適切な取扱いなど、取引時確認を適正に実施するための態勢が整備されているか。","疑わしい取引として届出を行うか否かの判断を行うに当たっては、別途公表している疑わしい取引の参考事例に基づきその要否を判断する態勢を整備しているか。なお、当該参考事例に該当する取引はもれなく届出を行う必要があり、一方、これに該当しない取引は届出の対象とならないことに留意する必要がある。","取引時確認と疑わしい取引の届出が相互に関連性を有していることを十分に認識し、取引時確認の的確な実施により資金需要者等の基礎的な情報を把握し、その上で当該情報及び資金需要者等の取引態様等を総合的に勘案のうえ判断し、疑わしい取引の届出が行われるよう、一体的、一元的な社内体制等が構築されているか。"],"note":"(注) 外国PEPsとは、犯罪による収益の移転防止に関する法律施行令第12条第3項\n各号及び犯罪による収益の移転防止に関する法律施行規則第15条各号に掲げる\n外国の元首及び外国政府等において重要な地位を占める者等をいう。","correct":3,"explanation":"③が不適切:疑わしい取引の参考事例は例示で、該当しなくても届出が必要となる場合がある。","topic":"登録・届出・監督処分","exps":["○ 特定事業者作成書面等を作成し定期的に見直す","○ 実質的支配者・外国PEPs確認などの態勢を整備する","× 参考事例に該当しなくても届出が必要な場合がある","○ 取引時確認と疑わしい取引の届出を一体的に行う体制"]},{"id":"R7-18","year":"令和7年度","qNum":18,"category":"法及び関係法令","stem":"貸金業者の禁止行為に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、貸金業の業務に従事する使用人その他の従業者に対し、その業務が営業所等において資金需要者等と対面することなく行うものであるとしても、その従業者であることを証する証明書を携帯させなければ、その者をその業務に従事させてはならない。","貸金業者は、その貸金業の業務に関し、資金需要者等に対し、不確実な事項について断定的判断を提供し、又は確実であると誤認させるおそれのあることを告げる行為をしてはならない。","貸金業者は、貸付けの契約（住宅資金貸付契約その他の内閣府令で定める契約を除く。）の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結しようとする場合には、当該保険契約において、自殺による死亡を保険事故としてはならない。","貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、公的な年金、手当等の受給者の借入意欲をそそるような表示又は説明をしてはならない。"],"note":"","correct":1,"explanation":"①が不適切:従業者証明書の携帯義務は、資金需要者等と対面しない業務には及ばない。","topic":"広告・勧誘・禁止行為","exps":["× 対面しない業務は証明書携帯義務の対象外","○ 断定的判断の提供は禁止","○ 自殺を保険事故とする保険契約は禁止","○ 年金等の受給者の借入意欲をそそる表示は禁止"]},{"id":"R7-19","year":"令和7年度","qNum":19,"category":"法及び関係法令","stem":"次の①～④の記述のうち、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定するものに該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["売却を予定している個人顧客の不動産（借地権を含む。）の売却代金により弁済される貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該不動産の価格の範囲内であるものに限り、当該不動産を売却することにより当該個人顧客の生活に支障を来すと認められる場合を除く。）","個人顧客の居宅を担保とする貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該居宅の価格の範囲内であるものに限る。）","自ら又は他の者により住宅資金貸付契約に係る貸付けが行われるまでのつなぎとして行う貸付けに係る契約","個人顧客又は当該個人顧客の親族で当該個人顧客と生計を一にする者の健康保険法に規定する高額療養費を支払うために必要な資金の貸付けに係る契約"],"note":"","correct":2,"explanation":"②が該当しない:除外される担保貸付けに居宅担保貸付けは含まれない(居宅以外の不動産担保等が対象)。","topic":"返済能力調査・過剰貸付け","exps":["○ 不動産売却代金で弁済される貸付けは除外される","× 居宅担保貸付けは除外契約に含まれない","○ 住宅資金貸付けのつなぎ貸付けは除外される","○ 高額療養費を支払う資金の貸付けは除外される"]},{"id":"R7-20","year":"令和7年度","qNum":20,"category":"法及び関係法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるもの（以下、本問において「例外契約」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者が事業を営む個人顧客との間で貸付けに係る契約を締結する場合において、当該契約が例外契約に該当するための要件の1つとして、当該契約に関し、実地調査、当該個人顧客の直近の確定申告書の確認その他の方法により当該事業の実態が確認されていることが必要である。","貸金業者が事業を営む個人顧客との間で貸付けに係る契約を締結する場合において、当該契約に係る貸付けの金額が100万円以下であるときは、当該契約が例外契約に該当するための要件の1つとして、当該契約に関し、当該個人顧客の営む事業の状況、収支の状況及び資金繰りの状況に照らし、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められることが必要である。","預金保険法第2条第1項に規定する金融機関からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が3か月を超えないものは、例外契約に該当する。","例外契約に係る貸付けの残高は、貸金業法第13条（返済能力の調査）第3項第2号の規定に基づき算出される個人顧客合算額に算入される。"],"note":"","correct":3,"explanation":"③が不適切:つなぎ貸付けの例外契約は返済期間が1か月を超えないものに限られる(3か月ではない)。","topic":"返済能力調査・過剰貸付け","exps":["○ 事業の実態の確認が要件","○ 100万円以下は返済能力を超えないことが必要","× つなぎ貸付けは返済期間が1か月を超えないものに限る","○ 例外契約の残高も個人顧客合算額に算入される"]},{"id":"R7-21","year":"令和7年度","qNum":21,"category":"法及び関係法令","stem":"貸金業法第17条（契約締結時の書面の交付）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に、極度方式基本契約に関し貸金業者が受け取る書面の内容を記載しなければならない。","貸金業者が極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に記載すべき貸金業者の登録番号については、その登録番号の括弧書の記載を省略することができる。","貸金業者が顧客との間で極度方式貸付けに係る契約を締結した場合において、当該顧客に対し、その承諾を得て、内閣府令で定めるところにより、一定期間における貸付け及び弁済その他の取引の状況を記載した書面として内閣府令で定めるものを交付するときは、貸金業法第17条第1項に規定する書面（当該極度方式貸付けに係る契約についての契約締結時の書面）の交付に代えて、契約年月日及び貸付けの金額のほか内閣府令で定める事項を記載した書面を当該顧客に交付することができる。","貸金業者は、極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に記載すべき事項について、その相手方から書面による交付を希望する旨の申出があった場合を除き、当該事項を電磁的方法により提供することができる。"],"note":"","correct":4,"explanation":"公式正答は④。この問の詳細な解説は未作成です。","topic":"書面交付・帳簿","exps":["○ 基本契約書面に貸金業者が受け取る書面の内容を記載","○ 登録番号の括弧書は省略できる","○ 取引状況の書面を交付する場合は契約書面を簡略にできる","× 電磁的方法での提供には相手方の承諾が必要(要確認)"]},{"id":"R7-22","year":"令和7年度","qNum":22,"category":"法及び関係法令","stem":"貸金業者であるＡは、個人顧客であるＢとの間で、金銭の貸付けに係る契約を締結し、遅滞なく、貸金業法第17条第1項に規定する書面（以下、本問において「契約締結時の書面」という。）をＢに交付した。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本件契約は、極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。","items":[],"choices":["Ａは、契約締結時の書面を交付した後に、貸付けの利率を引き下げた場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","Ａは、契約締結時の書面を交付した後に、各回の返済金額を減額した場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","Ａは、契約締結時の書面を交付した後に、期限の利益の喪失の定めについてＢの利益となる変更を加えた場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","Ａは、契約締結時の書面を交付した後に、契約締結時の書面に記載されている保証人との間で締結している保証契約を解除した場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。"],"note":"","correct":2,"explanation":"②が不適切:返済金額の変更は利益となる変更でも、変更後の契約締結時書面の交付が必要。","topic":"書面交付・帳簿","exps":["○ 利率の引下げは再交付不要","× 返済金額の減額でも再交付が必要","○ 期限の利益喪失の利益変更は再交付不要","○ 保証契約の解除は再交付不要"]},{"id":"R7-23","year":"令和7年度","qNum":23,"category":"法及び関係法令","stem":"貸金業法第21条（取立て行為の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者（以下、本問において「貸金業を営む者等」という。）は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、午後9時から午前8時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならないが、貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、例えば、債務者等と連絡をとるための合理的方法が他にない場合は、正当な理由に該当する可能性が高いとされている。","貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、債務者等が弁済し、又は連絡し、もしくは連絡を受ける時期を申し出た場合において、その申出が社会通念に照らし相当であると認められないことその他の正当な理由がないのに、午前8時から午後9時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならないが、監督指針によれば、例えば、直近において債務者等から弁済や連絡に関する申し出が履行されていない場合は、正当な理由に該当する可能性が高いとされている。","貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、債務者等の勤務先その他の居宅以外の場所を訪問してはならないが、監督指針によれば、例えば、債権の取立てをするに当たって勤務先を訪問する旨を告げたとしても、そのことをもって違反行為に該当するものではないとされている。","貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、貼り紙、立看板その他何らの方法をもってするを問わず、債務者の借入れに関する事実その他債務者等の私生活に関する事実を債務者等以外の者に明らかにしてはならないが、監督指針によれば、例えば、債務者等から家族に知られないように要請を受けている場合以外においては、債務者等の自宅に電話をかけ家族がこれを受けた場合に貸金業者であることを名乗り、郵送物の送付に当たり差出人として貸金業者であることを示したとしても、直ちに違反行為に該当するものではないとされている。"],"note":"","correct":3,"explanation":"③が不適切:監督指針では、勤務先訪問を告げる行為自体が違反行為に該当しうるとされる。","topic":"取立て・債権譲渡","exps":["○ 他に合理的な方法がない場合は正当な理由に当たりうる","○ 申出が履行されていない場合は正当な理由に当たりうる","× 勤務先訪問を告げること自体が違反となりうる","○ 家族に知られないよう要請がなければ直ちに違反ではない"]},{"id":"R7-24","year":"令和7年度","qNum":24,"category":"法及び関係法令","stem":"貸金業法第24条の6の2（開始等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、その政令で定める使用人が破産手続開始の決定を受けた場合、内閣府令で定めるところにより、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","貸金業者は、貸金業務取扱主任者が死亡したことにより、その営業所又は事務所について貸金業法第12条の3（貸金業務取扱主任者の設置）に規定する要件を欠くこととなった場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","貸金業者は、その使用人に貸金業の業務に関し法令に違反する行為があったことを知った場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","貸金業者（資金需要者等の利益を損なうおそれがないものとして内閣府令で定める事由がある者を除く。）は、その登録期間中に純資産額が5000万円未満となったことを知った場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。"],"note":"","correct":1,"explanation":"①が不適切:使用人の破産手続開始決定は、本条の届出事由ではない。","topic":"登録・届出・監督処分","exps":["× 使用人の破産手続開始決定は届出事由ではない","○ 主任者の死亡で設置要件を欠いたときは届出","○ 使用人の法令違反を知ったときは届出","○ 純資産額が5000万円未満となったことを知ったときは届出"]},{"id":"R7-25","year":"令和7年度","qNum":25,"category":"法及び関係法令","stem":"金利等の規制に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["出資の受入れ、預り金、及び金利等の取締りに関する法律上、金銭の貸借の媒介を行う者は、その媒介に係る貸借の金額の100分の5に相当する金額（当該貸借の期間が1年未満であるものについては、当該貸借の金額に、その期間の日数に応じ、年5％の割合を乗じて計算した金額）を超える手数料の契約をし、又はこれを超える手数料を受領してはならない。","利息制限法上、営業的金銭消費貸借上の債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が年2割（20％）を超えるときは、その超過部分について、無効とされる。","利息制限法上、営業的金銭消費貸借上の債務を主たる債務とする保証（業として行うものに限る。）がされた場合における保証料（主たる債務者が支払うものに限る。）の契約は、その保証料が当該主たる債務の元本に係る法定上限額（同法第1条及び第5条の規定の例により計算した金額をいう。）から当該主たる債務について支払うべき利息の額を減じて得た金額を超えるときは、その超過部分について、無効とされる。","貸金業法上、貸金業者は、その利息（みなし利息を含む。）が利息制限法第1条及び第5条の規定の例により計算した金額を超える利息の契約を締結した場合、刑事罰の対象となる。"],"note":"","correct":4,"explanation":"④が不適切:利息制限法の上限超過の契約は行政処分の対象になりうるが、刑事罰の対象となるのは出資法の上限金利を超えた場合。","topic":"利息制限法・出資法","exps":["○ 媒介手数料は出資法の規制(貸借金額の5%)","○ 賠償額予定は年20%超の部分が無効","○ 保証料は法定上限額を超える部分が無効","× 刑事罰の対象は出資法の上限金利超で、利息制限法超過のみでは行政処分"]},{"id":"R7-26","year":"令和7年度","qNum":26,"category":"法及び関係法令","stem":"複数の営業的金銭消費貸借契約（以下、本問において「第一契約」、「第二契約」又は「第三契約」という。）における利息の制限の適用に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂとの間で、元本を50万円とし利息を年1割8分（18％）とする第一契約を締結し50万円をＢに貸し付けると同時に、Ｂとの間で元本を100万円とし利息を年1割（10％）とする第二契約を締結し100万円をＢに貸し付けた。この場合、第一契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","Ａは、Ｂとの間で、元本を100万円とし利息を年1割5分（15％）とする第一契約を締結し100万円をＢに貸し付けた。その後、Ａは、第一契約に基づく債務の元本残高が30万円である時点において、Ｂとの間で元本を70万円とし利息を年1割8分（18％）とする第二契約を締結し70万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","Ａは、Ｂとの間で、元本を100万円とし利息を年1割5分（15％）とする第一契約を締結し100万円をＢに貸し付けた。Ａは、ＢがＡに対して第一契約に基づく債務をすべて弁済した後に、Ｂとの間で元本を8万円とし利息を年2割（20％）とする第二契約を締結し8万円をＢに貸し付けると同時に、元本を30万円とし利息を年1割8分（18％）とする第三契約を締結し30万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割8分（18％）を超過する部分に限り無効となる。","Ａは、Ｂとの間で、元本を70万円とし利息を年1割8分（18％）とする第一契約を締結し70万円をＢに貸し付けた。その後、貸金業者であるＣは、ＢがＡから70万円を借り入れた事実を把握した上で、Ｂとの間で、元本を30万円とし利息を年1割8分（18％）とする初めての第二契約を締結し30万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。"],"note":"","correct":4,"explanation":"④が不適切:利息制限法の元本額は同一の貸主の貸付けで合算する。別の貸主Cの30万円は単独で判定され、上限は年18%(15%に引き下げられない)。","topic":"利息制限法・出資法","exps":["○ 同時の複数契約は元本を合算して判定","○ 残存元本30万+70万=100万円で上限15%","○ 弁済後の新契約8万+30万で上限18%","× 別の貸主Cとは合算されず、第二契約の上限は年18%"]},{"id":"R7-27","year":"令和7年度","qNum":27,"category":"法及び関係法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、当該契約で約定された弁済期における口座振替の方法による弁済に係る口座振替手続に要する費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされない。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条（契約締結時の書面の交付）第1項に規定する書面を交付し、当該交付に要する費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客に交付したカードの発行費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、顧客が金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、10,000円の弁済を受領する際に110円（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。"],"note":"","correct":1,"explanation":"①が不適切:口座振替手続の費用は除外項目に当たらず利息とみなされる。②契約書面の交付費用、③カード発行費用は利息とみなされ、④ATM利用料(1万円以下は110円まで)はみなされない。","topic":"利息制限法・出資法","exps":["× 口座振替手続の費用は利息とみなされる","○ 契約書面の交付費用は利息とみなされる","○ カード発行費用は利息とみなされる","○ ATM利用料(1万円以下は110円まで)はみなされない"]},{"id":"R7-28","year":"令和7年度","qNum":28,"category":"貸付け・付随取引の法令実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["意思表示は、その通知を相手方に発した時からその効力を生ずる。","表意者は、意思表示の相手方の所在を知ることができないときは、公示の方法によって意思表示をすることができるが、意思表示の相手方を知ることができないときは、公示の方法によって意思表示をすることができない。","意思表示が、意思表示に対応する意思を欠く錯誤に基づくものであって、その錯誤が、法律行為の目的及び取引上の社会通念に照らして重要なものであり、かつ、表意者の重大な過失によるものでなかった場合には、表意者は、その意思表示を取り消すことができる。","相手方に対する意思表示について第三者が強迫を行った場合においては、相手方がその事実を知り、又は知ることができたときに限り、表意者は、その意思表示を取り消すことができる。"],"note":"","correct":3,"explanation":"③適切(重大な過失がない錯誤は取消可)。①は到達時に効力発生、②は相手方不明でも公示可、④第三者強迫は相手方が悪意・有過失のとき取消可。","topic":"民法","exps":["× 意思表示は相手方に到達した時から効力を生じる","× 相手方を知ることができないときも公示の方法で意思表示できる","○ 重要な錯誤で、表意者に重大な過失がなければ取り消せる","× 第三者による強迫は、相手方の認識を問わず取り消せる"]},{"id":"R7-29","year":"令和7年度","qNum":29,"category":"貸付け・付随取引の法令実務","stem":"Ａは、Ｂ所有の甲土地を売却する旨の売買契約を締結しようとしている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａは、Ｂから甲土地の売却について代理権を付与されていたが、Ｃとの間で、当該代理権に基づく代理行為を行うに際し、Ｂのためにすることを示さないで甲土地の売買契約を締結した。この場合において、Ｃが、当該契約を締結するに際し、当該契約がＢのためにされたものであることを知っていたときであっても、当該契約はＡとＣとの間にその効力を生ずる。","Ａは、Ｂから甲土地の売却について付与されていた代理権が消滅した後に、その代理権の範囲内において、Ｂの代理人として、Ｄとの間で甲土地の売買契約を締結した。この場合において、Ｄが、当該代理権の消滅の事実を過失により知らなかったときであっても、当該契約は、ＢとＤとの間にその効力を生ずる。","Ａは、何らの代理権も付与されていないのに、Ｂの代理人として、Ｅとの間で甲土地の売買契約を締結した。この場合において、Ｅは、当該契約締結時に、当該契約を締結することにつきＡに代理権がないことを知らなかったときは、Ｂが追認をしない間は、当該契約を取り消すことができる。","Ａは、Ｂから甲土地の売却について代理権を付与されていた一方で、Ｆからも甲土地の購入について代理権を付与されていた。この場合において、Ａが、Ｂ及びＦの双方の代理人として、甲土地の売買契約を締結したときは、当該契約はＢとＦとの間にその効力を生ずる。"],"note":"","correct":3,"explanation":"③適切:無権代理の相手方は、善意なら本人の追認前に取り消せる。","topic":"民法","exps":["× 顕名がなくても、相手方が知り又は知り得たときは本人に効力が生じる","× 代理権消滅後の表見代理は、相手方が善意無過失の場合に限る","○ 無権代理の相手方は、善意なら本人の追認前に取り消せる","× 双方代理は無権代理とみなされ、BとFの間に効力は生じない"]},{"id":"R7-30","year":"令和7年度","qNum":30,"category":"貸付け・付随取引の法令実務","stem":"法律行為の無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["未成年者は、その法定代理人の同意がなければ、自己の行った法律行為を取り消すことができない。","取り消された法律行為は、初めから無効であったものとみなされる。","無効な法律行為に基づく債務の履行として給付を受けた者は、その給付を受けた当時その法律行為が無効であることを知っていたか否かにかかわらず、その法律行為によって現に利益を受けた限度において、相手方に対し、返還の義務を負う。","取消権は、法律行為の時から5年間行使しないときは、時効によって消滅する。"],"note":"","correct":2,"explanation":"②適切:取り消された行為は初めから無効とみなされる。","topic":"民法","exps":["× 同意がなければ、未成年者は自己の行為を取り消せる","○ 取り消された行為は初めから無効とみなされる","× 返還の範囲は、悪意か善意かで異なる","× 取消権は追認可能時から5年、行為時から20年で消滅"]},{"id":"R7-31","year":"令和7年度","qNum":31,"category":"貸付け・付随取引の法令実務","stem":"根抵当権に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["根抵当権は、債務者との取引によって生ずる債権について、その担保すべき範囲を限定して定めることを要しない。","根抵当権者は、確定した元本のほか、利息その他の定期金を請求する権利又は債務の不履行によって生じた損害の賠償を請求する権利を有するときは、その最後の2年分についてのみ、その根抵当権を行使することができる。","元本の確定前に根抵当権者から根抵当権の被担保債権を取得した者は、その債権についてその根抵当権を行使することができる。","根抵当権により担保すべき元本の確定すべき期日の定めがない場合、根抵当権設定者は、その根抵当権の設定の時から3年を経過したときは、その担保すべき元本の確定を請求することができる。"],"note":"","correct":4,"explanation":"④適切:元本確定期日の定めがない場合、設定者は設定から3年経過後に確定請求できる。","topic":"民法","exps":["× 根抵当権は担保すべき債権の範囲を限定して定める","× 利息・損害金は最後の2年分に限られず、極度額まで行使できる","× 元本確定前に債権を取得しても根抵当権は行使できない","○ 確定期日の定めがなければ、設定者は3年経過後に元本確定を請求できる"]},{"id":"R7-32","year":"令和7年度","qNum":32,"category":"貸付け・付随取引の法令実務","stem":"債権の効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債務の不履行又はこれによる損害の発生もしくは拡大に関して債権者に過失があったときは、裁判所は、これを考慮して、損害賠償の責任及びその額を定める。","債務者は、債権者に対し、損害賠償として、その債権の目的である物又は権利の価額の全部の支払をした場合であっても、債権者の承諾を得なければ、その物又は権利について債権者に代位することができない。","債権者は、自己の債権を保全するため必要があるときは、債務者の一身に専属する権利を行使することができる。","債権者は、裁判外において、詐害行為取消権を行使して、債務者が債権者を害することを知ってした財産権を目的とする行為を取り消すことができる。"],"note":"","correct":1,"explanation":"①適切:過失相殺の規定。","topic":"民法","exps":["○ 債権者に過失があれば、裁判所は損害賠償の責任・額で考慮する","× 全額を賠償した債務者は、債権者の承諾なく当然に代位する","× 一身専属権は債権者代位権の対象外","× 詐害行為取消権は裁判上で行使する"]},{"id":"R7-33","year":"令和7年度","qNum":33,"category":"貸付け・付随取引の法令実務","stem":"ＡのＢに対する貸付金債権（以下、本問において「本件債権」という。）の譲渡に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["Ａが、本件債権をＣに譲渡し、Ｃへの本件債権の譲渡についてＢに通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲受けをＢに対抗することができる。","Ａが、本件債権をＣ及びＤに二重に譲渡した場合において、AC間の債権譲渡について、ＢがＡに対して確定日付のある証書によらない承諾をした後、AD間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲受けをＤに対抗することができる。","Ａが、本件債権をＣ及びＤに二重に譲渡した場合において、いずれの債権譲渡についても、ＡからＢに対して確定日付のある証書による通知がなされた。AC間の債権譲渡の通知よりも先にAD間の債権譲渡の通知がＢに到達したが、AC間の債権譲渡の通知に係る確定日付はAD間の債権譲渡の通知に係る確定日付よりも早い日であった。この場合、Ｃは、本件債権の譲受けをＤに対抗することができる。","Ａが、本件債権をＣに譲渡した後に、本件債権は、Ａの債権者Ｅにより差し押さえられた。この場合において、Ｃに本件債権を譲渡した旨の確定日付のある証書による通知がＢに到達した後に、当該差押命令がＢに送達されたときであっても、Ｅは、本件債権の差押えをＣに対抗することができる。"],"note":"","correct":1,"explanation":"①適切:譲渡人から債務者への通知が到達すれば、債務者に対抗できる。","topic":"民法","exps":["○ 譲渡人からの通知が債務者に到達すれば、債務者に対抗できる","× 確定日付のない承諾では第三者に対抗できず、通知を備えたDが優先","× 優先は確定日付の先後ではなく、通知の到達の先後で決まる","× 通知が先に到達しているため、差押えはCに対抗できない"]},{"id":"R7-34","year":"令和7年度","qNum":34,"category":"貸付け・付随取引の法令実務","stem":"相殺に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["相殺の意思表示には、条件又は期限を付することができる。","時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合であっても、その債権者は、これを自働債権として相殺をすることができない。","相殺の意思表示は、その意思表示をした時から将来に向かってその効力を生ずる。","当事者が相殺を禁止し、又は制限する旨の意思表示をした場合には、その意思表示は、第三者がこれを知り、又は重大な過失によって知らなかったときに限り、その第三者に対抗することができる。"],"note":"","correct":4,"explanation":"④適切:相殺禁止特約は、第三者が悪意または重過失のときに対抗できる。","topic":"民法","exps":["× 相殺の意思表示に条件・期限は付けられない","× 時効消滅前に相殺適状なら、消滅した債権でも自働債権にできる","× 相殺は相殺適状になった時にさかのぼって効力を生じる","○ 相殺禁止の特約は、第三者が悪意又は重過失のときに対抗できる"]},{"id":"R7-35","year":"令和7年度","qNum":35,"category":"貸付け・付随取引の法令実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["相続人は、相続開始の時から、被相続人の一身に専属したものを含め、その財産に属した一切の権利義務を承継する。","共同相続人は、民法第908条（遺産の分割の方法の指定及び遺産の分割の禁止）第1項の規定により被相続人が遺言で遺産の分割を禁じた場合又は同条第2項の規定により共同相続人間で遺産の分割をしない旨の契約をした場合を除き、いつでも、その協議で、遺産の全部又は一部の分割をすることができる。","相続においては、被相続人の債権だけでなく、債務も遺産の分割の対象となり、遺産の分割により共同相続人の1人が被相続人の金銭債務の全てを承継した場合には、当該金銭債務の債権者は他の共同相続人に当該金銭債務の履行を請求することができない。","相続の放棄は、他の相続人に対する意思表示によってその効力を生じ、相続の放棄をした者は、その相続に関しては、初めから相続人とならなかったものとみなされる。"],"note":"","correct":2,"explanation":"②適切:遺産分割は、禁止の場合を除きいつでも協議でできる。","topic":"民法","exps":["× 被相続人の一身専属の権利義務は承継されない","○ 遺産分割は、禁止の場合を除きいつでもできる","× 金銭債務は当然に分割承継され、債権者は他の相続人に請求できる","× 相続の放棄は家庭裁判所への申述によって行う"]},{"id":"R7-36","year":"令和7年度","qNum":36,"category":"貸付け・付随取引の法令実務","stem":"破産法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["破産債権とは、破産者に対する財産上の請求権であって、破産手続開始後の原因に基づいて生じたものをいう。","別除権は、破産財団に属する財産につき特別の先取特権、質権又は抵当権を有する者がこれらの権利の目的である財産について認められる権利であり、破産手続によらなければ行使することができない。","破産者が破産手続開始後に破産財団に属する財産に関してした法律行為は、破産手続の関係においては、その効力を主張することができない。","破産債権者は、破産手続開始後に破産財団に対して債務を負担した場合、破産手続によらずに、相殺をすることができる。"],"note":"","correct":3,"explanation":"③適切:破産者が開始後に破産財団に関してした法律行為は、破産手続上、効力を主張できない。","topic":"破産法","exps":["× 破産債権は破産手続開始前の原因に基づく請求権","× 別除権は破産手続によらずに行使できる","○ 開始後の破産者の法律行為は、破産手続上効力を主張できない","× 開始後に負担した債務を使った相殺は、原則できない"]},{"id":"R7-37","year":"令和7年度","qNum":37,"category":"貸付け・付随取引の法令実務","stem":"意思能力及び行為能力に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とされる。","成年被後見人とは、精神上の障害により事理を弁識する能力を欠く常況にある者で、家庭裁判所により後見開始の審判を受けたものをいう。","未成年者が法律行為を行うにあたり、成年者であることを信じさせるため詐術を用いたとしても、当該未成年者の法定代理人は当該法律行為を取り消すことができる。","未成年者を相手方として法律行為を行った者が、当該未成年者が行為能力者とならない間に、当該未成年者の法定代理人に対し、1か月以上の期間を定めて、当該期間内に当該法律行為を追認するかどうかを確答すべき旨の催告をした場合において、当該法定代理人が当該期間内に確答を発しなかったときは、当該法律行為を追認したものとみなされる。"],"note":"","correct":3,"explanation":"③が不適切:未成年者が詐術を用いたときは、取消しができない。","topic":"民法","exps":["○ 意思能力のない者の法律行為は無効","○ 成年被後見人の定義どおり","× 詐術を用いた未成年者は、取り消せない","○ 催告に確答がなければ、追認したものとみなされる"]},{"id":"R7-38","year":"令和7年度","qNum":38,"category":"貸付け・付随取引の法令実務","stem":"期限及び期間に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["法律行為に始期を付したときは、その法律行為の履行は、期限が到来するまで、これを請求することができない。","債務者は、担保を滅失させ、損傷させ、又は減少させたときは、期限の利益を主張することができない。","日、週、月又は年によって期間を定めたときは、期間の初日は、算入しない。ただし、その期間が午前零時から始まるときは、この限りでない。","週、月又は年によって期間を定めた場合において、週、月又は年の初めから期間を起算しないときは、その期間は、最後の週、月又は年においてその起算日に応当する日に満了する。"],"note":"","correct":4,"explanation":"④が不適切:期間は、最後の週・月・年において起算日に応当する日の前日に満了する。","topic":"民法","exps":["○ 始期付きの法律行為は、期限到来まで履行を請求できない","○ 担保を滅失・損傷・減少させると、期限の利益を主張できない","○ 期間の初日は算入しない(午前零時からの場合を除く)","× 最後の週・月・年の起算日に応当する日の前日に満了"]},{"id":"R7-39","year":"令和7年度","qNum":39,"category":"貸付け・付随取引の法令実務","stem":"消滅時効に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債権は、債権者が権利を行使することができることを知った時から5年間行使しないとき、又は権利を行使することができる時から10年間行使しないときは、時効によって消滅する。","保証人は、主たる債務の消滅時効が完成した場合には、当該主たる債務の消滅時効を援用することができる。","消滅時効が完成し債務者が時効の援用をした場合には、その効果は、援用をした時から将来に向かってのみその効力を生ずる。","債権者と債務者との間で、両者の間に生じた債権について消滅時効が完成する前に、その消滅時効が完成しても債務者は時効の援用をしない旨の合意をしたとしても、当該合意は無効である。"],"note":"","correct":3,"explanation":"③が不適切:時効の援用の効果は、起算日にさかのぼる。","topic":"民法","exps":["○ 5年(知った時)または10年(行使できる時)で消滅","○ 保証人は主たる債務の時効を援用できる","× 時効の援用の効果は、起算日にさかのぼる","○ 時効完成前に援用しない旨の合意をしても無効"]},{"id":"R7-40","year":"令和7年度","qNum":40,"category":"貸付け・付随取引の法令実務","stem":"連帯保証に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、連帯保証人に対しても、その効力を生ずる。","連帯保証人は、主たる債務者が主張することができる抗弁をもって債権者に対抗することができる。","連帯保証人は、主たる債務者が債権者に対して相殺権を有するときは、相殺権の行使によって主たる債務者がその債務を免れるべき限度において、債権者に対して債務の履行を拒むことができる。","連帯保証人に対する履行の請求その他の事由による時効の完成猶予及び更新は、主たる債務者に対しても、その効力を生ずる。"],"note":"","correct":4,"explanation":"④が不適切:連帯保証人への履行の請求は、主たる債務者には効力が及ばない。","topic":"民法","exps":["○ 主たる債務者への請求等の効果は連帯保証人にも及ぶ","○ 連帯保証人は主たる債務者の抗弁を対抗できる","○ 主たる債務者の相殺権による限度で履行を拒める","× 連帯保証人への請求の効果は、主たる債務者には及ばない"]},{"id":"R7-41","year":"令和7年度","qNum":41,"category":"貸付け・付随取引の法令実務","stem":"弁済に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["債務者が1個の債務について、元本のほか利息及び費用を支払うべき場合において、弁済をする者がその債務の全部を消滅させるのに足りない給付をしたときは、別段の合意がない限り、これを順次に費用、利息及び元本に充当しなければならない。","受領権者（債権者及び法令の規定又は当事者の意思表示によって弁済を受領する権限を付与された第三者をいう。）以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意のときは、過失があったとしても、その効力を有する。","抵当権の目的となっている不動産の第三取得者は、当該抵当権の被担保債務の債務者及び債権者があらかじめ第三者による弁済を禁止し又は制限していないときは、当該債務者の意思に反しても、当該被担保債務を弁済することができる。","差押えを受けた債権の第三債務者が自己の債権者に弁済をしたときは、差押債権者は、その受けた損害の限度において更に弁済をすべき旨を当該第三債務者に請求することができる。"],"note":"","correct":2,"explanation":"②が不適切:受領権者としての外観を有する者への弁済は、善意かつ無過失であることが必要。","topic":"民法","exps":["○ 弁済の充当順序は費用、利息、元本","× 受領権者の外観への弁済は、善意かつ無過失が必要","○ 第三取得者は債務者の意思に反しても弁済できる","○ 差押え後の弁済は、差押債権者に対抗できない"]},{"id":"R7-42","year":"令和7年度","qNum":42,"category":"貸付け・付随取引の法令実務","stem":"犯罪による収益の移転防止に関する法律に基づき、貸金業者が顧客との間で特定取引を行うに際し当該顧客について行う取引時確認に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における特定取引は、同法第4条第2項各号に掲げる取引（ハイリスク取引）ではないものとする。","items":[],"choices":["貸金業者が取引時確認をしなければならない本人特定事項は、自然人にあっては氏名、住居（本邦内に住居を有しない外国人で政令で定めるものにあっては、主務省令で定める事項）及び生年月日、法人にあっては名称及び本店又は主たる事務所の所在地である。","貸金業者が顧客から本人確認書類として運転免許証（有効なものとする。）の提示を受ける場合において、当該運転免許証に記載されている住居が現在の住居と異なるときは、現在の住居が記載された官公庁発行書類（有効なものとする。）の写しの送付を受けることにより現在の住居の確認を行うことができる。","貸金業者が取引時確認をしなければならない事項は、自然人にあっては、本人特定事項のほか、取引を行う目的及び職業である。","貸金業者が国内に本店又は主たる営業所もしくは事務所を有する法人である顧客について取引時確認をする場合、当該法人の事業の内容は当該法人の代表者から申告を受けることにより確認を行うことができる。"],"note":"","correct":4,"explanation":"④が不適切:法人の事業内容は、代表者の申告のみでは足りず、書類等で確認する必要がある。","topic":"犯収法(取引時確認)","exps":["○ 本人特定事項は氏名・住居・生年月日(法人は名称・所在地)","○ 現住所は官公庁発行書類の写しの送付で確認できる","○ 本人特定事項のほか、取引目的と職業を確認する","× 法人の事業内容は、代表者の申告だけでは確認できない"]},{"id":"R7-43","year":"令和7年度","qNum":43,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["個人情報とは、個人に関する情報であって、当該情報に含まれる氏名、生年月日その他の記述等により特定の個人を識別することができるもの又は個人識別符号が含まれるものをいい、生存する個人に関する情報に限られない。","個人識別符号とは、個人に発行されるカードその他の書類に記載され、もしくは電磁的方式により記録された文字、番号、記号その他の符号であって、特定の利用者を識別することができるものをいい、クレジットカード番号や電話番号は個人識別符号に該当する。","要配慮個人情報とは、本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱いに特に配慮を要するものとして政令で定める記述等が含まれる個人情報をいう。","個人データとは、個人情報データベース等を構成する個人情報をいい、例えば、防犯カメラに録画された映像情報に本人を識別できる情報が含まれる場合には、当該映像情報が本人を容易に検索することができるよう体系的に構成されていないものであっても、当該映像情報に含まれる本人を識別できる情報は個人データに該当する。"],"note":"","correct":3,"explanation":"③適切:要配慮個人情報の定義どおり。①死者の情報も個人情報に含まれうるため誤り、②電話番号・カード番号は個人識別符号ではない、④検索できない映像は個人データに当たらない。","topic":"個人情報保護","exps":["× 個人情報は生存する個人に関する情報に限られる","× 電話番号・クレジットカード番号は個人識別符号ではない","○ 要配慮個人情報の定義どおり","× 検索できるよう体系化されていなければ個人データではない"]},{"id":"R7-44","year":"令和7年度","qNum":44,"category":"資金需要者等の保護","stem":"金融分野における個人情報保護に関するガイドラインに規定する個人データの第三者提供の制限（個人情報保護法(注)第27条関係）についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["金融分野における個人情報取扱事業者は、与信事業に係る個人の返済能力に関する情報を個人信用情報機関へ提供するに当たっては、個人情報保護法第27条（第三者提供の制限）第2項の規定に従い、適切にオプトアウトの手続をすることとされている。","個人信用情報機関に対して個人データが提供される場合には、個人信用情報機関を通じて当該機関の会員企業にも情報が提供されることとなるため、個人信用情報機関に個人データを提供する金融分野における個人情報取扱事業者が本人の同意を得ることとされている。","個人情報保護法第27条第5項第3号に定める通知等（共同利用の際の通知等）に関し、事業者による「共同して利用する者の範囲」の通知等については、本人がその範囲を明確に判断できるように、共同して利用する者の名称等を個別に全て列挙する必要があるとされている。","金融分野における個人情報取扱事業者は、個人情報保護法第27条第1項に従い、個人データの第三者提供についての本人の同意を得る際には、個人データの提供先の第三者、提供先の第三者における利用目的及び第三者に提供される個人データの項目を本人に認識させた上で同意を得ることとされているが、書面又は電磁的記録による必要はない。"],"note":"(注) 個人情報保護法とは、個人情報の保護に関する法律をいう。","correct":2,"explanation":"②適切:個人信用情報機関への提供は本人の同意を得ることとされている(オプトアウトではない)。","topic":"個人情報保護","exps":["× 個人信用情報機関への提供は本人の同意が必要(オプトアウトではない)","○ 個人信用情報機関への提供には本人の同意を得る","× 共同利用の範囲の通知方法の記述が異なる(要確認)","× 同意の取得は書面又は電磁的記録による"]},{"id":"R7-45","year":"令和7年度","qNum":45,"category":"資金需要者等の保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["個人情報取扱事業者は、特定された利用目的の達成に必要な範囲を超えて個人情報を取り扱う場合には、あらかじめ本人の同意を得なければならない。","個人情報取扱事業者は、合併その他の事由により他の個人情報取扱事業者から事業を承継することに伴って個人情報を取得する場合であって、当該個人情報に係る承継前の利用目的の達成に必要な範囲内で当該個人情報を取り扱うときは、あらかじめ本人の同意を得る必要はない。","個人情報取扱事業者は、インターネットなどで本人が自発的に公にしている個人情報を取得した場合には、その利用目的を、本人に通知し、又は公表する必要はない。","個人情報取扱事業者は、個人情報の利用目的を変更する場合には、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて行ってはならない。"],"note":"","correct":3,"explanation":"③が不適切:本人が自発的に公にしている情報を取得した場合でも、利用目的の通知・公表は必要。","topic":"個人情報保護","exps":["○ 利用目的の範囲を超える取扱いには事前の同意が必要","○ 事業承継の場合は、承継前の利用目的の範囲内なら同意不要","× 自発的に公にされた個人情報でも利用目的の通知又は公表は必要","○ 利用目的の変更は、関連性を有する範囲に限る"]},{"id":"R7-46","year":"令和7年度","qNum":46,"category":"資金需要者等の保護","stem":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["協会員は、債務者等に対して貸付けの契約に係る勧誘を行うに際しては、当該債務者等から当該勧誘を行うことについての承諾を得なければならない。","協会員は、勧誘リスト等を作成するにあたっては、当該勧誘リストに個人信用情報の記載等をすることがないよう留意しなければならない。","協会員は、資金需要者等が身体的・精神的な障害等により契約の内容が理解困難なことを認識した場合には、貸付けの契約の締結に係る勧誘を行ってはならない。","協会員は、貸金業の業務に関して勧誘をした場合において、当該勧誘対象者が勧誘に係る取引についての契約を締結しない旨の意思を表示した場合、当該意思表示のあった日から最低1年間は当該勧誘に係る取引及びこれと類似する取引の勧誘を行ってはならない。"],"note":"","correct":4,"explanation":"公式正答は④。この問の詳細な解説は未作成です。","topic":"協会自主規制・紛争解決","exps":["○ 勧誘には債務者等の承諾が必要","○ 勧誘リストには個人信用情報を記載しない","○ 契約内容の理解が困難な者への勧誘は行わない","× 勧誘を拒否された後の禁止期間の記述が規則と異なる(要確認)"]},{"id":"R7-47","year":"令和7年度","qNum":47,"category":"資金需要者等の保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["貸金業務等関連苦情とは、貸金業務等に関し、その契約者等による当該貸金業務等を行った貸金業者に対する不満足の表明のうち、当該貸金業者と当該契約者等の自主的な交渉では解決ができないものであって、当事者が和解をすることができるものをいう。","協会員等は、貸金業相談・紛争解決センターによる紛争解決等業務を周知するため、その内容及び手続の概要、受付窓口などに関し、協会員等のウェブサイトに掲示し又は店頭に掲示するなど適切な方法で公表しなければならない。","協会員等との間で貸金業務等関連苦情を有する契約者等である個人、法人又は法人でない社団もしくは財団で代表者もしくは管理者の定めがある者は、貸金業相談・紛争解決センターに対して苦情処理手続開始の申立てをすることができる。","貸金業相談・紛争解決センターが苦情の解決の促進を図る場合において、当事者である協会員等は、正当な理由なく事情の聴取及び資料提出の求めを拒むことはできない。"],"note":"","correct":1,"explanation":"公式正答は①。この問の詳細な解説は未作成です。","topic":"協会自主規制・紛争解決","exps":["× 貸金業務等関連苦情の定義の記述が規則と異なる(要確認)","○ 紛争解決等業務の内容・手続を周知する","○ 契約者等である個人・法人等は申立てができる","○ 協会員等は正当な理由なく事情聴取等を拒めない"]},{"id":"R7-48","year":"令和7年度","qNum":48,"category":"財務及び会計","stem":"会社計算規則に規定する損益計算書等(注)に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["損益計算書等は、売上高（売上高以外の名称を付すことが適当な場合には、当該名称を付した項目。以下、本問において「売上高」という。）、売上原価、販売費及び一般管理費、営業外収益、営業外費用、特別利益、特別損失の各項目に区分して表示しなければならない。","当期純利益とは、経常利益から法人税等を控除した額をいう。","経常利益とは、売上高に営業外収益及び特別利益を加えたものから売上原価、販売費及び一般管理費、営業外費用並びに特別損失を減じたものをいう。","売上総利益とは、売上高から売上原価並びに販売費及び一般管理費を控除したものをいう。"],"note":"(注) 損益計算書等とは、損益計算書及び連結損益計算書をいう。","correct":1,"explanation":"①適切。②当期純利益は税引前当期純利益から法人税等を控除、③経常利益には特別利益・特別損失を含まない、④売上総利益は売上高から売上原価のみを控除したもの。","topic":"財務・会計","exps":["○ 損益計算書等は各項目に区分して表示する","× 当期純利益は税引前当期純利益から法人税等を控除した額","× 経常利益に特別利益・特別損失は含まれない","× 売上総利益は売上高から売上原価のみを控除した額"]},{"id":"R7-49","year":"令和7年度","qNum":49,"category":"財務及び会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","items":[],"choices":["企業会計は、企業の財政状態及び経営成績に関して、真実な報告を提供するものでなければならない。これを一般に真実性の原則という。","事業取引と投資等の財務活動とを明瞭に区別し、特に事業収益と財務活動による収益とを混同してはならない。これを一般に事業・財務収益区分の原則という。","企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。","企業の財政に不利な影響を及ぼす可能性がある場合には、これに備えて適当に健全な会計処理をしなければならない。これを一般に保守主義の原則という。"],"note":"","correct":2,"explanation":"②が不適切:一般原則に事業・財務収益区分の原則はない(区分するのは資本取引と損益取引)。","topic":"財務・会計","exps":["○ 真実性の原則","× 一般原則に事業・財務収益区分の原則はない(区分するのは資本取引と損益取引)","○ 継続性の原則","○ 保守主義の原則"]},{"id":"R7-50","year":"令和7年度","qNum":50,"category":"財務及び会計","stem":"貸借対照表に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問においては、連結貸借対照表は考慮しなくてよいものとする。","items":[],"choices":["会社計算規則によれば、資産の部は、流動資産、固定資産、繰延資産に区分しなければならないとされている。","会社計算規則によれば、負債の部は、流動負債、固定負債、引当金その他の負債に区分しなければならないとされている。","会社計算規則によれば、株式会社における純資産の部は、株主資本、評価・換算差額等、株式引受権、新株予約権に区分しなければならないとされている。","貸借対照表では、資産の部の合計額から負債の部の合計額を差し引いた額は、純資産の部の合計額と一致する。"],"note":"","correct":2,"explanation":"②が不適切:会社計算規則の負債の部は、流動負債と固定負債に区分する。","topic":"財務・会計","exps":["○ 資産の部は流動資産・固定資産・繰延資産に区分","× 負債の部は流動負債と固定負債に区分","○ 純資産の部は株主資本などに区分","○ 資産−負債=純資産"]}];
const KEY='kashikin_logs_r5_r7';
const $=i=>document.getElementById(i), N='①②③④';
let Q=[],i=0,ok=0;
let LOGS=[];try{LOGS=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const logs=()=>LOGS, T=Object.fromEntries(DB.map(q=>[q.id,q]));
const DEFAULT_URL='';/* 任意:ここに /exec URL を直書きしてもよい */
let SYNC_URL=localStorage.getItem(KEY+'_url')||DEFAULT_URL;
let PEND=[];try{PEND=JSON.parse(localStorage.getItem(KEY+'_pend'))||[]}catch(e){}
const savePend=()=>{try{localStorage.setItem(KEY+'_pend',JSON.stringify(PEND))}catch(e){}};
async function flush(){if(!SYNC_URL||!PEND.length||!navigator.onLine)return;const b=PEND.slice();try{await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});PEND=PEND.slice(b.length);savePend()}catch(e){}}
async function pull(){if(!SYNC_URL||!navigator.onLine)return;try{const r=await (await fetch(SYNC_URL+'?action=logs')).json();if(Array.isArray(r)&&r.length){const h=new Set(LOGS.map(x=>x.ts));r.forEach(x=>{if(!h.has(x.ts))LOGS.push(x)});LOGS.sort((a,b)=>(b.ts||0)-(a.ts||0));save()}}catch(e){}}
addEventListener('online',flush);flush();pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(LOGS))}catch(e){}};
let t0=0;
const cats=[...new Set(DB.map(q=>q.category))];
cats.forEach(c=>$('fc').add(new Option(c,c)));
function show(t){['quiz','log','ana'].forEach(k=>$(k).classList.toggle('hidden',t!=k));if(t=='log')renderLog();if(t=='ana')renderAna()}
function start(){
 const seen=new Set(),wrong=new Set();LOGS.forEach(l=>{if(!seen.has(l.id)){seen.add(l.id);if(!l.ok)wrong.add(l.id)}});
 Q=DB.filter(q=>(!$('fy').value||q.year==$('fy').value)&&(!$('fc').value||q.category==$('fc').value)&&(!$('wr').checked||wrong.has(q.id)));
 if(!Q.length){alert('該当する問題がありません');return}
 if($('sh').checked)Q.sort(()=>Math.random()-.5);
 if($('lc').checked){const c={};LOGS.forEach(l=>c[l.id]=(c[l.id]||0)+1);Q.sort((a,b)=>(c[a.id]||0)-(c[b.id]||0))}
 const n=+$('fn').value;if(n)Q=Q.slice(0,n);
 i=0;ok=0;$('setup').classList.add('hidden');$('done').classList.add('hidden');$('qs').classList.remove('hidden');load();
}
function load(){
 const q=Q[i];t0=Date.now();$('fb').classList.add('hidden');
 $('prog').textContent=`${i+1} / ${Q.length}`;$('tag').textContent=`${q.year} 問${q.qNum}｜${q.category}`;
 $('stem').textContent=q.stem;
 $('items').innerHTML='';q.items.forEach(x=>{const d=document.createElement('div');d.className='pre bg-slate-50 border rounded p-2';d.textContent=x.label+'　'+x.text;$('items').appendChild(d)});
 $('opts').innerHTML='';
 q.choices.forEach((c,k)=>{const b=document.createElement('button');b.className='w-full text-left border-2 rounded-lg p-3 text-sm hover:border-indigo-500 flex gap-2';
  b.innerHTML='<b></b><span></span>';b.children[0].textContent=N[k];b.children[1].textContent=c;b.onclick=()=>pick(k+1);$('opts').appendChild(b)});
}
function pick(p){
 const q=Q[i],good=p==q.correct;if(good)ok++;
 const e={ts:Date.now(),id:q.id,y:q.year,n:q.qNum,cat:q.category,topic:q.topic,pick:p,ans:q.correct,ok:good,sec:Math.round((Date.now()-t0)/1000)};LOGS.unshift(e);save();PEND.push(e);savePend();flush();
 [...$('opts').children].forEach((b,k)=>{b.disabled=true;b.classList.remove('hover:border-indigo-500');
  if(k+1==q.correct)b.classList.add('border-emerald-500','bg-emerald-50');else if(k+1==p)b.classList.add('border-rose-500','bg-rose-50');else b.classList.add('opacity-50')});
 $('res').textContent=good?'正解':`不正解（正答: ${N[q.correct-1]}）`;$('res').className='font-bold '+(good?'text-emerald-600':'text-rose-600');
 $('ex').innerHTML='';if(q.exps){const h=document.createElement('div');h.className='font-bold';h.textContent='各肢の判定(○=記述は正しい / ×=誤り)';$('ex').appendChild(h);const L=q.items.length?q.items.map(x=>x.label):['①','②','③','④'];q.exps.forEach((s,k)=>{const e=document.createElement('div');e.className='pre '+(s[0]=='○'?'text-emerald-600':'text-rose-600');e.textContent=L[k]+' '+s;$('ex').appendChild(e)})}
 $('note').textContent=q.note||'';$('fb').classList.remove('hidden');
}
function next(){i++;if(i<Q.length)load();else{$('qs').classList.add('hidden');$('done').classList.remove('hidden');$('score').textContent=`${ok} / ${Q.length}（${Math.round(ok/Q.length*100)}%）`}}
function reset(){$('done').classList.add('hidden');$('setup').classList.remove('hidden')}
function setUrl(){SYNC_URL=$('url').value.trim();try{localStorage.setItem(KEY+'_url',SYNC_URL)}catch(e){}renderLog()}
async function syncNow(){if(!SYNC_URL){alert('URLが未設定です');return}if(!navigator.onLine){alert('オフラインです');return}await flush();await pull();renderLog();alert('送信しました。スプレッドシートを確認してください(送信待ち:'+PEND.length+'件)')}
function renderLog(){
 $('syn').textContent=(SYNC_URL?'同期URL:設定済み':'同期URL:未設定(スプレッドシートには送られません)')+'｜送信待ち '+PEND.length+'件';$('url').value=SYNC_URL;
 const l=logs(),c=l.filter(x=>x.ok).length,u=new Set(l.filter(x=>x.ok).map(x=>x.id)).size;
 $('sum').textContent=`解答 ${l.length}件 / 正解 ${c}件（${l.length?Math.round(c/l.length*100):0}%）｜一度でも正解した問題 ${u} / ${DB.length}`;
 $('cats').innerHTML='';cats.forEach(k=>{const a=l.filter(x=>x.cat==k),b=a.filter(x=>x.ok).length,p=a.length?Math.round(b/a.length*100):0;
  $('cats').insertAdjacentHTML('beforeend',`<div><div class="flex justify-between"><span>${k}</span><span>${b}/${a.length}（${p}%）</span></div><div class="bg-slate-200 h-2 rounded"><div class="bg-indigo-600 h-2 rounded" style="width:${p}%"></div></div></div>`)});
}
function exp(){const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(logs(),null,1));a.download='kashikin_logs.json';a.click()}
function clr(){if(confirm('この端末の実績を消去しますか？(スプレッドシートの記録は残ります)')){LOGS=[];localStorage.removeItem(KEY);renderLog()}}
function csv(){const h='日時,id,年度,問,分野,論点,選択,正答,正誤,秒\n',r=LOGS.map(x=>{const q=T[x.id]||{};return [new Date(x.ts||0).toLocaleString('ja-JP'),x.id,x.y,x.n,x.cat,q.topic||x.topic||'',x.pick,x.ans||q.correct,x.ok?1:0,x.sec||''].join(',')}).join('\n');
 const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+h+r);a.download='kashikin_logs.csv';a.click()}
function renderAna(){
 const topics=[...new Set(DB.map(q=>q.topic))],tot={};DB.forEach(q=>tot[q.topic]=(tot[q.topic]||0)+1);
 const rows=topics.map(k=>{const a=LOGS.filter(x=>(T[x.id]||{}).topic==k),ok=a.filter(x=>x.ok).length,n=a.length,acc=n?ok/n:null,sec=n?Math.round(a.reduce((s,x)=>s+(x.sec||0),0)/n):0;
  return {k,n,ok,acc,sec,cnt:tot[k],pri:n>=3?(1-acc)*tot[k]:null}}).sort((a,b)=>(b.pri??-1)-(a.pri??-1)||b.cnt-a.cnt);
 $('anaTbl').innerHTML='<table class="w-full text-xs"><tr class="bg-slate-100"><th class="p-1 text-left">論点</th><th>3年出題</th><th>解答</th><th>正答率</th><th>平均秒</th><th>優先度</th></tr>'+rows.map(r=>`<tr class="border-t text-center"><td class="p-1 text-left">${r.k}</td><td>${r.cnt}</td><td>${r.n}</td><td>${r.acc==null?'-':Math.round(r.acc*100)+'%'}</td><td>${r.sec||'-'}</td><td class="font-bold">${r.pri==null?'データ不足':r.pri.toFixed(1)}</td></tr>`).join('')+'</table>';
 const last={},miss={};[...LOGS].reverse().forEach(x=>{last[x.id]=x.ok;if(!x.ok)miss[x.id]=(miss[x.id]||0)+1});
 const w=Object.keys(last).filter(k=>!last[k]).sort((a,b)=>(miss[b]||0)-(miss[a]||0));
 $('anaWrong').innerHTML=w.length?w.slice(0,30).map(k=>`<div>${T[k].year} 問${T[k].qNum}｜${T[k].topic}｜誤答${miss[k]}回</div>`).join(''):'なし(または未解答)';
 const days={};LOGS.forEach(x=>{const d=new Date(x.ts||0).toLocaleDateString('ja-JP');(days[d]=days[d]||[0,0])[0]+=x.ok?1:0;days[d][1]++});
 $('anaDay').innerHTML=Object.entries(days).slice(0,14).map(([d,v])=>`<div>${d}：${v[0]}/${v[1]}（${Math.round(v[0]/v[1]*100)}%）</div>`).join('')||'データなし';
 const top=rows.filter(r=>r.pri!=null).slice(0,3);
 $('anaTip').innerHTML=top.length?top.map(r=>`<div>・「${r.k}」：正答率${Math.round(r.acc*100)}%・3年で${r.cnt}問出題 → 優先して復習(該当問題を『直近で間違えた問題のみ』で再演習)</div>`).join(''):'各論点を3回以上解くと、優先して復習すべき論点を表示します。';
}
</script></body></html>
